<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mitt konto — Heavy Voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/ui-mode.js"></script>
<style>
  .back-link { display: inline-block; margin-bottom: 1rem; color: var(--text-muted); }
  @media (min-width: 601px) {
    .site-header--logo { padding-top: 0.6rem; }
    .container { padding-top: 0.4rem; padding-bottom: 1rem; }
    .container .container { padding-top: 0; padding-bottom: 0; }
    .back-btn { margin-bottom: 0.6rem; }
    .card { margin-top: 1rem !important; }
  }
  .success { color: #4ade80; font-size: 0.9rem; }
</style>
</head>
<body>

<header class="site-header site-header--logo"><a href="/medlem/" class="site-logo-link" aria-label="Heavy Voices – till startsidan"><picture><source srcset="/icons/logo.webp" type="image/webp"><img src="/icons/logo.png" alt="Heavy Voices" class="site-logo-img" width="640" height="493"></picture></a></header>
<div class="container">

<div class="container">
  <a href="#" id="backLink" class="back-btn">&larr; Tillbaka</a>
  <h1>Mitt konto</h1>
  <p class="text-muted" id="welcome"></p>

  <div class="card" style="max-width: 360px; margin-top: 1.5rem;">
    <h3>Byt lösenord</h3>
    <form id="changePasswordForm">
      <input type="password" id="newPassword" placeholder="Nytt lösenord (minst 6 tecken)" required minlength="6" autocomplete="new-password">
      <input type="password" id="newPasswordConfirm" placeholder="Upprepa nytt lösenord" required minlength="6" autocomplete="new-password">
      <button type="submit">Spara nytt lösenord</button>
      <p class="error" id="changeError"></p>
      <p class="success" id="changeSuccess"></p>
    </form>
  </div>

  <div class="card ui-mode-card" style="max-width: 360px; margin-top: 1.5rem;">
    <h3>Utseende <span class="badge" style="margin-left: 0.4rem; vertical-align: middle;">Test</span></h3>
    <p class="text-muted" style="margin: 0 0 0.9rem; font-size: 0.9rem;">Prova ett stramare utseende. Valet gäller bara den här webbläsaren och kan ändras när som helst.</p>
    <div class="ui-mode-opts" role="radiogroup" aria-label="Utseende">
      <label class="ui-mode-opt"><input type="radio" name="uiMode" value=""> <span><b>Nuvarande</b><small>Som sidan ser ut idag</small></span></label>
      <label class="ui-mode-opt"><input type="radio" name="uiMode" value="stram"> <span><b>Stramare</b><small>Plattare ytor, färre effekter</small></span></label>
    </div>
  </div>
</div>
<style>
  .ui-mode-opts { display: flex; flex-direction: column; gap: 0.5rem; }
  .ui-mode-opt { display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 0.85rem; border: 1px solid var(--border); border-radius: 0.6rem; cursor: pointer; }
  .ui-mode-opt:has(input:checked) { border-color: var(--accent); background: rgba(229, 169, 104, 0.08); }
  .ui-mode-opt input { width: auto; margin: 0; accent-color: var(--accent); }
  .ui-mode-opt b { display: block; font-weight: 600; }
  .ui-mode-opt small { display: block; color: var(--text-muted); font-size: 0.85rem; }
</style>
<script>
(function () {
  let cur = '';
  try { cur = localStorage.getItem('hv-ui') === 'stram' ? 'stram' : ''; } catch (e) {}
  document.querySelectorAll('input[name="uiMode"]').forEach(r => {
    r.checked = r.value === cur;
    r.addEventListener('change', () => { if (r.checked && window.hvSetUiMode) hvSetUiMode(r.value); });
  });
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/password-toggle.js" defer></script>
<script src="/js/auth.js"></script>
<script>
(async () => {
  const member = await requireAuth();
  if (member) {
    document.getElementById('welcome').textContent = `Inloggad som ${member.name}`;
    document.getElementById('backLink').href = member.role === 'admin' ? '/admin/' : '/medlem/';
  }
})();

document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('newPassword').value;
  const confirm = document.getElementById('newPasswordConfirm').value;
  const errorEl = document.getElementById('changeError');
  const successEl = document.getElementById('changeSuccess');
  errorEl.textContent = '';
  successEl.textContent = '';

  if (password !== confirm) {
    errorEl.textContent = 'Lösenorden matchar inte.';
    return;
  }

  const { error } = await supabaseClient.auth.updateUser({ password });
  if (error) {
    errorEl.textContent = 'Kunde inte byta lösenord: ' + error.message;
    return;
  }

  successEl.textContent = 'Lösenordet är ändrat.';
  document.getElementById('changePasswordForm').reset();
});
</script>

</body>
</html>
