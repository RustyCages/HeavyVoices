<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heavy Voices</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: Arial, sans-serif;
    }

    /* Gemensam stil för videobakgrunder */
    .bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 1;
      transform: translate(-50%, -50%);
      object-fit: cover;
    }

    /* Som standard (Dator): Visa desktop-video, dölj mobil-video */
    #video-desktop { display: block; }
    #video-mobile  { display: none; }

    /* Om skärmen är smalare än 768px (Mobil): Visa mobil-video, dölj desktop-video */
    @media (max-width: 768px) {
      #video-desktop { display: none; }
      #video-mobile  { display: block; }
    }

    /* Logga in-knapp */
    .header {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 2;
    }

    .login-btn {
      background-color: rgba(0, 0, 0, 0.6);
      border: 2px solid #ffffff;
      color: #ffffff;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>

  <!-- Video för Dator / Stora skärmar -->
  <video autoplay loop muted playsinline id="video-desktop" class="bg-video">
    <source src="heavyvoices-desktop.webm" type="video/webm">
    <source src="heavyvoices-desktop.mp4" type="video/mp4">
  </video>

  <!-- Video för Mobil / Små skärmar -->
  <video autoplay loop muted playsinline id="video-mobile" class="bg-video">
    <source src="heavyvoices-mobile.webm" type="video/webm">
    <source src="heavyvoices-mobile.mp4" type="video/mp4">
  </video>

  <header class="header">
    <a href="https://heavyvoices.se/logga-in.html" class="login-btn">Logga in</a>
  </header>

</body>
</html>
