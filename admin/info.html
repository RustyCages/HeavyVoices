<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Information — Heavy Voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .info-content { white-space: pre-wrap; line-height: 1.7; }
</style>
</head>
<body>

<div class="container">
  <a href="/medlem/" class="back-btn">&larr; Tillbaka</a>
  <h1>Information</h1>

  <div class="card">
    <div class="info-content" id="infoContent"><p class="text-muted">Laddar...</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
async function loadInfo() {
  const { data, error } = await supabaseClient.from('choir_info').select('content').eq('id', 1).single();
  const el = document.getElementById('infoContent');
  if (error) { el.innerHTML = `<p class="error">${error.message}</p>`; return; }
  el.textContent = data.content || 'Ingen information tillagd än.';
}

(async () => {
  const member = await requireAuth();
  if (member) loadInfo();
})();
</script>

</body>
</html>
