<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Låtar — Heavy Voices Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .back-link { display: inline-block; margin-bottom: 1rem; color: var(--text-muted); }
  .success { color: #4ade80; font-size: 0.9rem; }
  .song-item { border-bottom: 1px solid var(--border); padding: 1rem 0; }
  .song-item:last-child { border-bottom: none; }
  .song-title { font-family: 'Roboto Condensed', sans-serif; font-size: 1.3rem; }
  .field-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.4rem 0; font-size: 0.9rem; flex-wrap: wrap; }
  .field-row label { width: 100px; color: var(--text-muted); flex-shrink: 0; }
  .field-row input[type="file"] { flex: 1; min-width: 160px; font-size: 0.85rem; }
  .status-ok { color: #4ade80; font-size: 0.8rem; }
  .status-missing { color: var(--text-muted); font-size: 0.8rem; }
  .open-link { font-size: 0.8rem; white-space: nowrap; }
  textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.6rem 0.9rem; font-family: inherit; min-height: 100px; margin-bottom: 0.5rem;
  }
  .btn-small { padding: 0.35rem 0.8rem; font-size: 0.85rem; }
  .btn-danger { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  details > summary { cursor: pointer; margin-top: 0.6rem; color: var(--text-muted); font-size: 0.85rem; }
  details.lyrics-fold { margin-bottom: 0.4rem; }
  details.lyrics-fold > summary { margin-top: 0.2rem; }
  details.lyrics-fold textarea { margin-top: 0.5rem; }
  .section-hint { margin: 0 0 0.4rem; font-size: 0.8rem; color: var(--text-muted); }
  .common-lyric .field-row label { width: 110px; font-weight: 600; color: var(--text); }
  h4.section-heading { margin: 1.2rem 0 0.3rem 0; font-size: 0.95rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }

  .stem-row, .lyric-row {
    display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    padding: 0.5rem 0; border-bottom: 1px solid var(--border);
  }
  .stem-row:last-of-type, .lyric-row:last-of-type { border-bottom: none; }
  .stem-label, .lyric-label { width: 110px; flex-shrink: 0; font-weight: 600; }
  /* Ordning (↑↓) och eget namn (✎) */
  .order-btns { display: inline-flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .order-btns button { width: 1.6rem; height: 1.1rem; padding: 0; font-size: 0.7rem; line-height: 1; justify-content: center;
    background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); border-radius: 0.3rem; }
  .order-btns button:disabled { opacity: 0.2; cursor: default; }
  .label-edit { width: 130px; flex-shrink: 0; display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.2rem 0.3rem; margin-left: -0.3rem;
    background: none; border: 1px dashed transparent; color: var(--text); font-weight: 600; font-size: 0.95rem; text-align: left; justify-content: flex-start; border-radius: 0.35rem; }
  .label-edit:hover { border-color: var(--border); background: rgba(255,255,255,0.03); color: var(--text); }
  .label-edit .pen { font-size: 0.75rem; opacity: 0.5; }
  .label-edit .orig { font-size: 0.7rem; font-weight: 400; color: var(--text-muted); }
  .stem-filename, .lyric-filename { flex: 1; min-width: 140px; font-size: 0.8rem; color: var(--text-muted); word-break: break-all; }
  .stem-actions, .lyric-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .stem-add-row, .lyric-add-row { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.6rem; flex-wrap: wrap; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.6rem; }
  audio.stem-preview { width: 100%; margin-top: 0.4rem; display: none; }
  .customLabelInput { display: none; min-width: 160px; }
</style>
</head>
<body>

<header class="site-header"><span class="site-logo">Heavy Voices</span></header>
<div class="container">

  <a href="/admin/" class="back-btn">&larr; Tillbaka till admin</a>
  
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap;">
    <h1 style="margin: 0.5rem 0;">Låtar</h1>
    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
      <a href="/admin/stam-synk.html" class="btn btn-outline">&#8644; Stämsynk</a>
      <a href="/admin/text-synk.html" class="btn btn-outline">&#127908; Textsynk (karaoke)</a>
    </div>
  </div>

  <div class="card">
    <h3>Lägg till ny låt</h3>
    <form id="addSongForm">
      <input type="text" id="newTitle" placeholder="Titel" required>
      <button type="submit">Lägg till</button>
      <p class="error" id="addError"></p>
    </form>
  </div>

  <div class="card" style="margin-top: 1.5rem;">
    <h3>Repertoar</h3>
    <div id="songList"><p class="text-muted">Laddar...</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>  
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
const DOC_FIELDS = [
  { kind: 'sheet_music_path', label: 'Noter (PDF)', accept: 'application/pdf' },
  { kind: 'lyrics_pdf_path', label: 'Sångtext (docx, pdf, txt)', accept: '.pdf,.docx,.txt' },
];
const STAMTEXT_FIELDS = [
  { kind: 'lyrics_sopran_path', label: 'Sopran' },
  { kind: 'lyrics_alt_path', label: 'Alt' },
  { kind: 'lyrics_tenor_path', label: 'Tenor' },
  { kind: 'lyrics_bas_path', label: 'Bas' },
];
const STEM_FIELDS = [
  { kind: 'stem_backtrack_path', label: 'Backtrack' },
  { kind: 'stem_sopran_path', label: 'Sopran' },
  { kind: 'stem_alt_path', label: 'Alt' },
  { kind: 'stem_tenor_path', label: 'Tenor' },
  { kind: 'stem_bas_path', label: 'Bas' },
];

let songs = []; // hålls i minnet så stämändringar kan göras utan att stänga panelen

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';
}

async function extractPdfText(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(item => item.str).join(' ') + '\n\n';
  }
  return text.trim();
}
  
function stemFilename(path) {
  if (!path) return '';
  const base = path.split('/').pop();
  const parts = base.split('__');
  return parts.length > 1 ? decodeURIComponent(parts.slice(1).join('__')) : base;
}

// ---------- Nedladdning av stämfiler (endast admin) ----------
async function downloadStem(path) {
  const { data, error } = await supabaseClient.storage.from('heavy-voices-stems')
    .createSignedUrl(path, 3600, { download: stemFilename(path) || true });
  if (error || !data) { alert('Kunde inte ladda ner: ' + (error ? error.message : '')); return; }
  const a = document.createElement('a');
  a.href = data.signedUrl;
  document.body.appendChild(a); a.click(); a.remove();
}

async function downloadAllStems(s, btn) {
  const files = [
    ...STEM_FIELDS.filter(f => s[f.kind]).map(f => ({ label: f.label, path: s[f.kind] })),
    ...(s.extra_stems || []).map(ex => ({ label: ex.label, path: ex.path })),
  ];
  if (!files.length) return;
  const orig = btn.innerHTML;
  btn.disabled = true;
  try {
    const zip = new JSZip();
    const used = new Set();
    for (let i = 0; i < files.length; i++) {
      btn.textContent = `Hämtar ${i + 1}/${files.length}…`;
      const { data, error } = await supabaseClient.storage.from('heavy-voices-stems').download(files[i].path);
      if (error) throw new Error(`${files[i].label}: ${error.message}`);
      // "Sopran - originalnamn.mp3", unikt även om två spår har samma filnamn
      let name = `${files[i].label} - ${stemFilename(files[i].path)}`.replace(/[\\/:*?"<>|]/g, '_');
      while (used.has(name)) name = name.replace(/(\.[^.]*)?$/, ' (2)$1');
      used.add(name);
      zip.file(name, data);
    }
    btn.textContent = 'Packar…';
    // Ljud komprimeras inte nämnvärt mer – STORE går snabbast
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${(s.title || 'lat').replace(/[\\/:*?"<>|]/g, '_')} - stämfiler.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) {
    alert('Kunde inte skapa zip: ' + (e.message || e));
  } finally {
    btn.disabled = false;
    btn.innerHTML = orig;
  }
}

function safeName(name) {
  return name.replace(/[^a-zA-Z0-9.\-]/g, '_');
}

// Gemensam sångtext (fil) visas ihop med stämtexterna; noter får en egen sektion längst ner.
const NOTER_FIELD = DOC_FIELDS.find(f => f.kind === 'sheet_music_path');
const COMMON_LYRIC_FIELD = { ...DOC_FIELDS.find(f => f.kind === 'lyrics_pdf_path'), label: 'Gemensam' };
const DOC_AREAS = [
  { field: COMMON_LYRIC_FIELD, area: id => `commonLyricArea-${id}` },
  { field: NOTER_FIELD,        area: id => `noterArea-${id}` },
];
function wireDocAreas(s) {
  DOC_AREAS.forEach(({ field, area }) => wireDocField(s, field, 'heavy-voices-noter', `#${area(s.id)}`));
}

function docRow(s, field, bucket) {
  const has = !!s[field.kind];
  return `
    <div class="field-row">
      <label>${field.label}</label>
      ${has ? '' : `<input type="file" accept="${field.accept || '.pdf,.docx'}" class="fileInput" data-id="${s.id}" data-kind="${field.kind}" data-bucket="${bucket}">`}
      <span class="fileStatus ${has ? 'status-ok' : 'status-missing'}" data-id="${s.id}" data-kind="${field.kind}">${has ? '✓ ' + stemFilename(s[field.kind]) : 'saknas'}</span>
      <a class="open-link" data-id="${s.id}" data-kind="${field.kind}" data-bucket="${bucket}" href="#" target="_blank" style="display: ${has ? 'inline' : 'none'};">Öppna</a>
      ${has ? `<button type="button" class="btn-small btn-danger removeDocBtn" data-id="${s.id}" data-kind="${field.kind}" data-bucket="${bucket}">Ta bort</button>` : ''}
    </div>`;
}

function wireDocField(s, field, bucket, containerSelector) {
  const container = document.querySelector(containerSelector);
  if (!container) return;
  const input = container.querySelector(`.fileInput[data-id="${s.id}"][data-kind="${field.kind}"]`);
  if (input) {
    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const errEl = document.querySelector(`.uploadError[data-id="${s.id}"]`);
      const path = `${s.id}/${field.kind}__${safeName(file.name)}`;
      const { error: uploadError } = await supabaseClient.storage.from(bucket).upload(path, file, { upsert: true });
      if (uploadError) { if (errEl) errEl.textContent = 'Uppladdning misslyckades: ' + uploadError.message; return; }
      const { error: updateError } = await supabaseClient.from('songs').update({ [field.kind]: path }).eq('id', s.id);
      if (updateError) { if (errEl) errEl.textContent = 'Kunde inte spara filväg: ' + updateError.message; return; }
      s[field.kind] = path;
      rerenderDocsAndStamtext(s);
    });
  }
  const removeBtn = container.querySelector(`.removeDocBtn[data-id="${s.id}"][data-kind="${field.kind}"]`);
  if (removeBtn) {
    removeBtn.addEventListener('click', async () => {
      if (!confirm('Ta bort filen?')) return;
      const path = s[field.kind];
      if (path) await supabaseClient.storage.from(bucket).remove([path]);
      await supabaseClient.from('songs').update({ [field.kind]: null }).eq('id', s.id);
      s[field.kind] = null;
      rerenderDocsAndStamtext(s);
    });
  }
  const openLink = container.querySelector(`.open-link[data-id="${s.id}"][data-kind="${field.kind}"]`);
  if (openLink && s[field.kind]) {
    supabaseClient.storage.from(bucket).createSignedUrl(s[field.kind], 3600).then(({ data: signed }) => {
      if (!signed) return;
      const isDocx = s[field.kind].toLowerCase().endsWith('.docx');
      openLink.href = isDocx
        ? `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(signed.signedUrl)}`
        : signed.signedUrl;
      openLink.style.display = 'inline';
    });
  }
}

function rerenderDocsAndStamtext(s) {
  const stamtextArea = document.getElementById(`stamtextArea-${s.id}`);
  DOC_AREAS.forEach(({ field, area }) => {
    const el = document.getElementById(area(s.id));
    if (el) el.innerHTML = docRow(s, field, 'heavy-voices-noter');
  });
  wireDocAreas(s);
  if (stamtextArea) {
    stamtextArea.innerHTML = renderLyricsArea(s);
    wireLyricsArea(s);
  }
}

// ---------- Stämtexter (fasta STAMTEXT_FIELDS + extra_lyrics/"Annat") ----------
// =========================================================
// Eget namn och ordning på stämfiler och stämtexter.
// songs.stem_meta / songs.lyric_meta = { order: [nyckel, ...], labels: { nyckel: 'Namn' } }
// nyckel = kolumnnamn för fasta stämmor (t.ex. 'stem_sopran_path') eller id för "Annat".
// =========================================================
function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function partItems(s, fields, extras, metaKey) {
  const meta = s[metaKey] || {};
  const labels = meta.labels || {}, order = meta.order || [];
  const items = [
    ...fields.filter(f => s[f.kind]).map(f => ({ key: f.kind, fixed: f.kind, defLabel: f.label, path: s[f.kind] })),
    ...(extras || []).map(ex => ({ key: ex.id, extra: ex.id, defLabel: ex.label, path: ex.path })),
  ];
  items.forEach(it => { it.label = labels[it.key] || it.defLabel; });
  const pos = k => { const i = order.indexOf(k); return i === -1 ? 1e6 : i; };
  return items.map((it, i) => ({ it, i })).sort((a, b) => (pos(a.it.key) - pos(b.it.key)) || (a.i - b.i)).map(x => x.it);
}

function partControls(it, idx, count) {
  const data = it.fixed ? `data-fixed="${it.fixed}"` : `data-extra="${it.extra}"`;
  return `
      <span class="order-btns">
        <button type="button" class="moveBtn" data-key="${esc(it.key)}" data-dir="-1" title="Flytta upp" ${idx === 0 ? 'disabled' : ''}>&#9650;</button>
        <button type="button" class="moveBtn" data-key="${esc(it.key)}" data-dir="1" title="Flytta ned" ${idx === count - 1 ? 'disabled' : ''}>&#9660;</button>
      </span>
      <button type="button" class="label-edit renameBtn" data-key="${esc(it.key)}" ${data} title="Byt namn">
        <span>${esc(it.label)}</span><span class="pen">&#9998;</span>
      </button>`;
}

async function saveMeta(s, metaKey, meta) {
  const { error } = await supabaseClient.from('songs').update({ [metaKey]: meta }).eq('id', s.id);
  if (error) {
    alert('Kunde inte spara: ' + error.message + (/column|schema/i.test(error.message) ? '\n\nKör SQL-migreringen för stämnamn/ordning först.' : ''));
    return false;
  }
  s[metaKey] = meta;
  return true;
}

// Kopplar ↑↓ och ✎ i ett område. extrasKey = 'extra_stems' | 'extra_lyrics'
function wirePartControls(area, s, fields, extrasKey, metaKey, rerender) {
  area.querySelectorAll('.moveBtn').forEach(btn => btn.addEventListener('click', async () => {
    const keys = partItems(s, fields, s[extrasKey], metaKey).map(it => it.key);
    const i = keys.indexOf(btn.dataset.key), j = i + Number(btn.dataset.dir);
    if (i < 0 || j < 0 || j >= keys.length) return;
    [keys[i], keys[j]] = [keys[j], keys[i]];
    const meta = { ...(s[metaKey] || {}), order: keys };
    if (await saveMeta(s, metaKey, meta)) rerender();
  }));
  area.querySelectorAll('.renameBtn').forEach(btn => btn.addEventListener('click', async () => {
    const it = partItems(s, fields, s[extrasKey], metaKey).find(x => x.key === btn.dataset.key);
    if (!it) return;
    const input = prompt(`Nytt namn (tomt = ${it.fixed ? 'standardnamnet "' + it.defLabel + '"' : 'oförändrat'}):`, it.label);
    if (input == null) return;
    const name = input.trim();
    if (it.extra) {
      if (!name || name === it.label) return;
      // "Annat" har namnet i sin egen lista – uppdatera där så att alla sidor ser det
      const list = (s[extrasKey] || []).map(x => x.id === it.extra ? { ...x, label: name } : x);
      const { error } = await supabaseClient.from('songs').update({ [extrasKey]: list }).eq('id', s.id);
      if (error) { alert('Kunde inte spara: ' + error.message); return; }
      s[extrasKey] = list;
    } else {
      const labels = { ...((s[metaKey] || {}).labels || {}) };
      if (!name || name === it.defLabel) delete labels[it.key]; else labels[it.key] = name;
      if (!(await saveMeta(s, metaKey, { ...(s[metaKey] || {}), labels }))) return;
    }
    rerender();
  }));
}

function renderLyricsArea(s) {
  if (!Array.isArray(s.extra_lyrics)) s.extra_lyrics = [];

  const items = partItems(s, STAMTEXT_FIELDS, s.extra_lyrics, 'lyric_meta');
  const fixedRows = items.map((it, idx) => {
    const data = it.fixed ? `data-fixed="${it.fixed}"` : `data-extra="${it.extra}"`;
    return `
    <div class="lyric-row">
      ${partControls(it, idx, items.length)}
      <span class="lyric-filename">${stemFilename(it.path)}</span>
      <div class="lyric-actions">
        <a class="btn-small openLyricBtn" data-id="${s.id}" ${data} href="#" style="background: transparent; border: 1px solid var(--border);">Öppna</a>
        <button type="button" class="btn-small btn-danger removeLyricBtn" data-id="${s.id}" ${data}>Ta bort</button>
      </div>
    </div>`;
  }).join('');
  const extraRows = '';

  const available = STAMTEXT_FIELDS.filter(f => !s[f.kind]);
  const options = available.map(f => `<option value="${f.kind}">${f.label}</option>`).join('') + `<option value="__other__">Annat...</option>`;

  const addRow = `
    <div class="lyric-add-row">
      <select class="lyricAddSelect" data-id="${s.id}">${options}</select>
      <input type="text" class="customLabelInput lyricCustomLabel" data-id="${s.id}" placeholder="Namn på texten">
      <input type="file" accept=".pdf,.docx,.txt" class="lyricAddFile" data-id="${s.id}">
      <span class="loading-note" data-lyricadd="${s.id}" style="font-size: 0.8rem; color: var(--text-muted);"></span>
    </div>
  `;

  return `
    ${fixedRows || ''}
    ${extraRows || ''}
    ${!fixedRows && !extraRows ? '<p class="text-muted" style="font-size: 0.85rem;">Inga stämtexter uppladdade än.</p>' : ''}
    ${addRow}
  `;
}

function wireLyricsArea(s) {
  const area = document.getElementById(`stamtextArea-${s.id}`);
  if (!area) return;
  wirePartControls(area, s, STAMTEXT_FIELDS, 'extra_lyrics', 'lyric_meta', () => rerenderDocsAndStamtext(s));

area.querySelectorAll('.openLyricBtn').forEach(btn => {
  btn.addEventListener('click', async (e) => {
    e.preventDefault();
    const path = btn.dataset.fixed ? s[btn.dataset.fixed] : (s.extra_lyrics.find(x => x.id === btn.dataset.extra) || {}).path;
    if (!path) return;
    const { data: signed } = await supabaseClient.storage.from('heavy-voices-noter').createSignedUrl(path, 3600);
    if (!signed) return;
    const isDocx = path.toLowerCase().endsWith('.docx');
    const url = isDocx
      ? `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(signed.signedUrl)}`
      : signed.signedUrl;
    window.open(url, '_blank');
  });
});

  area.querySelectorAll('.removeLyricBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Ta bort texten?')) return;
      if (btn.dataset.fixed) {
        const kind = btn.dataset.fixed;
        const path = s[kind];
        if (path) await supabaseClient.storage.from('heavy-voices-noter').remove([path]);
        await supabaseClient.from('songs').update({ [kind]: null }).eq('id', s.id);
        s[kind] = null;
      } else {
        const id = btn.dataset.extra;
        const ex = s.extra_lyrics.find(x => x.id === id);
        if (ex) await supabaseClient.storage.from('heavy-voices-noter').remove([ex.path]);
        s.extra_lyrics = s.extra_lyrics.filter(x => x.id !== id);
        await supabaseClient.from('songs').update({ extra_lyrics: s.extra_lyrics }).eq('id', s.id);
      }
      rerenderDocsAndStamtext(s);
    });
  });

  const select = area.querySelector('.lyricAddSelect');
  const customLabel = area.querySelector('.lyricCustomLabel');
  const fileInput = area.querySelector('.lyricAddFile');

  if (select) {
    select.addEventListener('change', () => {
      customLabel.style.display = select.value === '__other__' ? 'inline-block' : 'none';
    });
  }

  if (fileInput) {
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const note = area.querySelector(`.loading-note[data-lyricadd="${s.id}"]`);
      const isOther = select.value === '__other__';
      const label = isOther ? customLabel.value.trim() : STAMTEXT_FIELDS.find(f => f.kind === select.value).label;
      if (isOther && !label) { note.textContent = 'Ange ett namn för texten först'; return; }

      note.textContent = `Laddar upp ${file.name}...`;

      if (isOther) {
        const id = crypto.randomUUID();
        const path = `${s.id}/lyric_${id}__${safeName(file.name)}`;
        const { error: uploadError } = await supabaseClient.storage.from('heavy-voices-noter').upload(path, file, { upsert: true });
        if (uploadError) { note.textContent = 'Fel: ' + uploadError.message; return; }
        s.extra_lyrics.push({ id, label, path });
        const { error } = await supabaseClient.from('songs').update({ extra_lyrics: s.extra_lyrics }).eq('id', s.id);
        if (error) { note.textContent = 'Fel: ' + error.message; return; }
      } else {
        const kind = select.value;
        const path = `${s.id}/${kind}__${safeName(file.name)}`;
        const { error: uploadError } = await supabaseClient.storage.from('heavy-voices-noter').upload(path, file, { upsert: true });
        if (uploadError) { note.textContent = 'Fel: ' + uploadError.message; return; }
        const { error } = await supabaseClient.from('songs').update({ [kind]: path }).eq('id', s.id);
        if (error) { note.textContent = 'Fel: ' + error.message; return; }
        s[kind] = path;
      }
      rerenderDocsAndStamtext(s);
    });
  }
}

// ---------- Stämfiler (ljud: fasta STEM_FIELDS + extra_stems/"Annat") ----------
function renderStemsArea(s) {
  if (!Array.isArray(s.extra_stems)) s.extra_stems = [];

  const uploaded = STEM_FIELDS.filter(f => s[f.kind]);
  const available = STEM_FIELDS.filter(f => !s[f.kind]);

  const items = partItems(s, STEM_FIELDS, s.extra_stems, 'stem_meta');
  const rows = items.map((it, idx) => {
    const data = it.fixed ? `data-fixed="${it.fixed}"` : `data-extra="${it.extra}"`;
    return `
    <div class="stem-row">
      ${partControls(it, idx, items.length)}
      <span class="stem-filename">${stemFilename(it.path)}</span>
      <div class="stem-actions">
        <button type="button" class="btn-small playStemBtn" data-id="${s.id}" ${data} style="background: transparent; border: 1px solid var(--border);">&#9658; Spela</button>
        <button type="button" class="btn-small dlStemBtn" data-path="${it.path}" title="Ladda ner" style="background: transparent; border: 1px solid var(--border); color: var(--text);">&#11015;</button>
        <button type="button" class="btn-small btn-danger removeStemBtn" data-id="${s.id}" ${data}>Ta bort</button>
      </div>
    </div>`;
  }).join('');
  const extraRows = '';

  const options = available.map(f => `<option value="${f.kind}">${f.label}</option>`).join('') + `<option value="__other__">Annat...</option>`;

  const addRow = `
    <div class="stem-add-row">
      <select class="stemAddSelect" data-id="${s.id}">${options}</select>
      <input type="text" class="customLabelInput stemCustomLabel" data-id="${s.id}" placeholder="Namn på stämman/spåret">
      <input type="file" accept="audio/*" class="stemAddFile" data-id="${s.id}">
      <span class="loading-note" data-stemadd="${s.id}" style="font-size: 0.8rem; color: var(--text-muted);"></span>
    </div>
  `;

  return `
    ${rows}
    ${!items.length ? '<p class="text-muted" style="font-size: 0.85rem;">Inga stämfiler uppladdade än.</p>' : ''}
    ${addRow}
    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.6rem;">
      ${(uploaded.length + s.extra_stems.length) >= 2 ? `<a href="/admin/stam-synk.html?song=${encodeURIComponent(s.id)}" class="btn btn-outline btn-small">&#8644; Synka stämmorna</a>` : ''}
      ${(uploaded.length + s.extra_stems.length) >= 1 ? `<button type="button" class="btn-small zipStemsBtn" style="background: transparent; border: 1px solid var(--border); color: var(--text);">&#11015; Ladda ner alla (.zip)</button>` : ''}
    </div>
    <audio class="stem-preview" id="preview-${s.id}" controls></audio>
  `;
}

function wireStemsArea(s) {
  const area = document.getElementById(`stemsArea-${s.id}`);
  if (!area) return;
  wirePartControls(area, s, STEM_FIELDS, 'extra_stems', 'stem_meta', () => { area.innerHTML = renderStemsArea(s); wireStemsArea(s); });

  area.querySelectorAll('.playStemBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const path = btn.dataset.fixed ? s[btn.dataset.fixed] : (s.extra_stems.find(x => x.id === btn.dataset.extra) || {}).path;
      if (!path) return;
      const audioEl = document.getElementById(`preview-${s.id}`);
      const originalText = btn.innerHTML;
      btn.textContent = 'Laddar...';
      const { data: signed } = await supabaseClient.storage.from('heavy-voices-stems').createSignedUrl(path, 3600);
      btn.innerHTML = originalText;
      if (signed) {
        audioEl.src = signed.signedUrl;
        audioEl.style.display = 'block';
        audioEl.play();
      }
    });
  });

  area.querySelectorAll('.dlStemBtn').forEach(btn => {
    btn.addEventListener('click', () => downloadStem(btn.dataset.path));
  });
  const zipBtn = area.querySelector('.zipStemsBtn');
  if (zipBtn) zipBtn.addEventListener('click', () => downloadAllStems(s, zipBtn));

  area.querySelectorAll('.removeStemBtn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Ta bort stämfilen?')) return;
      if (btn.dataset.fixed) {
        const kind = btn.dataset.fixed;
        const path = s[kind];
        if (path) await supabaseClient.storage.from('heavy-voices-stems').remove([path]);
        await supabaseClient.from('songs').update({ [kind]: null }).eq('id', s.id);
        s[kind] = null;
      } else {
        const id = btn.dataset.extra;
        const ex = s.extra_stems.find(x => x.id === id);
        if (ex) await supabaseClient.storage.from('heavy-voices-stems').remove([ex.path]);
        s.extra_stems = s.extra_stems.filter(x => x.id !== id);
        await supabaseClient.from('songs').update({ extra_stems: s.extra_stems }).eq('id', s.id);
      }
      area.innerHTML = renderStemsArea(s);
      wireStemsArea(s);
    });
  });

  const select = area.querySelector('.stemAddSelect');
  const customLabel = area.querySelector('.stemCustomLabel');
  const fileInput = area.querySelector('.stemAddFile');

  if (select) {
    select.addEventListener('change', () => {
      customLabel.style.display = select.value === '__other__' ? 'inline-block' : 'none';
    });
  }

  if (fileInput) {
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const note = area.querySelector(`.loading-note[data-stemadd="${s.id}"]`);
      const isOther = select.value === '__other__';
      const label = isOther ? customLabel.value.trim() : STEM_FIELDS.find(f => f.kind === select.value).label;
      if (isOther && !label) { note.textContent = 'Ange ett namn för spåret först'; return; }

      note.textContent = `Laddar upp ${file.name}...`;

      if (isOther) {
        const id = crypto.randomUUID();
        const path = `${s.id}/stem_${id}__${safeName(file.name)}`;
        const { error: uploadError } = await supabaseClient.storage.from('heavy-voices-stems').upload(path, file, { upsert: true });
        if (uploadError) { note.textContent = 'Fel: ' + uploadError.message; return; }
        s.extra_stems.push({ id, label, path });
        const { error: updateError } = await supabaseClient.from('songs').update({ extra_stems: s.extra_stems }).eq('id', s.id);
        if (updateError) { note.textContent = 'Fel: ' + updateError.message; return; }
      } else {
        const kind = select.value;
        const path = `${s.id}/${kind}__${safeName(file.name)}`;
        const { error: uploadError } = await supabaseClient.storage.from('heavy-voices-stems').upload(path, file, { upsert: true });
        if (uploadError) { note.textContent = 'Fel: ' + uploadError.message; return; }
        const { error: updateError } = await supabaseClient.from('songs').update({ [kind]: path }).eq('id', s.id);
        if (updateError) { note.textContent = 'Fel: ' + updateError.message; return; }
        s[kind] = path;
      }
      area.innerHTML = renderStemsArea(s);
      wireStemsArea(s);
    });
  }
}

async function loadSongs() {
  const { data, error } = await supabaseClient
    .from('songs')
    .select('*')
    .order('title');

  const listEl = document.getElementById('songList');

  if (error) {
    listEl.innerHTML = `<p class="error">Kunde inte hämta låtar: ${error.message}</p>`;
    return;
  }

  songs = data || [];

  if (!songs.length) {
    listEl.innerHTML = `<p class="text-muted">Inga låtar än.</p>`;
    return;
  }

  listEl.innerHTML = songs.map(s => `
    <div class="song-item">
      <div class="song-title">${s.title}</div>

      <details>
        <summary>Redigera text och filer</summary>

        <div style="margin-top: 0.75rem;">
          <h4 class="section-heading">Sångtext &amp; karaoke</h4>
          <div class="field-row" style="margin-bottom: 0.4rem;">
            <span class="${s.lyrics_plain ? 'status-ok' : 'status-missing'}">${s.lyrics_plain ? '✓ ' + s.lyrics_plain.split('\n').filter(l => l.trim()).length + ' rader' : 'ingen text'}</span>
            <span class="${s.lyrics_lrc ? 'status-ok' : 'status-missing'}">${s.lyrics_lrc ? '✓ synkad' : 'ej synkad'}</span>
            <a href="/admin/text-synk.html?id=${encodeURIComponent(s.id)}" class="btn btn-outline btn-small">&#127908; Redigera text &amp; synk</a>
          </div>
          <details class="lyrics-fold">
            <summary>Snabbredigera sångtexten här</summary>
            <textarea data-id="${s.id}" class="lyricsField" placeholder="Sångtext">${s.lyrics_plain || ''}</textarea>
            <div class="field-row" style="margin-bottom: 0.75rem;">
              <label>Läs in fil</label>
              <input type="file" accept=".docx,.txt,.pdf" class="docxInput" data-id="${s.id}">
              <span class="docxStatus" data-id="${s.id}"></span>
            </div>
            <button type="button" class="saveLyricsBtn btn-small" data-id="${s.id}">Spara text</button>
            <button type="button" class="btn-small btn-danger clearLyricsBtn" data-id="${s.id}">Ta bort sångtext</button>
          </details>

          <h4 class="section-heading">Sångtexter (dokument)</h4>
          <p class="section-hint">Gemensam text för alla, och/eller en egen text per stämma. Medlemmarna kan öppna och ladda ner dem.</p>
          <div id="commonLyricArea-${s.id}" class="common-lyric">${docRow(s, COMMON_LYRIC_FIELD, 'heavy-voices-noter')}</div>
          <div id="stamtextArea-${s.id}">${renderLyricsArea(s)}</div>

          <h4 class="section-heading">Stämfiler (ljud)</h4>
          <div id="stemsArea-${s.id}">${renderStemsArea(s)}</div>

          <h4 class="section-heading">Noter</h4>
          <div id="noterArea-${s.id}">${docRow(s, NOTER_FIELD, 'heavy-voices-noter')}</div>

          <button type="button" class="btn-danger btn-small deleteSongBtn" data-id="${s.id}" style="margin-top: 0.75rem;">Ta bort låt</button>
          <button type="button" class="btn-small closeDetailsBtn" data-id="${s.id}" style="margin-top: 0.75rem; margin-left: 0.5rem; background: transparent; border: 1px solid var(--border); color: var(--text);">OK / Stäng</button>
          <p class="error uploadError" data-id="${s.id}"></p>
        </div>
      </details>
    </div>
  `).join('');

  songs.forEach(s => {
    wireStemsArea(s);
    wireLyricsArea(s);
    wireDocAreas(s);
  });

  document.querySelectorAll('.saveLyricsBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.dataset.id;
      const text = document.querySelector(`.lyricsField[data-id="${id}"]`).value;
      const { error } = await supabaseClient.from('songs').update({ lyrics_plain: text }).eq('id', id);
      if (error) { alert('Kunde inte spara: ' + error.message); return; }
      btn.textContent = 'Sparat!';
      setTimeout(() => btn.textContent = 'Spara text', 1500);
    });
  });

  document.querySelectorAll('.clearLyricsBtn').forEach(btn => {
  btn.addEventListener('click', async (e) => {
    const id = e.target.dataset.id;
    if (!confirm('Ta bort sångtexten?')) return;
    const { error } = await supabaseClient.from('songs').update({ lyrics_plain: null }).eq('id', id);
    if (error) { alert('Kunde inte ta bort: ' + error.message); return; }
    document.querySelector(`.lyricsField[data-id="${id}"]`).value = '';
  });
});
  
  document.querySelectorAll('.docxInput').forEach(input => {
  input.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const id = e.target.dataset.id;
    const textarea = document.querySelector(`.lyricsField[data-id="${id}"]`);
    const statusEl = document.querySelector(`.docxStatus[data-id="${id}"]`);
    statusEl.textContent = 'Läser...';
    try {
      const ext = file.name.split('.').pop().toLowerCase();
      let text;
      if (ext === 'docx') {
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer });
        text = result.value;
      } else if (ext === 'txt') {
        text = await file.text();
      } else if (ext === 'pdf') {
        text = await extractPdfText(file);
      } else {
        statusEl.textContent = 'Filtypen stöds inte (använd .docx, .txt eller .pdf)';
        statusEl.className = 'docxStatus';
        return;
      }
      textarea.value = text;
      statusEl.textContent = 'Inläst — granska och klicka Spara text';
      statusEl.className = 'docxStatus status-ok';
    } catch (err) {
      statusEl.textContent = 'Kunde inte läsa filen: ' + err.message;
      statusEl.className = 'docxStatus';
    }
  });
});

  document.querySelectorAll('.closeDetailsBtn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.target.closest('details').removeAttribute('open');
    });
  });

  document.querySelectorAll('.deleteSongBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.dataset.id;
      if (!confirm('Ta bort låten permanent? Filer i storage måste rensas manuellt separat.')) return;
      const { error } = await supabaseClient.from('songs').delete().eq('id', id);
      if (error) alert('Kunde inte ta bort: ' + error.message);
      else loadSongs();
    });
  });
}

document.getElementById('addSongForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = document.getElementById('newTitle').value;
  const errorEl = document.getElementById('addError');
  errorEl.textContent = '';

  const { error } = await supabaseClient.from('songs').insert({ title });
  if (error) {
    errorEl.textContent = error.message;
    return;
  }
  document.getElementById('addSongForm').reset();
  loadSongs();
});

(async () => {
  const member = await requireAuth('admin');
  if (member) loadSongs();
})();
</script>

</body>
