<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalender — Heavy Voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .tabs { display:flex; gap:0.75rem; margin-bottom:1.75rem; flex-wrap:wrap; }
  .tab-btn { background:rgba(255,255,255,0.06); color:#d1d5db; border:1px solid rgba(255,255,255,0.12); padding:0.6rem 1.2rem; }
  .tab-btn.active { background:var(--accent); color:#111317; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  details.event-card { margin-bottom:1.1rem; padding:1.25rem 1.5rem; }
  details.event-card summary { list-style:none; cursor:pointer; }
  details.event-card summary::-webkit-details-marker { display:none; }
  details.event-card[open] summary { margin-bottom:0.9rem; }
  details.event-card.past { opacity:0.5; }

  .row-between { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  .event-summary-main { display:flex; align-items:baseline; gap:0.9rem; flex-wrap:wrap; }
  .event-date { font-family:'Roboto Condensed', sans-serif; font-size:1.15rem; min-width:95px; }
  .event-title { font-weight:700; }
  .event-type-rep { color:#60a5fa; }
  .event-type-konsert { color:var(--accent); }
  .event-type-ovrigt { color:var(--text-muted); }

  .event-body-row { padding:0.3rem 0; }
  .event-body-row > div:last-child { white-space:pre-wrap; } /* behåll radbrytningar i info-texten */
  .event-body-label { font-size:0.75rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:0.15rem; }
</style>
</head>
<body>
<header class="site-header site-header--small"><a href="/medlem/" class="site-logo-link" aria-label="Heavy Voices – till startsidan"><picture><source srcset="/icons/logo-text.webp" type="image/webp"><img src="/icons/logo-text.png" alt="Heavy Voices" class="site-logo-text" width="480" height="220"></picture></a></header>
<div class="container">
  <a href="/medlem/" class="back-btn">&larr; Tillbaka</a>
  <h1>Kalender</h1>
  <p style="margin:0 0 1rem;"><a href="https://meet.jit.si/HeavyVoices-Mote-k7r2q9" target="_blank" rel="noopener" class="btn btn-outline" title="Öppnar körens videomöte i Jitsi Meet (gratis, inget konto behövs för att delta)">📹 Videomöte</a></p>

  <style>
    .month-view { margin-bottom: 1.2rem; }
    .month-view > summary { cursor: pointer; font-weight: 700; }
    .month-nav { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin: 0.9rem 0 0.6rem; }
    .month-nav strong { text-transform: capitalize; }
    .month-nav button { padding: 0.35rem 0.8rem; }
    .m-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem; }
    .m-dow { font-size: 0.72rem; color: var(--text-muted); text-align: center; padding: 0.2rem 0; }
    .m-cell { min-width: 0; min-height: 2.8rem; padding: 0.25rem 0.1rem; border-radius: 0.5rem; border: 1px solid var(--border); background: rgba(255,255,255,0.03); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 0.15rem; font: inherit; cursor: pointer; }
    .m-cell.empty { border: none; background: none; cursor: default; }
    .m-cell.today { border-color: var(--accent); }
    .m-cell.sel { background: rgba(229,169,104,0.22); border-color: var(--accent); }
    .m-num { font-size: 0.85rem; font-variant-numeric: tabular-nums; }
    .m-dots { display: flex; gap: 0.2rem; min-height: 0.45rem; }
    .m-dot { display: inline-block; width: 0.45rem; height: 0.45rem; border-radius: 50%; background: #9ca3af; flex-shrink: 0; }
    .m-dot.rep { background: var(--accent); }
    .m-dot.konsert { background: #a78bfa; }
    .m-dot.ovrigt { background: #60a5fa; }
    .m-day { margin-top: 0.8rem; }
    .m-ev { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0; border-top: 1px solid var(--border); font-size: 0.92rem; }
  </style>
  <details class="card month-view" id="monthView">
    <summary>📅 Månadsvy</summary>
    <div class="month-nav">
      <button type="button" class="btn-outline" id="mPrev" aria-label="Föregående månad">‹</button>
      <strong id="mTitle"></strong>
      <button type="button" class="btn-outline" id="mNext" aria-label="Nästa månad">›</button>
    </div>
    <div class="m-grid" id="mGrid"></div>
    <div class="m-day" id="mDay"></div>
  </details>

  <div class="tabs">
    <button class="tab-btn active" id="tabRepBtn">Reptider</button>
    <button class="tab-btn" id="tabKonsertBtn">Konserter</button>
    <button class="tab-btn" id="tabOvrigtBtn">Övrigt</button>
  </div>

  <div class="tab-panel active" id="tabRep">
    <div id="listRep"><p class="text-muted">Laddar...</p></div>
  </div>
  <div class="tab-panel" id="tabKonsert">
    <div id="listKonsert"><p class="text-muted">Laddar...</p></div>
  </div>
  <div class="tab-panel" id="tabOvrigt">
    <div id="listOvrigt"><p class="text-muted">Laddar...</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
const typeLabels = { rep: 'Repetition', konsert: 'Konsert', ovrigt: 'Övrigt' };
const emptyLabels = {
  rep: 'Inga repetitioner inlagda än.',
  konsert: 'Inga konserter inlagda än.',
  ovrigt: 'Inget övrigt inlagt än.'
};

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short', year: 'numeric' });
}

// =========================================================
// Tabs
// =========================================================
document.getElementById('tabRepBtn').addEventListener('click', () => switchTab('rep'));
document.getElementById('tabKonsertBtn').addEventListener('click', () => switchTab('konsert'));
document.getElementById('tabOvrigtBtn').addEventListener('click', () => switchTab('ovrigt'));

function switchTab(name) {
  document.getElementById('tabRepBtn').classList.toggle('active', name === 'rep');
  document.getElementById('tabKonsertBtn').classList.toggle('active', name === 'konsert');
  document.getElementById('tabOvrigtBtn').classList.toggle('active', name === 'ovrigt');
  document.getElementById('tabRep').classList.toggle('active', name === 'rep');
  document.getElementById('tabKonsert').classList.toggle('active', name === 'konsert');
  document.getElementById('tabOvrigt').classList.toggle('active', name === 'ovrigt');
}

// =========================================================
// Events
// =========================================================
function timeRange(ev) {
  if (!ev.event_time) return '';
  return ' ' + ev.event_time.slice(0,5) + (ev.end_time ? '–' + ev.end_time.slice(0,5) : '');
}
  
  function renderEventCard(ev, isPast) {
  const details = document.createElement('details');
  details.className = 'event-card card modern-card' + (isPast ? ' past' : '');

  const summary = document.createElement('summary');
  summary.innerHTML = `
    <div class="row-between">
      <div class="event-summary-main">
        <span class="event-date">${formatDate(ev.event_date)}${timeRange(ev)}</span>
        <span class="event-title event-type-${ev.event_type}">${escapeHtml(ev.title)}</span>
      </div>
      <span class="text-muted">Visa ▾</span>
    </div>
  `;
  details.appendChild(summary);

  const body = document.createElement('div');
  if (!ev.location && !ev.notes) {
    body.innerHTML = '<p class="text-muted">Inga fler detaljer.</p>';
  } else {
    if (ev.location) {
      body.innerHTML += `
        <div class="event-body-row">
          <div class="event-body-label">Plats</div>
          <div>${escapeHtml(ev.location)}</div>
        </div>`;
    }
    if (ev.notes) {
      body.innerHTML += `
        <div class="event-body-row">
          <div class="event-body-label">Anteckningar</div>
          <div>${escapeHtml(ev.notes)}</div>
        </div>`;
    }
  }
  details.appendChild(body);
  return details;
}

function renderGroup(containerEl, events, type) {
  containerEl.innerHTML = '';
  if (!events.length) {
    containerEl.innerHTML = `<p class="text-muted">${emptyLabels[type]}</p>`;
    return;
  }
  const todayStr = new Date().toISOString().slice(0, 10);
  events.forEach(ev => {
    containerEl.appendChild(renderEventCard(ev, ev.event_date < todayStr));
  });
}

// ---------- månadsvy (alla medlemmar, inkl. stämledare) ----------
let monthEvents = [];
let mYear = null, mMonth = null, mSelected = null;
function renderMonth() {
  if (mYear === null) { const t = new Date(); mYear = t.getFullYear(); mMonth = t.getMonth(); }
  const todayYmd = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Stockholm' });
  const pad = n => String(n).padStart(2, '0');
  const first = new Date(mYear, mMonth, 1);
  const startDow = (first.getDay() + 6) % 7;                 // måndag = 0
  const daysIn = new Date(mYear, mMonth + 1, 0).getDate();
  const byDay = {};
  monthEvents.forEach(ev => { (byDay[ev.event_date] = byDay[ev.event_date] || []).push(ev); });
  document.getElementById('mTitle').textContent = first.toLocaleDateString('sv-SE', { month: 'long', year: 'numeric' });
  let cells = ['Mån', 'Tis', 'Ons', 'Tors', 'Fre', 'Lör', 'Sön'].map(w => `<div class="m-dow">${w}</div>`).join('');
  for (let i = 0; i < startDow; i++) cells += '<div class="m-cell empty"></div>';
  for (let d = 1; d <= daysIn; d++) {
    const k = `${mYear}-${pad(mMonth + 1)}-${pad(d)}`;
    const types = [...new Set((byDay[k] || []).map(e => e.event_type || 'ovrigt'))];
    const dots = types.map(t => `<span class="m-dot ${t}"></span>`).join('');
    cells += `<button type="button" class="m-cell${k === todayYmd ? ' today' : ''}${k === mSelected ? ' sel' : ''}" data-day="${k}"><span class="m-num">${d}</span><span class="m-dots">${dots}</span></button>`;
  }
  document.getElementById('mGrid').innerHTML = cells;
  document.querySelectorAll('#mGrid .m-cell[data-day]').forEach(b => b.addEventListener('click', () => {
    mSelected = mSelected === b.dataset.day ? null : b.dataset.day; renderMonth();
  }));
  const dayEl = document.getElementById('mDay');
  if (!mSelected) { dayEl.innerHTML = '<p class="text-muted">Tryck på en dag för att se vad som är inlagt.</p>'; }
  else {
    const evs = byDay[mSelected] || [];
    dayEl.innerHTML = evs.length
      ? evs.map(ev => `<div class="m-ev"><span class="m-dot ${ev.event_type || 'ovrigt'}"></span><span>${ev.event_time ? ev.event_time.slice(0, 5) + ' ' : ''}${escapeHtml(ev.title)}</span></div>`).join('')
      : '<p class="text-muted">Inget inlagt denna dag.</p>';
  }
  if (!renderMonth.bound) {
    renderMonth.bound = true;
    document.getElementById('mPrev').addEventListener('click', () => { mMonth--; if (mMonth < 0) { mMonth = 11; mYear--; } mSelected = null; renderMonth(); });
    document.getElementById('mNext').addEventListener('click', () => { mMonth++; if (mMonth > 11) { mMonth = 0; mYear++; } mSelected = null; renderMonth(); });
  }
}

async function loadEvents() {
  const { data: events, error } = await supabaseClient
    .from('events').select('*').order('event_date').order('event_time');

  if (error) {
    ['listRep', 'listKonsert', 'listOvrigt'].forEach(id => {
      document.getElementById(id).innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
    });
    return;
  }

  const byType = { rep: [], konsert: [], ovrigt: [] };
  (events || []).forEach(ev => {
    (byType[ev.event_type] || byType.ovrigt).push(ev);
  });

  renderGroup(document.getElementById('listRep'), byType.rep, 'rep');
  renderGroup(document.getElementById('listKonsert'), byType.konsert, 'konsert');
  renderGroup(document.getElementById('listOvrigt'), byType.ovrigt, 'ovrigt');
  monthEvents = events || [];
  renderMonth();
}

(async () => {
  const member = await requireAuth();
  if (member) loadEvents();
})();
</script>

</body>
</html>
