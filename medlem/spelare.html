<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelaren — Heavy Voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .back-link { display: inline-block; margin-bottom: 1rem; color: var(--text-muted); }
  .track-card { border-bottom: 1px solid var(--border); }
  .track-card:last-child { border-bottom: none; }
  .track-header { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 0; cursor: pointer; list-style: none; }
  .track-header::-webkit-details-marker { display: none; }
  .track-header.playing { color: var(--accent); }
  .mixer-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.5rem 0; }
  .mixer-row label { width: 70px; color: var(--text-muted); font-size: 0.85rem; flex-shrink: 0; }
  .mixer-row input[type="range"] { flex: 1; }
  .mixer-row .vol-value { width: 32px; text-align: right; font-size: 0.8rem; color: var(--text-muted); }
  .floating-player {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-elevated); border-top: 1px solid var(--border);
    padding: 0.8rem 1.2rem; display: none; align-items: center; justify-content: space-between; gap: 1rem;
    z-index: 50;
  }
  .floating-player .now-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; }
  .floating-player .controls { display: flex; gap: 0.5rem; }
  .container { padding-bottom: 6rem; }
  .loading-note { font-size: 0.8rem; color: var(--text-muted); }
</style>
</head>
<body>

<div class="container">
  <a href="/medlem/" class="back-link">&larr; Tillbaka</a>
  <h1>Spelaren</h1>

  <div class="card">
    <h3>Min spellista</h3>
    <div id="playlistSection"><p class="text-muted">Laddar...</p></div>
  </div>
</div>

<div class="floating-player" id="floatingPlayer">
  <div class="now-title" id="nowPlayingTitle">–</div>
  <div class="controls">
    <button id="prevBtn" type="button">&larr;</button>
    <button id="playPauseBtn" type="button">Spela</button>
    <button id="nextBtn" type="button">&rarr;</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
const stemFields = { Backtrack: 'stem_backtrack_path', Sopran: 'stem_sopran_path', Alt: 'stem_alt_path', Tenor: 'stem_tenor_path', Bas: 'stem_bas_path' };
const volColumns = { Backtrack: 'vol_backtrack', Sopran: 'vol_sopran', Alt: 'vol_alt', Tenor: 'vol_tenor', Bas: 'vol_bas' };
const priorityOrder = ['Backtrack', 'Sopran', 'Alt', 'Tenor', 'Bas'];

let playlist = [];
let currentIndex = -1;
let isPlaying = false;
let currentMemberId = null;

let audioCtx = null;
let gainNodes = {};
let activeSources = {};
let referenceLabel = null;
let playbackStartTime = 0;
let playbackOffset = 0;
let manualStop = false;

function ensureAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    for (const label of priorityOrder) {
      const gain = audioCtx.createGain();
      gain.connect(audioCtx.destination);
      gainNodes[label] = gain;
    }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

async function loadPlaylist() {
  const { data, error } = await supabaseClient
    .from('member_playlists')
    .select('id, song_id, vol_backtrack, vol_sopran, vol_alt, vol_tenor, vol_bas, songs(*)')
    .eq('member_id', currentMemberId)
    .order('created_at');

  const el = document.getElementById('playlistSection');

  if (error) {
    el.innerHTML = `<p class="error">Kunde inte hämta spellistan: ${error.message}</p>`;
    return;
  }

  if (!data.length) {
    el.innerHTML = `<p class="text-muted">Din spellista är tom. Lägg till låtar från repertoaren.</p>`;
    playlist = [];
    return;
  }

  playlist = data.map(row => ({
    playlistId: row.id,
    song: row.songs,
    volumes: { Backtrack: row.vol_backtrack, Sopran: row.vol_sopran, Alt: row.vol_alt, Tenor: row.vol_tenor, Bas: row.vol_bas },
    signedUrls: null,
    buffers: null,
  }));
  renderPlaylist();
}

function renderPlaylist() {
  const el = document.getElementById('playlistSection');
  el.innerHTML = playlist.map((item, i) => `
    <div class="track-card">
      <details ${i === currentIndex ? 'open' : ''}>
        <summary class="track-header ${i === currentIndex ? 'playing' : ''}">
          <span>${item.song.title}</span>
        </summary>
        <div style="padding: 0.3rem 0 1rem 0;">
          ${priorityOrder.map(label => {
            const has = !!item.song[stemFields[label]];
            return `
              <div class="mixer-row">
                <label>${label}</label>
                <input type="range" min="0" max="100" value="${item.volumes[label]}"
                  class="volSlider" data-index="${i}" data-label="${label}" ${has ? '' : 'disabled'}>
                <span class="vol-value">${has ? item.volumes[label] : '–'}</span>
              </div>`;
          }).join('')}
          <div style="margin-top: 0.5rem; display: flex; gap: 0.5rem; align-items: center;">
            <button type="button" class="playTrackBtn" data-index="${i}">Spela denna låt</button>
            <button type="button" class="btn-danger removeTrackBtn" data-id="${item.playlistId}">Ta bort</button>
            <span class="loading-note" data-index="${i}"></span>
          </div>
        </div>
      </details>
    </div>
  `).join('');

  document.querySelectorAll('.playTrackBtn').forEach(btn => {
    btn.addEventListener('click', (e) => playAt(parseInt(e.target.dataset.index), 0));
  });

  document.querySelectorAll('.removeTrackBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.dataset.id;
      await supabaseClient.from('member_playlists').delete().eq('id', id);
      loadPlaylist();
    });
  });

  document.querySelectorAll('.volSlider').forEach(slider => {
    slider.addEventListener('input', (e) => {
      const i = parseInt(e.target.dataset.index);
      const label = e.target.dataset.label;
      const value = parseInt(e.target.value);
      playlist[i].volumes[label] = value;
      e.target.nextElementSibling.textContent = value;
      if (i === currentIndex && gainNodes[label]) {
        gainNodes[label].gain.value = value / 100;
      }
    });
    slider.addEventListener('change', async (e) => {
      const i = parseInt(e.target.dataset.index);
      const label = e.target.dataset.label;
      const item = playlist[i];
      await supabaseClient.from('member_playlists')
        .update({ [volColumns[label]]: item.volumes[label] })
        .eq('id', item.playlistId);
    });
  });
}

async function ensureSignedUrls(index) {
  const item = playlist[index];
  if (item.signedUrls) return item.signedUrls;
  const urls = {};
  for (const label of priorityOrder) {
    const path = item.song[stemFields[label]];
    if (!path) { urls[label] = null; continue; }
    const { data: signed } = await supabaseClient.storage.from('heavy-voices-stems').createSignedUrl(path, 3600);
    urls[label] = signed ? signed.signedUrl : null;
  }
  item.signedUrls = urls;
  return urls;
}

async function ensureBuffers(index) {
  const item = playlist[index];
  if (item.buffers) return item.buffers;

  const note = document.querySelector(`.loading-note[data-index="${index}"]`);
  if (note) note.textContent = 'Laddar ljud...';

  const urls = await ensureSignedUrls(index);
  const buffers = {};

  await Promise.all(priorityOrder.map(async (label) => {
    if (!urls[label]) { buffers[label] = null; return; }
    try {
      const res = await fetch(urls[label]);
      const arrayBuffer = await res.arrayBuffer();
      buffers[label] = await audioCtx.decodeAudioData(arrayBuffer);
    } catch (err) {
      buffers[label] = null;
    }
  }));

  item.buffers = buffers;
  if (note) note.textContent = '';
  return buffers;
}

function stopSources() {
  for (const label of Object.keys(activeSources)) {
    const source = activeSources[label];
    source.onended = null;
    try { source.stop(); } catch (e) {}
  }
  activeSources = {};
}

async function playAt(index, offsetSeconds) {
  if (index < 0 || index >= playlist.length) {
    stopSources();
    isPlaying = false;
    currentIndex = -1;
    renderFloatingPlayer();
    return;
  }

  ensureAudioContext();
  manualStop = true;
  stopSources();

  currentIndex = index;
  const item = playlist[index];

  const buffers = await ensureBuffers(index);

  referenceLabel = priorityOrder.find(l => buffers[l]) || null;
  if (!referenceLabel) {
    alert('Inga stämfiler uppladdade för den här låten.');
    return;
  }

  const startAt = audioCtx.currentTime + 0.15;

  for (const label of priorityOrder) {
    if (!buffers[label]) continue;
    const source = audioCtx.createBufferSource();
    source.buffer = buffers[label];
    source.connect(gainNodes[label]);
    gainNodes[label].gain.value = (item.volumes[label] || 0) / 100;
    source.start(startAt, offsetSeconds);
    activeSources[label] = source;
  }

  manualStop = false;
  activeSources[referenceLabel].onended = () => {
    if (!manualStop) playAt(currentIndex + 1, 0);
  };

  playbackStartTime = startAt;
  playbackOffset = offsetSeconds;
  isPlaying = true;
  renderFloatingPlayer();
  renderPlaylist();
}

function pauseAll() {
  if (currentIndex < 0) return;
  manualStop = true;
  const elapsed = Math.max(0, audioCtx.currentTime - playbackStartTime + playbackOffset);
  stopSources();
  playbackOffset = elapsed;
  isPlaying = false;
  renderFloatingPlayer();
}

function resumeAll() {
  if (currentIndex < 0) return;
  playAt(currentIndex, playbackOffset);
}

function renderFloatingPlayer() {
  const bar = document.getElementById('floatingPlayer');
  if (currentIndex < 0 || !playlist[currentIndex]) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  document.getElementById('nowPlayingTitle').textContent = playlist[currentIndex].song.title;
  document.getElementById('playPauseBtn').textContent = isPlaying ? 'Pausa' : 'Spela';
}

document.getElementById('playPauseBtn').addEventListener('click', () => {
  if (currentIndex < 0) return;
  isPlaying ? pauseAll() : resumeAll();
});
document.getElementById('prevBtn').addEventListener('click', () => playAt(currentIndex - 1, 0));
document.getElementById('nextBtn').addEventListener('click', () => playAt(currentIndex + 1, 0));

(async () => {
  const member = await requireAuth();
  if (member) {
    currentMemberId = member.id;
    loadPlaylist();
  }
})();
</script>

</body>
</html>
