<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inkorg — Heavy Voices Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/ui-mode.js"></script>
<style>
  .ib-tabs { display:flex; gap:0.4rem; flex-wrap:wrap; margin:0 0 1rem; }
  .ib-tabs button { padding:0.4rem 0.9rem; font-size:0.92rem; }
  .ib-tabs button.active { border-color:var(--accent); color:var(--accent); }
  .ib-count { display:inline-block; min-width:1.3em; padding:0 0.35em; margin-left:0.3em; border-radius:999px; background:var(--accent); color:var(--on-accent); font-size:0.78rem; font-weight:700; text-align:center; }

  .ib-layout { display:grid; grid-template-columns:minmax(260px, 360px) minmax(0, 1fr); gap:1.25rem; align-items:start; }
  @media (max-width: 860px) {
    .ib-layout { grid-template-columns:minmax(0, 1fr); }
    .ib-layout.has-open .ib-list-card { display:none; }
    .ib-layout:not(.has-open) .ib-view { display:none; }
  }
  .ib-list-card { padding:0.4rem; }
  .ib-list { display:flex; flex-direction:column; }
  .ib-item { display:block; width:100%; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--border); color:var(--text); padding:0.7rem 0.75rem; cursor:pointer; font:inherit; border-radius:0; }
  .ib-item:last-child { border-bottom:0; }
  .ib-item:hover { background:rgba(255,255,255,0.03); }
  .ib-item.active { background:rgba(229,169,104,0.08); box-shadow:inset 3px 0 0 var(--accent); }
  .ib-item-top { display:flex; justify-content:space-between; gap:0.6rem; font-size:0.92rem; }
  .ib-item-from { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ib-item-date { color:var(--text-muted); font-size:0.8rem; white-space:nowrap; flex:none; }
  .ib-item-subj { margin-top:0.15rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ib-item-snip { margin-top:0.15rem; color:var(--text-muted); font-size:0.85rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ib-item.unread .ib-item-from, .ib-item.unread .ib-item-subj { font-weight:700; }
  .ib-item.unread .ib-item-from::before { content:''; display:inline-block; width:0.5em; height:0.5em; border-radius:50%; background:var(--accent); margin-right:0.45em; vertical-align:middle; }
  .ib-n { color:var(--text-muted); font-weight:400; font-size:0.82rem; }

  .ib-view { padding:1rem 1.2rem; min-width:0; }
  .ib-view-head { display:flex; justify-content:space-between; align-items:flex-start; gap:0.8rem; flex-wrap:wrap; margin-bottom:0.8rem; }
  .ib-view-head h2 { margin:0; font-size:1.25rem; overflow-wrap:anywhere; flex:1 1 16rem; }
  .ib-actions { display:flex; gap:0.4rem; flex-wrap:wrap; }
  .ib-actions button { font-size:0.85rem; padding:0.3rem 0.7rem; }
  .ib-actions .ib-del { border-color:var(--danger); color:#fca5a5; }
  .ib-back { display:none; margin-bottom:0.8rem; }
  @media (max-width: 860px) { .ib-back { display:inline-flex; } }

  .ib-msg { border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:0.9rem; overflow:hidden; }
  .ib-msg.out { border-color:rgba(229,169,104,0.3); }
  .ib-msg-head { display:flex; justify-content:space-between; gap:0.6rem; flex-wrap:wrap; padding:0.6rem 0.8rem; background:rgba(255,255,255,0.03); font-size:0.88rem; }
  .ib-msg-head .who { overflow-wrap:anywhere; }
  .ib-msg-head .meta { color:var(--text-muted); font-size:0.8rem; }
  .ib-msg-head .to { display:block; color:var(--text-muted); font-size:0.8rem; }
  .ib-out-tag { color:var(--accent); font-weight:700; margin-right:0.3em; }
  .ib-body { padding:0.8rem; }
  .ib-text { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.5; margin:0; font:inherit; }
  .ib-frame { width:100%; border:0; background:#fff; border-radius:6px; min-height:120px; display:block; }
  .ib-bodytools { display:flex; gap:0.4rem; flex-wrap:wrap; padding:0 0.8rem 0.6rem; }
  .ib-bodytools button { font-size:0.8rem; padding:0.2rem 0.6rem; }
  .ib-files { display:flex; flex-wrap:wrap; gap:0.4rem; padding:0 0.8rem 0.8rem; }
  .ib-files button { font-size:0.85rem; padding:0.3rem 0.6rem; }

  .ib-reply { display:grid; gap:0.6rem; margin-top:1rem; }
  .ib-reply textarea { width:100%; min-height:8rem; resize:vertical; box-sizing:border-box; }
  .ib-reply .row { display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap; }
  .ib-reply select { width:auto; max-width:100%; }
  .ib-status { min-height:1.2em; margin:0 0 0.8rem; font-size:0.92rem; color:var(--text-muted); }
  .ib-status.is-error { color:var(--danger); }
</style>
</head>
<body>
<header class="site-header site-header--small"><a href="/admin/" class="site-logo-link" aria-label="Heavy Voices – till startsidan"><picture><source srcset="/icons/logo-text.webp" type="image/webp"><img src="/icons/logo-text.png" alt="Heavy Voices" class="site-logo-text" width="480" height="220"></picture></a></header>
<div class="container">
  <a href="/admin/medlemmar.html" class="back-btn">&larr; Tillbaka till Medlemmar</a>
  <h1>Inkorg</h1>
  <p class="text-muted" style="margin:0 0 1rem;">Mejl till info@heavyvoices.se. Bara admin ser inkorgen. Svar skickas från info@heavyvoices.se.</p>

  <div class="ib-tabs" role="tablist">
    <button type="button" class="btn-outline active" data-folder="inkorg">Inkorg<span class="ib-count" id="unreadCount" hidden></span></button>
    <button type="button" class="btn-outline" data-folder="arkiv">Arkiv</button>
    <button type="button" class="btn-outline" data-folder="skrap">Skräp</button>
  </div>

  <p class="ib-status" id="ibStatus" role="status"></p>

  <div class="ib-layout" id="ibLayout">
    <div class="card ib-list-card"><div class="ib-list" id="ibList"><p class="text-muted" style="padding:0.6rem;">Laddar...</p></div></div>
    <div class="card ib-view" id="ibView"><p class="text-muted">Välj ett mejl i listan.</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
const FOLDER_NAMES = { inkorg: 'Inkorg', arkiv: 'Arkiv', skrap: 'Skräp' };
const LIST_COLS = 'id, thread_id, direction, from_email, from_name, to_email, subject, text_body, attachments, folder, is_read, created_at';

let me = null;
let folder = 'inkorg';
let rows = [];          // senaste mejlen (utan html), grupperas till trådar
let openThread = null;  // thread_id
let signatures = [];
const visaBilder = new Set();   // meddelanden där externa bilder får laddas

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function setStatus(t, err) {
  const el = document.getElementById('ibStatus');
  el.textContent = t || '';
  el.classList.toggle('is-error', !!err);
}
function formatWhen(iso, kort) {
  const d = new Date(iso);
  const idag = new Date().toDateString() === d.toDateString();
  if (kort && idag) return d.toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Stockholm' });
  if (kort) return d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short', timeZone: 'Europe/Stockholm' });
  return d.toLocaleString('sv-SE', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Europe/Stockholm' });
}
function fileSize(b) {
  if (!b) return '';
  return b > 1024 * 1024 ? (b / 1024 / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' kB';
}
const snippet = t => (t || '').replace(/\s+/g, ' ').trim().slice(0, 140);
const linkify = html => html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');

// ---------- trådar ----------
function threads() {
  const map = new Map();
  for (const r of rows) {
    if (!map.has(r.thread_id)) map.set(r.thread_id, []);
    map.get(r.thread_id).push(r);
  }
  return [...map.entries()].map(([id, msgs]) => {
    msgs.sort((a, b) => a.created_at.localeCompare(b.created_at));
    const last = msgs[msgs.length - 1];
    const firstIn = msgs.find(m => m.direction === 'in');
    return {
      id, msgs, last,
      folder: last.folder,
      unread: msgs.some(m => m.direction === 'in' && !m.is_read),
      who: firstIn ? (firstIn.from_name || firstIn.from_email) : ('Till ' + (last.to_email || '')),
      subject: (firstIn || last).subject || '(inget ämne)',
      files: msgs.some(m => (m.attachments || []).length),
    };
  }).sort((a, b) => b.last.created_at.localeCompare(a.last.created_at));
}

async function loadList() {
  const { data, error } = await supabaseClient.from('inbox_messages').select(LIST_COLS)
    .order('created_at', { ascending: false }).limit(1000);
  if (error) {
    document.getElementById('ibList').innerHTML = `<p class="error" style="padding:0.6rem;">${escapeHtml(error.message)}</p>`;
    return;
  }
  rows = data || [];
  renderList();
}

function renderList() {
  const alla = threads();
  const n = alla.filter(t => t.folder === 'inkorg' && t.unread).length;
  const badge = document.getElementById('unreadCount');
  badge.hidden = !n; badge.textContent = n;

  const lista = alla.filter(t => t.folder === folder);
  document.getElementById('ibList').innerHTML = lista.length
    ? lista.map(t => `
      <button type="button" class="ib-item${t.unread ? ' unread' : ''}${t.id === openThread ? ' active' : ''}" data-thread="${t.id}">
        <div class="ib-item-top">
          <span class="ib-item-from">${escapeHtml(t.who)}${t.msgs.length > 1 ? ` <span class="ib-n">(${t.msgs.length})</span>` : ''}</span>
          <span class="ib-item-date">${t.files ? '📎 ' : ''}${formatWhen(t.last.created_at, true)}</span>
        </div>
        <div class="ib-item-subj">${escapeHtml(t.subject)}</div>
        <div class="ib-item-snip">${escapeHtml(snippet(t.last.text_body))}</div>
      </button>`).join('')
    : `<p class="text-muted" style="padding:0.6rem;">Inga mejl i ${FOLDER_NAMES[folder].toLowerCase()}.</p>`;
}

// ---------- visa en tråd ----------
async function openThreadView(id) {
  openThread = id;
  document.getElementById('ibLayout').classList.add('has-open');
  renderList();
  const view = document.getElementById('ibView');
  view.innerHTML = '<p class="text-muted">Laddar...</p>';

  const { data: msgs, error } = await supabaseClient.from('inbox_messages').select('*')
    .eq('thread_id', id).order('created_at', { ascending: true });
  if (error) { view.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`; return; }
  if (!msgs?.length) { closeView(); return; }

  const t = threads().find(x => x.id === id) || { folder: msgs[msgs.length - 1].folder };
  const firstIn = msgs.find(m => m.direction === 'in');
  const subject = (firstIn || msgs[0]).subject || '(inget ämne)';
  const lastIn = [...msgs].reverse().find(m => m.direction === 'in');
  const flytta = [
    t.folder !== 'inkorg' ? `<button type="button" class="btn-outline" data-move="inkorg">Till inkorgen</button>` : '',
    t.folder !== 'arkiv' ? `<button type="button" class="btn-outline" data-move="arkiv">Arkivera</button>` : '',
    t.folder !== 'skrap' ? `<button type="button" class="btn-outline" data-move="skrap">Skräp</button>` : '',
  ].join('');

  view.innerHTML = `
    <button type="button" class="btn-outline ib-back" data-back>&larr; Till listan</button>
    <div class="ib-view-head">
      <h2>${escapeHtml(subject)}</h2>
      <div class="ib-actions">
        ${flytta}
        <button type="button" class="btn-outline" data-unread>Markera oläst</button>
        <button type="button" class="btn-outline ib-del" data-delete>Ta bort</button>
      </div>
    </div>
    ${msgs.map(m => msgHtml(m)).join('')}
    ${lastIn ? `
    <form class="ib-reply" id="replyForm">
      <label for="replyText" style="font-weight:700;">Svara ${escapeHtml(lastIn.from_name || lastIn.from_email)} <span class="text-muted" style="font-weight:400;">&lt;${escapeHtml(lastIn.from_email)}&gt;</span></label>
      <textarea id="replyText" maxlength="20000" required placeholder="Skriv ditt svar..."></textarea>
      <div class="row">
        <label for="replySig" class="text-muted" style="margin:0;font-size:0.9rem;">Signatur</label>
        <select id="replySig">
          <option value="">Hälsningar, ${escapeHtml(me.name || '')}, Heavy Voices</option>
          ${signatures.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}
        </select>
        <button type="submit" class="btn-gold">Skicka svar</button>
      </div>
      <p class="text-muted" style="margin:0;font-size:0.85rem;">Det ursprungliga mejlet citeras automatiskt under ditt svar.</p>
    </form>` : ''}`;

  msgs.forEach(m => mountBody(m));

  // Markera som läst
  if (msgs.some(m => m.direction === 'in' && !m.is_read)) {
    await supabaseClient.from('inbox_messages').update({ is_read: true }).eq('thread_id', id).eq('is_read', false);
    rows.forEach(r => { if (r.thread_id === id) r.is_read = true; });
    renderList();
  }
}

function msgHtml(m) {
  const out = m.direction === 'out';
  const who = out
    ? `<span class="ib-out-tag">Svar</span>${escapeHtml(m.from_name || 'Heavy Voices')}`
    : `<strong>${escapeHtml(m.from_name || m.from_email)}</strong>${m.from_name ? ` <span class="text-muted">&lt;${escapeHtml(m.from_email)}&gt;</span>` : ''}`;
  const files = (m.attachments || []).filter(a => !(a.cid && m.html_body && m.html_body.includes('cid:' + a.cid)));
  return `
    <div class="ib-msg${out ? ' out' : ''}" data-msg="${m.id}">
      <div class="ib-msg-head">
        <span class="who">${who}<span class="to">Till: ${escapeHtml(m.to_email || '')}${m.cc ? ` · Kopia: ${escapeHtml(m.cc)}` : ''}</span></span>
        <span class="meta">${formatWhen(m.created_at)}</span>
      </div>
      <div class="ib-body" data-body></div>
      ${m.html_body ? `<div class="ib-bodytools">
        <button type="button" class="btn-outline" data-images="${m.id}">${visaBilder.has(m.id) ? 'Dölj externa bilder' : 'Visa externa bilder'}</button>
        ${m.text_body ? `<button type="button" class="btn-outline" data-plain="${m.id}">Visa som text</button>` : ''}
      </div>` : ''}
      ${files.length ? `<div class="ib-files">${files.map(a =>
        `<button type="button" class="btn-outline" data-file="${escapeHtml(a.path)}" data-name="${escapeHtml(a.name)}">📎 ${escapeHtml(a.name)}${a.size ? ` <span class="text-muted">(${fileSize(a.size)})</span>` : ''}</button>`
      ).join('')}</div>` : ''}
    </div>`;
}

let threadMsgs = {};   // id → meddelande, för omritning av en kropp
async function mountBody(m, plain) {
  threadMsgs[m.id] = m;
  const box = document.querySelector(`.ib-msg[data-msg="${m.id}"] [data-body]`);
  if (!box) return;
  if (!m.html_body || plain) {
    box.innerHTML = `<pre class="ib-text">${linkify(escapeHtml(m.text_body || '(tomt meddelande)'))}</pre>`;
    return;
  }

  // Inbäddade bilder (cid:) pekas om till signerade länkar till bilagorna i R2
  let html = m.html_body.replace(/<meta[^>]+http-equiv\s*=\s*["']?refresh[^>]*>/gi, '');
  const inline = (m.attachments || []).filter(a => a.cid && html.includes('cid:' + a.cid));
  if (inline.length) {
    const { data } = await supabaseClient.storage.from('heavy-voices-inbox').createSignedUrls(inline.map(a => a.path), 3600);
    (data || []).forEach((d, i) => { if (d.signedUrl) html = html.split('cid:' + inline[i].cid).join(d.signedUrl); });
  }

  // Säker visning: inga skript (sandbox utan allow-scripts + CSP), länkar öppnas i ny flik,
  // externa bilder blockeras tills man väljer att visa dem (spårningspixlar).
  const img = visaBilder.has(m.id) ? 'https: data:' : 'data: https://*.r2.cloudflarestorage.com';
  const head = `<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src ${img}; style-src 'unsafe-inline'; font-src data:;">` +
    `<base target="_blank"><style>html,body{margin:0;padding:0;}body{font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#111;background:#fff;padding:12px;overflow-wrap:anywhere;}img{max-width:100%;height:auto;}</style>`;
  const frame = document.createElement('iframe');
  frame.className = 'ib-frame';
  frame.setAttribute('sandbox', 'allow-same-origin allow-popups allow-popups-to-escape-sandbox');
  frame.setAttribute('referrerpolicy', 'no-referrer');
  frame.title = 'Mejlets innehåll';
  frame.srcdoc = `<!DOCTYPE html><html><head>${head}</head><body>${html}</body></html>`;
  frame.addEventListener('load', () => {
    const fit = () => { try { frame.style.height = (frame.contentDocument.documentElement.scrollHeight + 4) + 'px'; } catch (_) {} };
    fit(); setTimeout(fit, 300); setTimeout(fit, 1500);
    try { frame.contentDocument.querySelectorAll('img').forEach(i => i.addEventListener('load', fit)); } catch (_) {}
  });
  box.innerHTML = '';
  box.appendChild(frame);
}

function closeView() {
  openThread = null;
  document.getElementById('ibLayout').classList.remove('has-open');
  document.getElementById('ibView').innerHTML = '<p class="text-muted">Välj ett mejl i listan.</p>';
  renderList();
}

// ---------- åtgärder ----------
async function moveThread(to) {
  const { error } = await supabaseClient.from('inbox_messages').update({ folder: to }).eq('thread_id', openThread);
  if (error) return setStatus('Kunde inte flytta: ' + error.message, true);
  rows.forEach(r => { if (r.thread_id === openThread) r.folder = to; });
  setStatus(`Flyttad till ${FOLDER_NAMES[to].toLowerCase()}.`);
  closeView();
}

async function markUnread() {
  const lastIn = rows.filter(r => r.thread_id === openThread && r.direction === 'in').sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
  if (!lastIn) return;
  const { error } = await supabaseClient.from('inbox_messages').update({ is_read: false }).eq('id', lastIn.id);
  if (error) return setStatus(error.message, true);
  lastIn.is_read = false;
  closeView();
}

async function deleteThread() {
  const msgs = rows.filter(r => r.thread_id === openThread);
  if (!confirm(`Ta bort tråden${msgs.length > 1 ? ` med ${msgs.length} mejl` : ''} och alla bilagor? Det går inte att ångra.`)) return;
  const paths = msgs.flatMap(m => (m.attachments || []).map(a => a.path));
  if (paths.length) {
    const { error } = await supabaseClient.storage.from('heavy-voices-inbox').remove(paths);
    if (error) return setStatus('Kunde inte ta bort bilagorna: ' + error.message, true);
  }
  const { error } = await supabaseClient.from('inbox_messages').delete().eq('thread_id', openThread);
  if (error) return setStatus('Kunde inte ta bort: ' + error.message, true);
  rows = rows.filter(r => r.thread_id !== openThread);
  setStatus('Tråden är borttagen.');
  closeView();
}

async function openFile(path, name) {
  setStatus('Hämtar fil...');
  const { data, error } = await supabaseClient.storage.from('heavy-voices-inbox').createSignedUrl(path, 60, { download: name });
  if (error || !data?.signedUrl) return setStatus('Kunde inte hämta filen: ' + (error?.message || 'okänt fel'), true);
  setStatus('');
  window.open(data.signedUrl, '_blank', 'noopener');
}

async function sendReply(form) {
  const text = form.querySelector('#replyText').value.trim();
  if (!text) return setStatus('Skriv ett svar först.', true);
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true;
  setStatus('Skickar...');
  const { data, error } = await supabaseClient.functions.invoke('inbox-send', {
    body: { thread_id: openThread, message: text, signature_id: form.querySelector('#replySig').value || undefined },
  });
  btn.disabled = false;
  let msg = error?.message || data?.error;
  if (error) { try { const j = await error.context?.json(); if (j?.error) msg = j.error; } catch (_) {} }
  if (msg) return setStatus('Kunde inte skicka: ' + msg, true);
  setStatus(`Svaret är skickat till ${data.to}.`);
  const id = openThread;
  await loadList();
  await openThreadView(id);
}

// ---------- händelser ----------
document.querySelector('.ib-tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-folder]');
  if (!b) return;
  folder = b.dataset.folder;
  document.querySelectorAll('.ib-tabs button').forEach(x => x.classList.toggle('active', x === b));
  closeView();
});

document.getElementById('ibList').addEventListener('click', e => {
  const b = e.target.closest('button[data-thread]');
  if (b) openThreadView(b.dataset.thread);
});

document.getElementById('ibView').addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.back !== undefined) return closeView();
  if (t.dataset.move) return moveThread(t.dataset.move);
  if (t.dataset.unread !== undefined) return markUnread();
  if (t.dataset.delete !== undefined) return deleteThread();
  if (t.dataset.file) return openFile(t.dataset.file, t.dataset.name);
  if (t.dataset.images) {
    const id = t.dataset.images;
    if (visaBilder.has(id)) visaBilder.delete(id); else visaBilder.add(id);
    t.textContent = visaBilder.has(id) ? 'Dölj externa bilder' : 'Visa externa bilder';
    return mountBody(threadMsgs[id]);
  }
  if (t.dataset.plain) {
    const id = t.dataset.plain;
    const plain = t.textContent === 'Visa som text';
    t.textContent = plain ? 'Visa formaterat' : 'Visa som text';
    return mountBody(threadMsgs[id], plain);
  }
});

document.getElementById('ibView').addEventListener('submit', e => {
