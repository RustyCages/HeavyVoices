<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Animerade guider till Heavy Voices: så blir du medlem, så funkar medlemssidan och adminguide.">
<link rel="icon" href="/heavyvoices-logo.png">
<title>Heavy Voices Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Roboto+Condensed:wght@400;700&display=swap">
<style>
/* Layout: telefon-demo till vänster (överst på mobil), stegtext + kontroller + steglista till höger. Samma mörka guld-tema som heavyvoices.se. */
:root {
  --bg: #121418;
  --bg-2: #1d222e;
  --surface: #1a1e27;
  --surface-2: #232937;
  --line: rgba(255,255,255,0.08);
  --text: #f3f4f6;
  --muted: #9ca3af;
  --accent: #E5A968;
  --accent-ink: #111317;
  --ok: #7fc99a;
  --warn: #e7c46a;
  --f-head: 'Roboto Condensed', 'Arial Narrow', sans-serif;
  --f-body: 'DM Sans', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  background-image: radial-gradient(circle at 50% 0%, var(--bg-2) 0%, var(--bg) 70%);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 20px 40px;
  min-height: 100%;
}
.wrap { max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; }
.brand small { font-family: var(--f-head); text-transform: uppercase; letter-spacing: .14em; color: var(--accent); font-size: 12px; }
.brand h1 { font-family: var(--f-head); font-weight: 700; font-size: clamp(28px, 6vw, 42px); line-height: 1.05; margin: 2px 0 0; text-wrap: balance; letter-spacing: -0.01em; }
.brand p { color: var(--muted); margin: 6px 0 0; max-width: 52ch; }

.track { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.track button { font: 700 14px var(--f-head); letter-spacing: .06em; text-transform: uppercase; border: 0; background: transparent; color: var(--muted); padding: 8px 18px; border-radius: 999px; cursor: pointer; }
.track button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
button:focus-visible, .step:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stage { display: grid; grid-template-columns: 300px 1fr; gap: 32px; align-items: start; }
@media (max-width: 760px) { .stage { grid-template-columns: 1fr; gap: 18px; } }

/* ---------- Telefonen ---------- */
.phone-col { display: flex; justify-content: center; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 760px) { .phone-col { position: static; } }
.phone {
  width: 272px; max-width: 100%; border-radius: 38px; padding: 10px;
  background: linear-gradient(160deg, #2b303b, #0d0f13);
  box-shadow: 0 30px 60px -20px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.07);
}
.screen {
  position: relative; height: 520px; border-radius: 29px; overflow: hidden;
  background: var(--bg); background-image: radial-gradient(circle at 50% 0%, #1d222e 0%, #121418 75%);
  font-size: 12px;
}
.sbar { display: flex; justify-content: space-between; padding: 8px 18px 2px; font: 600 11px var(--f-body); color: var(--text); }
.url { margin: 4px 10px 0; background: rgba(255,255,255,.06); border-radius: 8px; padding: 5px 9px; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.url b { color: var(--text); font-weight: 500; }
.view { position: absolute; inset: 58px 0 0 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; overflow: hidden; animation: viewIn .45s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.appbar { display: flex; align-items: center; justify-content: space-between; }
.appbar .logo { font: 700 13px var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.appbar .who { font-size: 10.5px; color: var(--muted); }
.s-h { font: 700 20px var(--f-head); margin: 2px 0 0; }
.s-p { color: var(--muted); font-size: 11.5px; margin: 0; }

.field { display: flex; flex-direction: column; gap: 3px; }
.field label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.field .in { min-height: 30px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.04); padding: 6px 9px; font-size: 12px; transition: border-color .2s; }
.field .in.focus { border-color: var(--accent); }
.field .in.ph { color: #6b7280; }

.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; border-radius: 9px; padding: 8px 12px; background: var(--accent); color: var(--accent-ink); font: 700 12px var(--f-head); letter-spacing: .05em; text-transform: uppercase; transition: transform .15s, filter .2s; }
.btn.ghost { background: rgba(255,255,255,.07); color: var(--text); }
.btn.sm { padding: 5px 9px; font-size: 10.5px; }
.btn.pressed { transform: scale(.94); filter: brightness(1.15); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { border-radius: 12px; border: 1px solid var(--line); background: linear-gradient(145deg, rgba(30,34,43,.9), rgba(22,25,32,.95)); padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; transition: border-color .25s, box-shadow .25s, transform .15s; }
.tile .ic { width: 26px; height: 26px; border-radius: 8px; background: rgba(229,169,104,.14); display: grid; place-items: center; }
.tile .ic svg { width: 15px; height: 15px; stroke: var(--accent); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tile b { font: 700 13px var(--f-head); }
.tile span { font-size: 10px; color: var(--muted); line-height: 1.3; }
.tile.hot, .row.hot, .card.hot { border-color: rgba(229,169,104,.55); box-shadow: 0 0 18px rgba(229,169,104,.18); }

.row { display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 9px; background: rgba(255,255,255,.03); transition: border-color .25s, background .25s, opacity .3s; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 500; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t small { color: var(--muted); font-size: 10px; }
.play { width: 26px; height: 26px; border-radius: 50%; background: rgba(229,169,104,.16); color: var(--accent); display: grid; place-items: center; font-size: 10px; flex: none; }
.pill { font-size: 9.5px; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--muted); white-space: nowrap; transition: background .3s, color .3s; }
.pill.wait { background: rgba(231,196,104,.15); color: var(--warn); }
.pill.ok { background: rgba(127,201,154,.15); color: var(--ok); }
.chk { width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--muted); flex: none; display: grid; place-items: center; font-size: 10px; color: var(--accent-ink); transition: background .2s, border-color .2s; }
.chk.on { background: var(--accent); border-color: var(--accent); }
.chk.on::after { content: "✓"; }

.tabs { display: flex; gap: 5px; }
.tabs span { flex: 1; text-align: center; font-size: 10.5px; padding: 6px 4px; border-radius: 999px; background: rgba(255,255,255,.06); color: #d1d5db; transition: background .25s, color .25s; }
.tabs span.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

.card { border: 1px solid var(--line); border-radius: 11px; padding: 8px 10px; background: rgba(255,255,255,.03); transition: border-color .25s, box-shadow .25s; }
.card .top { display: flex; justify-content: space-between; gap: 6px; }
.card .top b { font-size: 12px; font-weight: 500; }
.card .top em { font-style: normal; color: var(--accent); font-size: 10.5px; white-space: nowrap; }
.card .more { max-height: 0; overflow: hidden; color: var(--muted); font-size: 10.5px; transition: max-height .45s ease, margin .45s; }
.card.open .more { max-height: 80px; margin-top: 5px; }
.card.past { opacity: .45; }

.player { margin-top: auto; border-radius: 14px; border: 1px solid rgba(229,169,104,.3); background: #1b1f28; padding: 9px 10px; display: flex; flex-direction: column; gap: 6px; }
.player .pt { display: flex; justify-content: space-between; font-size: 11px; }
.player .pt b { font-weight: 500; }
.bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 7s linear; }
.ctrls { display: flex; justify-content: center; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); }
.ctrls .pp { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 11px; }
.ctrls .ico { padding: 2px 5px; border-radius: 6px; transition: background .2s; }
.ctrls .ico.on { background: rgba(229,169,104,.2); }

.mix { display: flex; flex-direction: column; gap: 6px; }
.mixrow { display: grid; grid-template-columns: 58px 1fr 30px; align-items: center; gap: 7px; font-size: 10.5px; }
.mixrow .tr { height: 6px; border-radius: 6px; background: rgba(255,255,255,.1); position: relative; }
.mixrow .tr i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--accent); width: 70%; transition: width .9s ease; }
.mixrow .tr i::after { content: ""; position: absolute; right: -6px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.mixrow.mine span:first-child { color: var(--accent); font-weight: 700; }
.mixrow small { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

.lyr { border-radius: 12px; background: rgba(0,0,0,.25); border: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
.lyr p { margin: 0; font-size: 12.5px; color: #6b7280; transition: color .35s, transform .35s; }
.lyr p.on { color: var(--text); font-weight: 700; transform: scale(1.06); }
.lyr p.done { color: var(--muted); }
.lyr.plain { text-align: left; }
.lyr.plain p { color: var(--text); font-size: 11.5px; }

.sync { display: flex; flex-direction: column; gap: 4px; }
.sline { display: grid; grid-template-columns: 50px 1fr; gap: 8px; font-size: 11px; padding: 5px 7px; border-radius: 7px; transition: background .25s; }
.sline code { font-family: ui-monospace, Menlo, monospace; color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.sline.cur { background: rgba(229,169,104,.14); }
.sline.set code { color: var(--accent); }
.tapbtn { align-self: center; width: 76px; height: 76px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 700 17px var(--f-head); letter-spacing: .08em; box-shadow: 0 0 0 6px rgba(229,169,104,.15); transition: transform .12s; }
.tapbtn.pressed { transform: scale(.9); }
.clock { text-align: center; font: 700 15px var(--f-head); font-variant-numeric: tabular-nums; }

.up { display: grid; grid-template-columns: 58px 1fr 16px; align-items: center; gap: 7px; font-size: 10.5px; }
.up .bar i { transition: width 1s ease; }
.up .okm { color: var(--ok); opacity: 0; transition: opacity .3s; }
.up.done .okm { opacity: 1; }

.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
.hour { width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--accent); display: grid; place-items: center; color: var(--accent); font-size: 24px; animation: spin 3s ease-in-out infinite; }
@keyframes spin { 0%, 40% { transform: rotate(0); } 60%, 100% { transform: rotate(180deg); } }

.off { opacity: 0; transform: translateY(8px); pointer-events: none; max-height: 0; overflow: hidden; margin: 0; padding-block: 0; border-width: 0; }
.shown { opacity: 1; transform: none; transition: opacity .4s, transform .4s; }

.toast { position: absolute; left: 12px; right: 12px; bottom: 14px; border-radius: 11px; padding: 9px 11px; background: #2a2f3b; border: 1px solid rgba(127,201,154,.35); font-size: 11px; display: flex; gap: 8px; align-items: center; transform: translateY(80px); opacity: 0; transition: transform .45s cubic-bezier(.2,.9,.3,1.2), opacity .3s; z-index: 5; }
.toast.in { transform: none; opacity: 1; }
.toast .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.notif { position: absolute; left: 8px; right: 8px; top: 6px; border-radius: 14px; padding: 9px 11px; background: rgba(40,44,55,.97); font-size: 10.5px; transform: translateY(-110px); transition: transform .5s cubic-bezier(.2,.9,.3,1.1); z-index: 6; box-shadow: 0 10px 25px rgba(0,0,0,.5); }
.notif.in { transform: none; }
.notif small { color: var(--muted); display: block; }

.finger { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: rgba(255,255,255,.28); border: 2px solid rgba(255,255,255,.85); box-shadow: 0 4px 12px rgba(0,0,0,.45); z-index: 9; left: 50%; top: 110%; transition: left .7s cubic-bezier(.4,0,.2,1), top .7s cubic-bezier(.4,0,.2,1), transform .15s, opacity .3s; pointer-events: none; }
.finger.down { transform: scale(.75); }
.ripple { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--accent); z-index: 8; animation: rip .6s ease-out forwards; pointer-events: none; }
@keyframes rip { to { transform: scale(4); opacity: 0; } }

/* Rullande karaoke-text */
.kbox { position: relative; height: 64px; overflow: hidden; margin-bottom: 2px;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 28%, #000 72%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 28%, #000 72%, transparent 100%); }
.kreel { position: absolute; left: 0; right: 0; top: 0; transition: transform .55s cubic-bezier(.22,1,.36,1); }
.kl { text-align: center; font: 700 13px/1.3 var(--f-head); padding: 2px 8px; min-height: 1.3em; opacity: .35; transform: scale(.8); transition: transform .55s cubic-bezier(.22,1,.36,1), opacity .45s, color .45s, text-shadow .45s; }
.kl.on { color: var(--accent); opacity: 1; transform: none; text-shadow: 0 0 12px rgba(229,169,104,.35); }
.kl.past { opacity: .2; }
.kl.kp { font-size: 11px; }
.xbtn { position: absolute; top: 6px; right: 8px; width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,.08); border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; z-index: 2; transition: transform .15s; }
.xbtn.big { top: 10px; right: 10px; width: 28px; height: 28px; font-size: 13px; }
.xbtn.pressed { transform: scale(.88); }
.fs { position: absolute; inset: 0; z-index: 7; flex-direction: column; gap: 8px; padding: 44px 10px 14px; animation: viewIn .35s ease both;
  background: var(--bg); background-image: radial-gradient(circle at 50% 0%, #1d222e 0%, #121418 75%); }
.fs .kbox { flex: 1; height: auto; }
.fs .kl { font-size: 19px; padding: 6px 8px; }
.fs .kl.kp { font-size: 15px; }
.fsbot { display: flex; flex-direction: column; gap: 6px; font-size: 11px; text-align: center; }

/* Admin: medlemsrader, mejl, bekräftelse */
.mrow { display: grid; grid-template-columns: 16px minmax(0,1fr) auto auto; gap: 7px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: rgba(255,255,255,.03); transition: border-color .25s, opacity .3s; }
.mrow .t b { display: block; font-weight: 500; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .t small { display: block; color: var(--muted); font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow.hot, .mail.hot { border-color: rgba(229,169,104,.55); box-shadow: 0 0 18px rgba(229,169,104,.18); }
.mrow.dim { opacity: .6; }
.paid { font-size: 9.5px; color: var(--muted); white-space: nowrap; transition: color .3s, transform .15s; }
.paid.on { color: var(--ok); }
.pill.paused { background: rgba(248,113,113,.15); color: #f87171; }
.pill.pressed, .paid.pressed { transform: scale(.92); }
.mail { border: 1px solid var(--line); border-radius: 12px; background: #1c2029; padding: 11px; display: flex; flex-direction: column; gap: 6px; font-size: 11px; transition: border-color .25s, box-shadow .25s; }
.mail small { color: var(--muted); font-size: 10px; }
.mail b { font-size: 12.5px; line-height: 1.3; }
.mail p { margin: 0; color: var(--muted); font-size: 10.5px; }
.mail .btn { align-self: flex-start; margin-top: 4px; }
.donecard { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
.donecard .big { font-size: 34px; color: var(--ok); line-height: 1; }
.confirm { border: 1px solid rgba(229,169,104,.4); border-radius: 10px; background: #232937; padding: 8px 10px; font-size: 10.5px; line-height: 1.4; }

/* ---------- Text & kontroller ---------- */
.side { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.now { display: flex; flex-direction: column; gap: 8px; }
.now .count { font: 700 12px var(--f-head); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-variant-numeric: tabular-nums; }
.now h2 { font: 700 clamp(24px, 4.2vw, 32px)/1.1 var(--f-head); margin: 0; text-wrap: balance; }
.now p { margin: 0; color: #cfd3da; max-width: 58ch; }
.path { align-self: flex-start; font: 12px ui-monospace, Menlo, monospace; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; overflow-wrap: anywhere; }
.tips { margin: 2px 0 0; padding-left: 18px; color: #cfd3da; display: flex; flex-direction: column; gap: 4px; max-width: 58ch; }
.tips li::marker { color: var(--accent); }

.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cbtn { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; padding: 9px 14px; font: 700 13px var(--f-head); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
.cbtn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 104px; }
.cbtn:disabled { opacity: .35; cursor: default; }
.prog { flex: 1; min-width: 120px; height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 12px; }
.step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 9px; cursor: pointer; color: var(--muted); }
.step:hover { background: rgba(255,255,255,.03); }
.step .n { font: 700 13px var(--f-head); font-variant-numeric: tabular-nums; }
.step b { font-weight: 500; color: var(--text); }
.step small { display: block; font-size: 12.5px; }
.step[aria-current="true"] { background: var(--surface); }
.step[aria-current="true"] .n { color: var(--accent); }
.step.seen .n { color: var(--accent); opacity: .6; }

.hdr-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.music { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 8px 14px; font: 700 13px var(--f-head); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
.music[aria-pressed="true"] { color: var(--accent); border-color: rgba(229,169,104,.5); }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.eq i { width: 3px; height: 4px; background: currentColor; border-radius: 1px; }
.music[aria-pressed="true"] .eq i { animation: eq .5s ease-in-out infinite alternate; }
.music[aria-pressed="true"] .eq i:nth-child(2) { animation-delay: .17s; }
.music[aria-pressed="true"] .eq i:nth-child(3) { animation-delay: .33s; }
@keyframes eq { from { height: 3px; } to { height: 12px; } }
.cta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
a.cbtn { text-decoration: none; display: inline-flex; align-items: center; }
footer p { margin: 0; }
footer { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="brand">
      <small id="kicker">heavyvoices.se · guide</small>
      <h1 id="h1">Så funkar Heavy Voices</h1>
      <p id="lead">Följ med steg för steg.</p>
    </div>
    <div class="hdr-right">
    <div class="track" id="trackSel" role="group" aria-label="Välj guide"></div>
    <button class="music" id="musicBtn" aria-pressed="false" title="Bakgrundsmusik"><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><span id="musicLbl">Musik av</span></button>
    </div>
  </header>

  <div class="stage">
    <div class="phone-col">
      <div class="phone" aria-hidden="true">
        <div class="screen" id="screen">
          <div class="sbar"><span>19:30</span><span>●●● 5G</span></div>

const $ = (s, r=document) => r.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let track = REG, idx = 0, playing = !reduce, run = 0, seen = new Set();
const host = $('#viewHost'), finger = $('#finger'), screen = $('#screen');

const sleep = (ms) => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 60) : ms));

function moveFinger(el) {
  const s = screen.getBoundingClientRect(), r = el.getBoundingClientRect();
  finger.style.left = (r.left - s.left + r.width/2) + 'px';
  finger.style.top = (r.top - s.top + r.height/2) + 'px';
  return { x: r.left - s.left + r.width/2, y: r.top - s.top + r.height/2 };
}

async function doAct(a, id) {
  const q = (s) => host.querySelector(s);
  const [k, s, v, w] = a;
  if (id !== run) throw 0;
  switch (k) {
    case 'wait': await sleep(s); break;
    case 'tap': {
      const el = q(s); if (!el) break;
      const p = moveFinger(el); await sleep(750);
      finger.classList.add('down'); el.classList.add('pressed');
      const rp = document.createElement('div'); rp.className = 'ripple'; rp.style.left = p.x+'px'; rp.style.top = p.y+'px'; screen.appendChild(rp);
      setTimeout(() => rp.remove(), 700);
      await sleep(180); finger.classList.remove('down'); el.classList.remove('pressed'); await sleep(200); break;
    }
    case 'type': {
      const el = q(s); moveFinger(el); await sleep(650);
      el.classList.add('focus'); el.classList.remove('ph'); el.textContent = '';
      for (const ch of v) { if (id !== run) throw 0; el.textContent += ch; await sleep(38); }
      await sleep(250); el.classList.remove('focus'); break;
    }
    case 'text': { const el = q(s); el.textContent = v; el.classList.remove('ph'); await sleep(250); break; }
    case 'add': q(s).classList.add(v); await sleep(350); break;
    case 'rm': q(s).classList.remove(v); break;
    case 'swapcls': q(s).classList.replace(v, w); await sleep(300); break;
    case 'hot': host.querySelectorAll('.hot').forEach(e => e.classList.remove('hot')); q(s).classList.add('hot'); await sleep(200); break;
    case 'show': { const el = q(s); el.classList.remove('off'); el.classList.add('shown'); if (v) el.style.display = v; await sleep(350); break; }
    case 'hide': { const el = q(s); el.classList.add('off'); el.style.display = ''; break; }
    case 'style': Object.assign(q(s).style, v); await sleep(200); break;
    case 'swap': q(s).classList.remove('on'); q(s).classList.add('done'); q(v).classList.add('on'); break;
    case 'up': { const el = q(s); el.querySelector('i').style.width = '100%'; await sleep(650); el.classList.add('done'); break; }
    case 'kstep': {
      const rl = q(s); if (!rl) break;
      const box = rl.parentElement, els = rl.children, el = els[v]; if (!el) break;
      [...els].forEach((c, i) => { c.classList.toggle('on', i === v && i > 0); c.classList.toggle('past', i < v); });
      rl.style.transform = `translateY(${box.clientHeight / 2 - (el.offsetTop + el.offsetHeight / 2)}px)`;
      await sleep(120); break;
    }
    case 'synk': {
      const i = s; q('#s'+i).classList.remove('cur'); q('#s'+i).classList.add('set');
      const nx = q('#s'+(i+1)); if (nx) nx.classList.add('cur'); break;
    }
    case 'clock': {
      const el = q(s); const t0 = performance.now(), my = id;
      (function tick() { if (my !== run || !el.isConnected) return;
        const t = (performance.now()-t0)/1000*0.75 + 10.2; const m = Math.floor(t/60), sec = (t%60).toFixed(2).padStart(5,'0');
        el.textContent = `${m}:${sec}`; requestAnimationFrame(tick); })();
      break;
    }
  }
}

function render() {
  const step = track[idx]; const id = ++run;
  $('#count').textContent = `Steg ${idx+1} av ${track.length}`;
  $('#title').textContent = step.t;
  $('#desc').textContent = step.d;
  $('#tips').innerHTML = step.tips.map(t => `<li>${t}</li>`).join('');
  $('#url').innerHTML = step.url;
  host.innerHTML = `<div class="view">${step.html}</div>`;
  finger.style.opacity = reduce ? '0' : '1';
  finger.style.left = '50%'; finger.style.top = '110%';
  $('#prev').disabled = idx === 0;
  $('#next').disabled = idx === track.length-1 && !playing;
  seen.add(idx);
  document.querySelectorAll('.step').forEach((li, i) => { li.setAttribute('aria-current', i===idx); li.classList.toggle('seen', seen.has(i)); });
  const fill = $('#progFill'); fill.style.transition = 'none'; fill.style.width = (idx/track.length*100)+'%';
  requestAnimationFrame(() => { fill.style.transition = 'width .4s'; fill.style.width = ((idx+1)/track.length*100)+'%'; });
  animate(step, id);
}

async function animate(step, id) {
  try {
    await sleep(500);
    for (const a of step.act) await doAct(a, id);
    finger.style.top = '110%';
    await sleep(900);
    if (id === run && playing) {
      if (idx < track.length-1) { idx++; render(); }
      else { playing = false; updatePlay(); }
    }
  } catch (e) { /* avbruten */ }
}

function buildList() {
  $('#steps').innerHTML = track.map((s, i) => `<li class="step" tabindex="0" data-i="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span><span><b>${s.t}</b><small>${s.path}</small></span></li>`).join('');
  document.querySelectorAll('.step').forEach(li => {
    const go = () => { idx = +li.dataset.i; render(); };
    li.onclick = go; li.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
}
function updatePlay() { $('#playBtn').textContent = playing ? 'Pausa' : (idx === track.length-1 ? 'Spela igen' : 'Spela'); }
let trackKey = 'registrera';
function setTrack(key) {
  const g = GUIDES[key] || GUIDES.registrera;
  trackKey = GUIDES[key] ? key : 'registrera';
  track = g.steps; idx = 0; seen = new Set();
  $('#kicker').textContent = g.kicker;
  $('#h1').textContent = g.h1;
  $('#lead').textContent = g.lead;
  $('#cta').innerHTML = g.cta;
  document.title = g.h1 + ' — Heavy Voices';
  document.querySelectorAll('#trackSel button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === trackKey));
  try { localStorage.setItem('hv-guide-track', trackKey); } catch (e) {}
  buildList(); render(); updatePlay();
}
$('#trackSel').innerHTML = Object.entries(GUIDES).map(([k, g]) => `<button data-k="${k}" aria-pressed="false">${g.label}</button>`).join('');
document.querySelectorAll('#trackSel button').forEach(b => b.onclick = () => setTrack(b.dataset.k));

$('#prev').onclick = () => { if (idx > 0) { idx--; render(); } };
$('#next').onclick = () => { if (idx < track.length-1) { idx++; render(); } };
$('#playBtn').onclick = () => {
  if (!playing && idx === track.length-1) idx = 0;
  playing = !playing; updatePlay(); if (playing) render();
};


/* ---------- Bakgrundsmusik: "Dirty shoes blues" av Loyalty Freak Music (CC0), loopas ---------- */
const Music = (() => {
  const SRC = 'guide-blues.mp3';
  let ctx, gain, buf, src, on = false, loading = null;
  async function load() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (!gain) { gain = ctx.createGain(); gain.gain.value = 0; gain.connect(ctx.destination); }
    if (!buf) {
      loading = loading || fetch(SRC).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(ab => new Promise((ok, bad) => ctx.decodeAudioData(ab, ok, bad)));
      buf = await loading;
    }
  }
  async function start() {
    on = true; setMusicUI('Laddar…');
    try { await load(); } catch (e) { on = false; setMusicUI('Musik saknas'); return; }
    if (!on) return;
    await ctx.resume();
    if (!src) {
      src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
            src.connect(gain); src.start();
    }
    gain.gain.cancelScheduledValues(ctx.currentTime);
    gain.gain.setValueAtTime(gain.gain.value, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(.8, ctx.currentTime + 1.2);
    setMusicUI();
  }
  function stop() {
    on = false; setMusicUI();
    if (!ctx || !gain) return;
    gain.gain.cancelScheduledValues(ctx.currentTime);
    gain.gain.setValueAtTime(gain.gain.value, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + .6);
    setTimeout(() => { if (!on) ctx.suspend(); }, 700);
  }
  return { toggle() { on ? stop() : start(); }, pause() { if (on) { stop(); return true; } return false; }, start, get on() { return on; } };
})();
let resumeMusic = false;
function setMusicUI(msg) { $('#musicBtn').setAttribute('aria-pressed', Music.on); $('#musicLbl').textContent = msg || (Music.on ? 'Musik på' : 'Musik av'); }
$('#musicBtn').onclick = () => { Music.toggle(); };
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { resumeMusic = Music.pause(); }
  else if (resumeMusic) { resumeMusic = false; Music.start(); }
});

// ?guide=registrera|medlem|admin visar bara den guiden (utan väljare). Utan parameter: alla tre med väljare.
const fixedGuide = new URLSearchParams(location.search).get('guide');
if (fixedGuide && GUIDES[fixedGuide]) {
  $('#trackSel').style.display = 'none';
  setTrack(fixedGuide);
} else {
  let startKey = 'registrera';
  try { const saved = localStorage.getItem('hv-guide-track'); if (GUIDES[saved]) startKey = saved; } catch (e) {}
  setTrack(startKey);
}
</script>
