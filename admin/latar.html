<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Låtar — Heavy Voices Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .back-link { display: inline-block; margin-bottom: 1rem; color: var(--text-muted); }
  .success { color: #4ade80; font-size: 0.9rem; }
  .song-item { border-bottom: 1px solid var(--border); padding: 1rem 0; }
  .song-item:last-child { border-bottom: none; }
  .song-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 0.03em; }
  .field-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.4rem 0; font-size: 0.9rem; }
  .field-row label { width: 100px; color: var(--text-muted); flex-shrink: 0; }
  .field-row input[type="file"] { flex: 1; font-size: 0.85rem; }
  .status-ok { color: #4ade80; font-size: 0.8rem; }
  .status-missing { color: var(--text-muted); font-size: 0.8rem; }
  textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.6rem 0.9rem; font-family: inherit; min-height: 100px; margin-bottom: 0.5rem;
  }
  .btn-small { padding: 0.35rem 0.8rem; font-size: 0.85rem; }
  .btn-danger { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  details > summary { cursor: pointer; margin-top: 0.6rem; color: var(--text-muted); font-size: 0.85rem; }
</style>
</head>
<body>

<div class="container">
  <a href="/admin/" class="back-link">&larr; Tillbaka till admin</a>
  <h1>Låtar</h1>

  <div class="card">
    <h3>Lägg till ny låt</h3>
    <form id="addSongForm">
      <input type="text" id="newTitle" placeholder="Titel" required>
      <button type="submit">Lägg till</button>
      <p class="error" id="addError"></p>
    </form>
  </div>

  <div class="card" style="margin-top: 1.5rem;">
    <h3>Repertoar</h3>
    <div id="songList"><p class="text-muted">Laddar...</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
async function loadSongs() {
  const { data: songs, error } = await supabaseClient
    .from('songs')
    .select('*')
    .order('title');

  const listEl = document.getElementById('songList');

  if (error) {
    listEl.innerHTML = `<p class="error">Kunde inte hämta låtar: ${error.message}</p>`;
    return;
  }

  if (!songs.length) {
    listEl.innerHTML = `<p class="text-muted">Inga låtar än.</p>`;
    return;
  }

  listEl.innerHTML = songs.map(s => `
    <div class="song-item">
      <div class="song-title">${s.title}</div>

      <details>
        <summary>Redigera text och filer</summary>

        <div style="margin-top: 0.75rem;">
          <textarea data-id="${s.id}" class="lyricsField" placeholder="Sångtext">${s.lyrics_plain || ''}</textarea>
          <p class="text-muted lyricsPdfNote" data-id="${s.id}" style="font-size: 0.8rem; margin: -0.3rem 0 0.5rem 0; ${s.lyrics_pdf_path ? '' : 'display: none;'}">
            PDF uppladdad — texten ovan går inte att redigera utifrån PDF:en här.
          </p>
          <button type="button" class="saveLyricsBtn btn-small" data-id="${s.id}">Spara text</button>

          <div class="field-row">
            <label>Text (Word/PDF)</label>
            <input type="file" accept=".docx,.pdf,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="lyricsFileInput" data-id="${s.id}">
            <span class="lyricsFileStatus ${s.lyrics_pdf_path ? 'status-ok' : 'status-missing'}" data-id="${s.id}">${s.lyrics_pdf_path ? '✓ PDF uppladdad' : 'ingen PDF'}</span>
          </div>

          <div class="field-row">
            <label>Noter (PDF)</label>
            <input type="file" accept="application/pdf" class="fileInput" data-id="${s.id}" data-kind="sheet_music_path" data-bucket="heavy-voices-noter">
            <span class="${s.sheet_music_path ? 'status-ok' : 'status-missing'}">${s.sheet_music_path ? '✓ uppladdad' : 'saknas'}</span>
          </div>
          <div class="field-row">
            <label>Sopran</label>
            <input type="file" accept="audio/*" class="fileInput" data-id="${s.id}" data-kind="stem_sopran_path" data-bucket="heavy-voices-stems">
            <span class="${s.stem_sopran_path ? 'status-ok' : 'status-missing'}">${s.stem_sopran_path ? '✓ uppladdad' : 'saknas'}</span>
          </div>
          <div class="field-row">
            <label>Alt</label>
            <input type="file" accept="audio/*" class="fileInput" data-id="${s.id}" data-kind="stem_alt_path" data-bucket="heavy-voices-stems">
            <span class="${s.stem_alt_path ? 'status-ok' : 'status-missing'}">${s.stem_alt_path ? '✓ uppladdad' : 'saknas'}</span>
          </div>
          <div class="field-row">
            <label>Tenor</label>
            <input type="file" accept="audio/*" class="fileInput" data-id="${s.id}" data-kind="stem_tenor_path" data-bucket="heavy-voices-stems">
            <span class="${s.stem_tenor_path ? 'status-ok' : 'status-missing'}">${s.stem_tenor_path ? '✓ uppladdad' : 'saknas'}</span>
          </div>
          <div class="field-row">
            <label>Bas</label>
            <input type="file" accept="audio/*" class="fileInput" data-id="${s.id}" data-kind="stem_bas_path" data-bucket="heavy-voices-stems">
            <span class="${s.stem_bas_path ? 'status-ok' : 'status-missing'}">${s.stem_bas_path ? '✓ uppladdad' : 'saknas'}</span>
          </div>

          <button type="button" class="btn-danger btn-small deleteSongBtn" data-id="${s.id}" style="margin-top: 0.75rem;">Ta bort låt</button>
          <button type="button" class="btn-small closeDetailsBtn" data-id="${s.id}" style="margin-top: 0.75rem; margin-left: 0.5rem; background: transparent; border: 1px solid var(--border);">OK / Stäng</button>
          <p class="error uploadError" data-id="${s.id}"></p>
        </div>
      </details>
    </div>
  `).join('');

  document.querySelectorAll('.saveLyricsBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.dataset.id;
      const text = document.querySelector(`.lyricsField[data-id="${id}"]`).value;
      const { error } = await supabaseClient.from('songs').update({ lyrics_plain: text, lyrics_pdf_path: null }).eq('id', id);
      if (error) {
        alert('Kunde inte spara: ' + error.message);
        return;
      }
      btn.textContent = 'Sparat!';
      setTimeout(() => btn.textContent = 'Spara text', 1500);
      const noteEl = document.querySelector(`.lyricsPdfNote[data-id="${id}"]`);
      const statusEl = document.querySelector(`.lyricsFileStatus[data-id="${id}"]`);
      if (noteEl) noteEl.style.display = 'none';
      if (statusEl) { statusEl.textContent = 'ingen PDF'; statusEl.className = 'lyricsFileStatus status-missing'; }
    });
  });

  document.querySelectorAll('.lyricsFileInput').forEach(input => {
    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const id = e.target.dataset.id;
      const ext = file.name.split('.').pop().toLowerCase();
      const textarea = document.querySelector(`.lyricsField[data-id="${id}"]`);
      const noteEl = document.querySelector(`.lyricsPdfNote[data-id="${id}"]`);
      const statusEl = document.querySelector(`.lyricsFileStatus[data-id="${id}"]`);
      const errEl = document.querySelector(`.uploadError[data-id="${id}"]`);
      errEl.textContent = '';

      if (ext === 'docx') {
        statusEl.textContent = 'Läser Word-fil...';
        try {
          const arrayBuffer = await file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer });
          textarea.value = result.value;
          statusEl.textContent = 'Text inläst — granska och klicka Spara text';
          statusEl.className = 'lyricsFileStatus status-ok';
        } catch (err) {
          errEl.textContent = 'Kunde inte läsa Word-filen: ' + err.message;
          statusEl.textContent = 'ingen PDF';
          statusEl.className = 'lyricsFileStatus status-missing';
        }
        return;
      }

      if (ext === 'pdf') {
        statusEl.textContent = 'Laddar upp PDF...';
        const path = `${id}/lyrics.pdf`;
        const { error: uploadError } = await supabaseClient.storage
          .from('heavy-voices-noter')
          .upload(path, file, { upsert: true });

        if (uploadError) {
          errEl.textContent = 'Uppladdning misslyckades: ' + uploadError.message;
          statusEl.textContent = 'ingen PDF';
          statusEl.className = 'lyricsFileStatus status-missing';
          return;
        }

        const { error: updateError } = await supabaseClient
          .from('songs')
          .update({ lyrics_pdf_path: path })
          .eq('id', id);

        if (updateError) {
          errEl.textContent = 'Kunde inte spara filväg: ' + updateError.message;
          return;
        }

        statusEl.textContent = '✓ PDF uppladdad';
        statusEl.className = 'lyricsFileStatus status-ok';
        if (noteEl) noteEl.style.display = 'block';
        return;
      }

      errEl.textContent = 'Filtypen stöds inte — använd .docx eller .pdf.';
    });
  });

  document.querySelectorAll('.closeDetailsBtn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.target.closest('details').removeAttribute('open');
    });
  });

  document.querySelectorAll('.fileInput').forEach(input => {
    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const id = e.target.dataset.id;
      const kind = e.target.dataset.kind;
      const bucket = e.target.dataset.bucket;
      const errEl = document.querySelector(`.uploadError[data-id="${id}"]`);
      const statusEl = e.target.nextElementSibling;
      errEl.textContent = '';
      if (statusEl) {
        statusEl.textContent = `Vald: ${file.name} — laddar upp...`;
        statusEl.className = 'status-missing';
      }

      const ext = file.name.split('.').pop();
      const path = `${id}/${kind}.${ext}`;

      const { error: uploadError } = await supabaseClient.storage
        .from(bucket)
        .upload(path, file, { upsert: true });

      if (uploadError) {
        errEl.textContent = 'Uppladdning misslyckades: ' + uploadError.message;
        if (statusEl) { statusEl.textContent = 'saknas'; statusEl.className = 'status-missing'; }
        return;
      }

      const { error: updateError } = await supabaseClient
        .from('songs')
        .update({ [kind]: path })
        .eq('id', id);

      if (updateError) {
        errEl.textContent = 'Kunde inte spara filväg: ' + updateError.message;
        return;
      }

      if (statusEl) {
        statusEl.textContent = `✓ uppladdad (${file.name})`;
        statusEl.className = 'status-ok';
      }
    });
  });

  document.querySelectorAll('.deleteSongBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.dataset.id;
      if (!confirm('Ta bort låten permanent? Filer i storage måste rensas manuellt separat.')) return;
      const { error } = await supabaseClient.from('songs').delete().eq('id', id);
      if (error) alert('Kunde inte ta bort: ' + error.message);
      else loadSongs();
    });
  });
}

document.getElementById('addSongForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = document.getElementById('newTitle').value;
  const errorEl = document.getElementById('addError');
  errorEl.textContent = '';

  const { error } = await supabaseClient.from('songs').insert({ title });
  if (error) {
    errorEl.textContent = error.message;
    return;
  }
  document.getElementById('addSongForm').reset();
  loadSongs();
});

(async () => {
  const member = await requireAuth('admin');
  if (member) loadSongs();
})();
</script>

</body>
</html>
