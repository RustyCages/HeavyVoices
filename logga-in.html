<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logga in — Heavy Voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  /* Lite luft under loggan */
  .site-header--logo { padding-bottom: 0; }
  .login-page { padding-top: 0.75rem; }
  .login-page > p:first-child { margin-top: 0; }
  /* Mobil: allt ska få plats utan att sidan scrollar */
  @media (max-width: 600px) {
    .site-header--logo { padding-top: 0.8rem; }
    .login-page { padding-top: 0.6rem; padding-bottom: 0.6rem; }
    .login-page > p:first-child { margin: 0 0 0.4rem; }
    .login-page h1 { margin: 0 0 0.2rem; font-size: 1.7rem; }
    .login-page .card { margin-top: 0.8rem !important; padding: 1.1rem; }
  }
  /* Loggan lyser upp till och från */
  @keyframes logoGlow {
    0%, 100% { filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5)) brightness(1); }
    50% { filter: drop-shadow(0 0 14px rgba(229,169,104,0.45)) brightness(1.08); }
  }
  .site-logo-img { animation: logoGlow 5s ease-in-out 1s infinite; }
  @media (prefers-reduced-motion: reduce) { .site-logo-img { animation: none; } }
  /* Övergång efter lyckad inloggning */
  #loginFade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 50; }
  body.entering .container { transition: opacity 0.5s ease, transform 0.6s ease, filter 0.5s ease; opacity: 0; transform: translateY(16px) scale(0.98); filter: blur(4px); }
  body.entering .site-header { position: relative; z-index: 51; }
</style>
</head>
<body>
<div id="loginFade"></div>

<header class="site-header site-header--logo"><a href="/" class="site-logo-link" aria-label="Heavy Voices – till startsidan"><picture><source srcset="/icons/logo.webp" type="image/webp"><img src="/icons/logo.png" alt="Heavy Voices" class="site-logo-img" width="640" height="493"></picture></a></header>
<div class="container login-page">
  <p><a href="/" class="text-muted">&larr; Tillbaka</a></p>
  <h1>Logga in</h1>

  <div class="card" style="max-width: 360px; margin-top: 1.5rem;">
    <form id="loginForm">
      <input type="email" id="email" placeholder="E-post" required autocomplete="username" name="email">
      <input type="password" id="password" placeholder="Lösenord" required autocomplete="current-password" name="password">
      <button type="submit">Logga in</button>
      <a href="/aterstall-losenord.html" class="text-muted" style="display: inline-block; margin-left: 0.75rem; font-size: 0.85rem;">Glömt lösenord?</a>
      <p class="error" id="loginError"></p>
    </form>
    <p class="text-muted" style="margin-top: 1rem; font-size: 0.85rem;">Ny i kören? <a href="/registrera.html">Registrera dig här</a>.</p>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; align-items: center;">
    <a href="/guide.html?guide=registrera" class="btn btn-outline" style="text-decoration: none;">Så funkar det</a>
    <div data-install-app="Installera Heavy Voices som app"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/password-toggle.js" defer></script>
<script src="/js/auth.js"></script>
<script src="/js/install-app.js" defer></script>
<script>
// Snygg övergång: formuläret tonas bort, loggan flammar upp och sidan går ner i svart
function playEnter() {
  return new Promise((resolve) => {
    const logo = document.querySelector('.site-logo-img');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || !logo || !logo.animate) return resolve();
    document.body.classList.add('entering');
    logo.style.animation = 'none';
    logo.animate([
      { transform: 'scale(1)', filter: 'drop-shadow(0 2px 10px rgba(0,0,0,0.5)) brightness(1)' },
      { transform: 'scale(1.18)', filter: 'drop-shadow(0 0 26px rgba(229,169,104,1)) drop-shadow(0 0 8px rgba(255,236,200,1)) brightness(1.35)', offset: 0.55 },
      { transform: 'scale(1.1)', filter: 'drop-shadow(0 0 40px rgba(229,169,104,0.9)) brightness(1.5)' }
    ], { duration: 900, easing: 'ease-in-out', fill: 'forwards' });
    const fade = document.getElementById('loginFade');
    const f = fade.animate([{ opacity: 0 }, { opacity: 0, offset: 0.55 }, { opacity: 1 }], { duration: 1000, easing: 'ease-in', fill: 'forwards' });
    f.onfinish = () => resolve();
    setTimeout(resolve, 1500);
  });
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';

  try {
    await signIn(email, password);
    // Be webbläsaren spara inloggningen (Chrome/Edge/Android). Safari/iOS fångar formuläret själv.
    try {
      if (window.PasswordCredential) await navigator.credentials.store(new PasswordCredential(e.target));
    } catch (_) { /* inte kritiskt */ }
    const member = await getCurrentMember();
    if (!member || member.status !== 'approved') {
      window.location.href = '/vantar.html';
      return;
    }
    await playEnter();
    window.location.href = member.role === 'admin' ? '/admin/' : '/medlem/';
  } catch (err) {
    errorEl.textContent = 'Fel e-post eller lösenord.';
  }
});
</script>

</body>
</html>
