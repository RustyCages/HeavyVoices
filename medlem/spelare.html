<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelaren — Heavy Voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  
  .playlist-card { display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 0; border-bottom: 1px solid var(--border); }
  .playlist-card:last-child { border-bottom: none; }
  .playlist-card a { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.03em; }
  .header-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; }

  .track-card { border-bottom: 1px solid var(--border); }
  .track-card:last-child { border-bottom: none; }
  .track-header { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 0; cursor: pointer; list-style: none; gap: 0.5rem; }
  .track-header::-webkit-details-marker { display: none; }
  .track-header.playing { color: var(--accent); }
  .track-header .title { flex: 1; }
  .track-header .arrow { transition: transform 0.15s; color: var(--text-muted); }
details[open] .track-header .arrow { transform: rotate(180deg); }
  .quick-play { padding: 0.3rem 0.6rem; font-size: 0.8rem; background: transparent; border: 1px solid var(--border); }
.muteBtn.active { border-color: var(--accent); color: var(--accent); background: rgba(224,36,36,0.1); }
  .mixer-row { display: flex; align-items: center; gap: 0.6rem; margin: 0.5rem 0; }
  .mixer-row label { width: 70px; color: var(--text-muted); font-size: 0.85rem; flex-shrink: 0; }
  .mixer-row input[type="range"] { flex: 1; }
  .mixer-row .vol-value { width: 32px; text-align: right; font-size: 0.8rem; color: var(--text-muted); }
  .stem-filename { font-size: 0.75rem; color: var(--text-muted); margin: -0.3rem 0 0.4rem 76px; word-break: break-all; }
  .loading-note { font-size: 0.8rem; color: var(--text-muted); }

  .floating-player {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg-elevated); border-top: 1px solid var(--border);
    padding: 0.8rem 1.2rem; display: none; flex-direction: column; gap: 0.5rem;
    z-index: 50;
  }
  .floating-player .now-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.15rem; }
  .floating-player .controls { display: flex; gap: 0.5rem; align-items: center; }
  .floating-player .controls button.active { border-color: var(--accent); color: var(--accent); }
  .progress-row { display: flex; align-items: center; gap: 0.6rem; }
  .progress-row input[type="range"] { flex: 1; }
  .progress-row .time { font-size: 0.75rem; color: var(--text-muted); width: 36px; text-align: center; }
  .container { padding-bottom: 7rem; }
</style>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <a href="/medlem/spelare.html" class="top-nav-link active">Spellistor</a>
    <a href="/medlem/repertoar.html" class="top-nav-link">Repertoar</a>
  </div>

  <a href="/medlem/" class="back-btn">&larr; Tillbaka till medlemssidan</a>

  <div id="listView">
    <h1>Mina spellistor</h1>
    <div class="card">
      <div id="playlistsSection"><p class="text-muted">Laddar...</p></div>
    </div>
  </div>

  <div id="detailView" style="display: none;">
    <a href="/medlem/spelare.html" class="back-btn">&larr; Tillbaka till spellistor</a>
    <div class="header-row">
      <h1 id="playlistTitle">Spellista</h1>
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" id="playAllBtn">Spela listan</button>
        <button type="button" id="deletePlaylistBtn" class="btn-danger">Radera spellista</button>
      </div>
    </div>
    <div class="card">
      <div id="tracksSection"><p class="text-muted">Laddar...</p></div>
    </div>
  </div>
</div>

<div class="floating-player" id="floatingPlayer">
  <div class="now-title" id="nowPlayingTitle">–</div>
  <div class="controls">
    <button id="prevBtn" type="button">&larr;</button>
    <button id="playPauseBtn" type="button">Spela</button>
    <button id="nextBtn" type="button">&rarr;</button>
    <button id="repeatBtn" type="button">Repeat</button>
  </div>
  <div class="progress-row">
    <span class="time" id="timeElapsed">0:00</span>
    <input type="range" id="progressSlider" min="0" max="100" value="0" step="0.1">
    <span class="time" id="timeTotal">0:00</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
const stemFields = { Backtrack: 'stem_backtrack_path', Sopran: 'stem_sopran_path', Alt: 'stem_alt_path', Tenor: 'stem_tenor_path', Bas: 'stem_bas_path' };
const volColumns = { Backtrack: 'vol_backtrack', Sopran: 'vol_sopran', Alt: 'vol_alt', Tenor: 'vol_tenor', Bas: 'vol_bas' };
const priorityOrder = ['Backtrack', 'Sopran', 'Alt', 'Tenor', 'Bas'];

const params = new URLSearchParams(window.location.search);
const playlistId = params.get('playlist');

let tracks = [];
let currentIndex = -1;
let isPlaying = false;
let isRepeat = false;
let currentMemberId = null;
let playlistName = '';

let audioCtx = null;
let gainNodes = {};
let activeSources = {};
let referenceLabel = null;
let playbackStartTime = 0;
let playbackOffset = 0;
let manualStop = false;
let currentDuration = 0;
let isSeeking = false;
let progressTimer = null;

function stemFilename(path) {
  if (!path) return '';
  const base = path.split('/').pop();
  const parts = base.split('__');
  return parts.length > 1 ? decodeURIComponent(parts.slice(1).join('__')) : base;
}

function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function ensureAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    for (const label of priorityOrder) {
      const gain = audioCtx.createGain();
      gain.connect(audioCtx.destination);
      gainNodes[label] = gain;
    }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

async function loadPlaylistsList() {
  const { data, error } = await supabaseClient
    .from('playlists')
    .select('id, name')
    .eq('member_id', currentMemberId)
    .order('created_at');

  const el = document.getElementById('playlistsSection');

  if (error) { el.innerHTML = `<p class="error">${error.message}</p>`; return; }

  if (!data.length) {
    el.innerHTML = `<p class="text-muted">Du har inga spellistor än. <a href="/medlem/skapa-spellista.html">Skapa en</a> eller lägg till låtar från <a href="/medlem/repertoar.html">Repertoaren</a>.</p>`;
    return;
  }
  
  el.innerHTML = data.map(p => `
    <div class="playlist-card">
      <a href="/medlem/spelare.html?playlist=${p.id}">${p.name}</a>
      <button type="button" class="btn-danger deletePlaylistCardBtn" data-id="${p.id}" style="padding: 0.3rem 0.7rem; font-size: 0.85rem;">Radera</button>
    </div>
  `).join('');

  document.querySelectorAll('.deletePlaylistCardBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      if (!confirm('Radera spellistan permanent?')) return;
      await supabaseClient.from('playlists').delete().eq('id', e.target.dataset.id);
      loadPlaylistsList();
    });
  });
}

async function loadPlaylistDetail() {
  const { data: playlist, error: plError } = await supabaseClient
    .from('playlists').select('id, name').eq('id', playlistId).single();

  if (plError || !playlist) {
    document.getElementById('playlistTitle').textContent = 'Kunde inte hitta spellistan';
    return;
  }
  playlistName = playlist.name;
  document.getElementById('playlistTitle').textContent = playlist.name;

  const { data, error } = await supabaseClient
    .from('playlist_songs')
    .select('id, song_id, vol_backtrack, vol_sopran, vol_alt, vol_tenor, vol_bas, songs(*)')
    .eq('playlist_id', playlistId)
    .order('created_at');

  const el = document.getElementById('tracksSection');

  if (error) { el.innerHTML = `<p class="error">${error.message}</p>`; return; }

  if (!data.length) {
    el.innerHTML = `<p class="text-muted">Inga låtar i den här spellistan än. Lägg till från <a href="/medlem/repertoar.html">Repertoaren</a>.</p>`;
    tracks = [];
    return;
  }

  tracks = data.map(row => ({
    playlistSongId: row.id,
    song: row.songs,
    volumes: { Backtrack: row.vol_backtrack, Sopran: row.vol_sopran, Alt: row.vol_alt, Tenor: row.vol_tenor, Bas: row.vol_bas },
    signedUrls: null,
    buffers: null,
  }));

  renderTracks();
}

function renderTracks() {
  const el = document.getElementById('tracksSection');
  el.innerHTML = tracks.map((item, i) => `
    <div class="track-card">
      <details>
        <summary class="track-header ${i === currentIndex ? 'playing' : ''}">
          <span class="title">${item.song.title}</span>
          <button type="button" class="quick-play" data-index="${i}">&#9658; Spela</button>
          <span class="arrow">&#9660;</span>
        </summary>
        <div style="padding: 0.3rem 0 1rem 0;">
          ${priorityOrder.map(label => {
            const path = item.song[stemFields[label]];
            const has = !!path;
            return `
              <div class="mixer-row">
                <label>${label}</label>
                <input type="range" min="0" max="100" value="${item.volumes[label]}"
                  class="volSlider" data-index="${i}" data-label="${label}" ${has ? '' : 'disabled'}>
                <span class="vol-value">${has ? item.volumes[label] : '–'}</span>
                <button type="button" class="muteBtn ${item.muted && item.muted[label] ? 'active' : ''}" data-index="${i}" data-label="${label}" ${has ? '' : 'disabled'} style="padding: 0.25rem 0.6rem; font-size: 0.75rem; background: transparent; border: 1px solid var(--border);">Mute</button>
              </div>
              ${has ? `<div class="stem-filename">${stemFilename(path)}</div>` : ''}
            `;
          }).join('')}
          <div style="margin-top: 0.5rem; display: flex; gap: 0.5rem; align-items: center;">
            <button type="button" class="playTrackBtn" data-index="${i}">Spela denna låt</button>
            <button type="button" class="btn-danger removeTrackBtn" data-id="${item.playlistSongId}">Ta bort</button>
            <span class="loading-note" data-index="${i}"></span>
          </div>
        </div>
      </details>
    </div>
  `).join('');

  document.querySelectorAll('.quick-play').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      playAt(parseInt(e.target.dataset.index), 0);
    });
  });

  document.querySelectorAll('.playTrackBtn').forEach(btn => {
    btn.addEventListener('click', (e) => playAt(parseInt(e.target.dataset.index), 0));
  });

  document.querySelectorAll('.removeTrackBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const id = e.target.dataset.id;
      await supabaseClient.from('playlist_songs').delete().eq('id', id);
      loadPlaylistDetail();
    });
  });

  document.querySelectorAll('.volSlider').forEach(slider => {
    slider.addEventListener('input', (e) => {
      const i = parseInt(e.target.dataset.index);
      const label = e.target.dataset.label;
      const value = parseInt(e.target.value);
      tracks[i].volumes[label] = value;
      e.target.nextElementSibling.textContent = value;
      if (i === currentIndex && gainNodes[label]) {
        gainNodes[label].gain.value = value / 100;
      }
    });
    slider.addEventListener('change', async (e) => {
      const i = parseInt(e.target.dataset.index);
      const label = e.target.dataset.label;
      const item = tracks[i];
      await supabaseClient.from('playlist_songs')
        .update({ [volColumns[label]]: item.volumes[label] })
        .eq('id', item.playlistSongId);
    });
  });
}

async function ensureSignedUrls(index) {
  const item = tracks[index];
  if (item.signedUrls) return item.signedUrls;
  const urls = {};
  for (const label of priorityOrder) {
    const path = item.song[stemFields[label]];
    if (!path) { urls[label] = null; continue; }
    const { data: signed } = await supabaseClient.storage.from('heavy-voices-stems').createSignedUrl(path, 3600);
    urls[label] = signed ? signed.signedUrl : null;
  }
  item.signedUrls = urls;
  return urls;
}

async function ensureBuffers(index) {
  const item = tracks[index];
  if (item.buffers) return item.buffers;

  const note = document.querySelector(`.loading-note[data-index="${index}"]`);
  if (note) note.textContent = 'Laddar ljud...';

  const urls = await ensureSignedUrls(index);
  const buffers = {};

  await Promise.all(priorityOrder.map(async (label) => {
    if (!urls[label]) { buffers[label] = null; return; }
    try {
      const res = await fetch(urls[label]);
      const arrayBuffer = await res.arrayBuffer();
      buffers[label] = await audioCtx.decodeAudioData(arrayBuffer);
    } catch (err) {
      buffers[label] = null;
    }
  }));

  item.buffers = buffers;
  if (note) note.textContent = '';
  return buffers;
}

function stopSources() {
  for (const label of Object.keys(activeSources)) {
    const source = activeSources[label];
    source.onended = null;
    try { source.stop(); } catch (e) {}
  }
  activeSources = {};
}

async function playAt(index, offsetSeconds) {
  if (index < 0 || index >= tracks.length) {
    stopSources();
    isPlaying = false;
    stopProgressTimer();
    renderFloatingPlayer();
    return;
  }

  ensureAudioContext();
  manualStop = true;
  stopSources();

  currentIndex = index;
  const item = tracks[index];

  const buffers = await ensureBuffers(index);

  referenceLabel = priorityOrder.find(l => buffers[l]) || null;
  if (!referenceLabel) {
    alert('Inga stämfiler uppladdade för den här låten.');
    renderTracks();
    return;
  }
  currentDuration = buffers[referenceLabel].duration;
  document.getElementById('progressSlider').max = currentDuration;
  document.getElementById('timeTotal').textContent = formatTime(currentDuration);

  const startAt = audioCtx.currentTime + 0.15;

  for (const label of priorityOrder) {
    if (!buffers[label]) continue;
    const source = audioCtx.createBufferSource();
    source.buffer = buffers[label];
    source.connect(gainNodes[label]);
    gainNodes[label].gain.value = (item.muted && item.muted[label]) ? 0 : (item.volumes[label] || 0) / 100;
    source.start(startAt, offsetSeconds);
    activeSources[label] = source;
  }

  manualStop = false;
  activeSources[referenceLabel].onended = () => {
    if (manualStop) return;
    if (isRepeat) playAt(currentIndex, 0);
    else playAt(currentIndex + 1, 0);
  };

  playbackStartTime = startAt;
  playbackOffset = offsetSeconds;
  isPlaying = true;
  startProgressTimer();
  renderFloatingPlayer();
  renderTracks();
  updateMediaSession(item.song.title);
}

function pauseAll() {
  if (currentIndex < 0) return;
  manualStop = true;
  const elapsed = Math.max(0, audioCtx.currentTime - playbackStartTime + playbackOffset);
  stopSources();
  playbackOffset = elapsed;
  isPlaying = false;
  stopProgressTimer();
  renderFloatingPlayer();
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
}

function resumeAll() {
  if (currentIndex < 0) return;
  playAt(currentIndex, playbackOffset);
}

function startProgressTimer() {
  stopProgressTimer();
  progressTimer = setInterval(() => {
    if (!isPlaying || isSeeking) return;
    const elapsed = audioCtx.currentTime - playbackStartTime + playbackOffset;
    document.getElementById('progressSlider').value = Math.min(elapsed, currentDuration);
    document.getElementById('timeElapsed').textContent = formatTime(elapsed);
  }, 250);
}
function stopProgressTimer() {
  if (progressTimer) clearInterval(progressTimer);
  progressTimer = null;
}

function renderFloatingPlayer() {
  const bar = document.getElementById('floatingPlayer');
  if (currentIndex < 0 || !tracks[currentIndex]) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  document.getElementById('nowPlayingTitle').textContent = tracks[currentIndex].song.title;
  document.getElementById('playPauseBtn').textContent = isPlaying ? 'Pausa' : 'Spela';
  document.getElementById('repeatBtn').className = isRepeat ? 'active' : '';
}

function updateMediaSession(title) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: title,
    artist: 'Heavy Voices',
    album: playlistName,
  });
  navigator.mediaSession.playbackState = 'playing';
  navigator.mediaSession.setActionHandler('play', resumeAll);
  navigator.mediaSession.setActionHandler('pause', pauseAll);
  navigator.mediaSession.setActionHandler('previoustrack', () => playAt(currentIndex - 1, 0));
  navigator.mediaSession.setActionHandler('nexttrack', () => playAt(currentIndex + 1, 0));
}

document.getElementById('playPauseBtn').addEventListener('click', () => {
  if (currentIndex < 0) return;
  isPlaying ? pauseAll() : resumeAll();
});
document.getElementById('prevBtn').addEventListener('click', () => playAt(currentIndex - 1, 0));
document.getElementById('nextBtn').addEventListener('click', () => playAt(currentIndex + 1, 0));
document.getElementById('repeatBtn').addEventListener('click', (e) => {
  isRepeat = !isRepeat;
  e.target.className = isRepeat ? 'active' : '';
});

const progressSlider = document.getElementById('progressSlider');
progressSlider.addEventListener('input', (e) => {
  isSeeking = true;
  document.getElementById('timeElapsed').textContent = formatTime(parseFloat(e.target.value));
});
progressSlider.addEventListener('change', (e) => {
  isSeeking = false;
  if (currentIndex < 0) return;
  playAt(currentIndex, parseFloat(e.target.value));
});

document.getElementById('playAllBtn').addEventListener('click', () => playAt(0, 0));

(async () => {
  const member = await requireAuth();
  if (!member) return;
  currentMemberId = member.id;

  if (playlistId) {
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    await loadPlaylistDetail();
  } else {
    document.getElementById('listView').style.display = 'block';
    document.getElementById('detailView').style.display = 'none';
    await loadPlaylistsList();
  }
})();
</script>

</body>
</html>
