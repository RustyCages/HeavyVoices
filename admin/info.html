<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Information, filer och dokument — Heavy Voices Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .info-content { white-space: pre-wrap; line-height: 1.7; }
  #infoEditForm textarea { min-height: 260px; font-family: inherit; }
  .section-heading { margin: 2.5rem 0 1rem; }

  /* ---------- Filer och Dokument ---------- */
  .toolbar { display:flex; gap:0.75rem; margin-bottom:1.25rem; flex-wrap:wrap; }
  .breadcrumbs { display:flex; align-items:center; flex-wrap:wrap; gap:0.35rem; margin-bottom:1.25rem; font-family:'Roboto Condensed', sans-serif; font-size:1.05rem; }
  .breadcrumbs a { color:var(--accent); cursor:pointer; }
  .breadcrumbs a:hover { text-decoration:underline; }
  .breadcrumbs .sep { color:var(--text-muted); }
  .breadcrumbs .current { color:var(--text); }

  .file-row {
    display:flex; align-items:center; gap:0.9rem; padding:0.75rem 0.5rem;
    border-bottom:1px solid var(--border); border-radius:0.5rem;
  }
  .file-row:last-child { border-bottom:none; }
  .file-row.folder-row { cursor:pointer; transition:background 0.15s ease; }
  .file-row.folder-row:hover { background:rgba(255,255,255,0.03); }

  .file-icon { flex-shrink:0; width:1.6rem; height:1.6rem; color:var(--text-muted); }
  .file-icon.folder-icon { color:var(--accent); }
  .file-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-row.clickable { cursor: pointer; transition: background 0.15s ease; }
  .file-row.clickable:hover { background: rgba(255,255,255,0.03); }
  .file-row.clickable:hover .file-name { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

  .file-meta { font-size:0.8rem; color:var(--text-muted); white-space:nowrap; }

  .icon-btn {
    flex-shrink:0; width:2.2rem; height:2.2rem; min-width:2.2rem;
    border-radius:50%; padding:0; font-size:1rem; line-height:1;
  }
  .danger { background:#ef4444; color:#fff; }
  .danger:hover { background:#dc2626; }

  #dropHint { font-size:0.85rem; color:var(--text-muted); margin-bottom:1.25rem; }

  .file-row[draggable="true"] { cursor:grab; }
  .file-row.dragging { opacity:0.4; }
  .drop-target { outline:2px dashed var(--accent); outline-offset:-2px; background:rgba(229,169,104,0.08) !important; }
  .breadcrumbs a.drop-target { border-radius:0.3rem; padding:0 0.3rem; }
  .row-actions { display:flex; gap:0.35rem; flex-shrink:0; }
  @media (max-width: 600px) {
    .file-meta { display:none; }
    #dropHint { display:none; } /* dra-och-släpp finns inte på pekskärm – där används Flytta-knappen */
    .icon-btn { width:2rem; height:2rem; min-width:2rem; }
    .row-actions { gap:0.25rem; }
  }

  /* Flytta-dialog */
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:1000; padding:1rem; }
  .modal-backdrop[hidden] { display:none; }
  .modal { background:var(--bg); border:1px solid var(--border); border-radius:0.8rem; width:100%; max-width:440px; max-height:80vh; display:flex; flex-direction:column; box-shadow:var(--card-shadow); }
  .modal h3 { margin:0; padding:1rem 1.2rem 0.4rem; }
  .modal .modal-sub { padding:0 1.2rem 0.75rem; font-size:0.85rem; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .folder-pick-list { overflow-y:auto; padding:0 0.6rem; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
  .folder-pick { display:flex; align-items:center; gap:0.5rem; width:100%; background:none; color:var(--text); border:none; border-radius:0.4rem; padding:0.55rem 0.6rem; text-align:left; font-weight:400; cursor:pointer; }
  .folder-pick:hover:not(:disabled) { background:rgba(255,255,255,0.05); color:var(--text); }
  .folder-pick:disabled { opacity:0.35; cursor:not-allowed; }
  .folder-pick .file-icon { width:1.2rem; height:1.2rem; }
  .modal-actions { display:flex; justify-content:flex-end; padding:0.8rem 1.2rem; }

  /* Mobil: filer på två rader – namnet överst över hela bredden, storlek/datum + knappar under */
  @media (max-width: 600px) {
    .file-row:not(.folder-row) { display: grid; grid-template-columns: auto 1fr auto; column-gap: 0.75rem; row-gap: 0.4rem; align-items: center; }
    .file-row:not(.folder-row) > .file-icon { grid-row: 1 / span 2; align-self: start; }
    .file-row:not(.folder-row) > .file-name { grid-column: 2 / 4; }
    .file-row:not(.folder-row) > .file-meta { display: block; grid-column: 2; font-size: 0.75rem; white-space: normal; }
    .file-row:not(.folder-row) > .row-actions,
    .file-row:not(.folder-row) > .downloadBtn { grid-column: 3; justify-self: end; }
    /* Långa namn får bryta på två rader i stället för att klippas */
    .file-name { white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
  }
</style>
</head>
<body>

<header class="site-header site-header--small"><a href="/admin/" class="site-logo-link" aria-label="Heavy Voices – till startsidan"><picture><source srcset="/icons/logo-text.webp" type="image/webp"><img src="/icons/logo-text.png" alt="Heavy Voices" class="site-logo-text" width="480" height="220"></picture></a></header>
<div class="container">
  <a href="/admin/" class="back-btn">&larr; Tillbaka</a>
  <h1>Information</h1>

  <div class="card">
    <div class="info-content" id="infoContent"><p class="text-muted">Laddar...</p></div>
  </div>

  <div class="card" id="infoEditCard" style="margin-top: 1.5rem; display: none;">
    <h3>Redigera information</h3>
    <form id="infoEditForm">
      <textarea id="infoTextarea" placeholder="Skriv körinfo, klädsel, kontakter m.m. här..." style="width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:0.6rem 0.9rem;"></textarea>
      <button type="submit">Spara</button>
      <p class="error" id="infoSaveError"></p>
    </form>
  </div>

  <h2 class="section-heading" id="filer">Filer och Dokument</h2>


  <div class="toolbar">
    <button class="btn-gold" id="newFolderBtn">+ Ny mapp</button>
    <button class="btn-outline" id="uploadBtn">Ladda upp fil(er)</button>
    <input type="file" id="fileInput" multiple style="display:none;">
  </div>

  <div class="breadcrumbs" id="breadcrumbs"></div>

  <p id="dropHint">Tips: dra en fil eller mapp och släpp den på en mapp – eller på en mapp i sökvägen ovan – för att flytta den.</p>

  <div class="card">
    <div id="fileList"><p class="text-muted">Laddar...</p></div>
  </div>
</div>

<div class="modal-backdrop" id="moveModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="moveModalTitle">
    <h3 id="moveModalTitle">Flytta till…</h3>
    <div class="modal-sub" id="moveModalSub"></div>
    <div class="folder-pick-list" id="folderPickList"><p class="text-muted" style="padding:0.6rem;">Laddar mappar...</p></div>
    <div class="modal-actions"><button class="btn-outline" id="moveCancelBtn">Avbryt</button></div>
  </div>
</div>

<div id="toast" style="position:fixed; bottom:1.5rem; right:1.5rem; background:var(--accent); color:#111317; padding:0.7rem 1.2rem; border-radius:0.6rem; font-weight:600; box-shadow:var(--card-shadow); z-index:999; display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
const BUCKET = 'heavy-voices-filer';
const PLACEHOLDER = '.keep';

let currentPath = []; // array of folder-name segments

function pathStr(segments) {
  return (segments || currentPath).join('/');
}

function joinPath(prefix, name) {
  return prefix ? `${prefix}/${name}` : name;
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, ms = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.display = 'none'; }, ms);
}

// Supabase Storage tillåter bara vissa ASCII-tecken i sökvägar – "Sångtext.pdf" avvisas annars.
// Övriga tecken (å, ä, ö, é, # …) kodas därför som (u00e5) i lagringen och avkodas när de visas.
const encName = name => String(name).normalize('NFC').replace(/[^\w\/!\-.*'() &$@=;:+,?]/gu,
  c => `(u${c.codePointAt(0).toString(16).padStart(4, '0')})`);
// Öppna en fil i en ny flik: PDF, bilder, ljud och text visas direkt i webbläsaren,
// Word/Excel/PowerPoint via Microsofts visare. Fönstret öppnas direkt i klicket så att popup-blockerare släpper igenom det.
const OFFICE_EXT = /\.(docx?|xlsx?|pptx?)$/i;
async function openFile(fullPath, displayName) {
  const win = window.open('', '_blank');
  const { data, error } = await supabaseClient.storage.from(BUCKET).createSignedUrl(fullPath, 3600);
  if (error || !data) { if (win) win.close(); toast('Kunde inte öppna filen' + (error ? ': ' + error.message : '')); return; }
  const url = OFFICE_EXT.test(displayName)
    ? `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(data.signedUrl)}`
    : data.signedUrl;
  if (win) win.location.href = url; else window.location.href = url;
}

const decName = name => String(name).replace(/\(u([0-9a-f]{4,6})\)/g, (_, h) => String.fromCodePoint(parseInt(h, 16)));

function fmtSize(bytes) {
  if (bytes == null) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('sv-SE', { day: 'numeric', month: 'short', year: 'numeric' });
}

const folderIconSvg = `<svg class="file-icon folder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>`;
const fileIconSvg = `<svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`;
const downloadIconSvg = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`;
const renameIconSvg = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>`;
const moveIconSvg = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><path d="M10 13h6"></path><path d="m13 10 3 3-3 3"></path></svg>`;
const trashIconSvg = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>`;

function renderBreadcrumbs() {
  const el = document.getElementById('breadcrumbs');
  el.innerHTML = '';

  const rootLink = document.createElement('a');
  rootLink.textContent = 'Filer';
  rootLink.addEventListener('click', () => { currentPath = []; loadCurrent(); });
  makeDropTarget(rootLink, '');
  el.appendChild(rootLink);

  currentPath.forEach((seg, idx) => {
    const sep = document.createElement('span');
    sep.className = 'sep';
    sep.textContent = ' / ';
    el.appendChild(sep);

    if (idx === currentPath.length - 1) {
      const cur = document.createElement('span');
      cur.className = 'current';
      cur.textContent = decName(seg);
      el.appendChild(cur);
    } else {
      const a = document.createElement('a');
      a.textContent = decName(seg);
      a.addEventListener('click', () => { currentPath = currentPath.slice(0, idx + 1); loadCurrent(); });
      makeDropTarget(a, pathStr(currentPath.slice(0, idx + 1)));
      el.appendChild(a);
    }
  });
}

async function loadCurrent() {
  renderBreadcrumbs();
  const listEl = document.getElementById('fileList');
  listEl.innerHTML = '<p class="text-muted">Laddar...</p>';

  const prefix = pathStr();
  const { data, error } = await supabaseClient.storage.from(BUCKET).list(prefix, {
    limit: 500,
    sortBy: { column: 'name', order: 'asc' }
  });

  if (error) { listEl.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`; return; }

  const items = (data || []).filter(item => item.name !== PLACEHOLDER);
  const folders = items.filter(item => item.id === null);
  const files = items.filter(item => item.id !== null);

  if (!folders.length && !files.length) {
    listEl.innerHTML = '<p class="text-muted">Mappen är tom.</p>';
    return;
  }

  listEl.innerHTML = '';

  folders.forEach(folder => {
    const row = document.createElement('div');
    row.className = 'file-row folder-row';
    row.innerHTML = `
      ${folderIconSvg}
      <span class="file-name">${escapeHtml(decName(folder.name))}</span>
      <div class="row-actions">
        <button class="btn-outline icon-btn renameBtn" title="Byt namn">${renameIconSvg}</button>
        <button class="btn-outline icon-btn moveBtn" title="Flytta">${moveIconSvg}</button>
        <button class="btn-outline icon-btn deleteFolderBtn" title="Radera mapp">${trashIconSvg}</button>
      </div>
    `;
    const folderEntry = { type: 'folder', name: folder.name, path: joinPath(prefix, folder.name), parent: prefix };
    makeDraggable(row, folderEntry);
    makeDropTarget(row, folderEntry.path);
    row.querySelector('.renameBtn').addEventListener('click', (e) => { e.stopPropagation(); renameEntry(folderEntry); });
    row.querySelector('.moveBtn').addEventListener('click', (e) => { e.stopPropagation(); openMoveDialog(folderEntry); });
    row.addEventListener('click', (e) => {
      if (e.target.closest('.row-actions')) return;
      currentPath = [...currentPath, folder.name];
      loadCurrent();
    });
    row.querySelector('.deleteFolderBtn').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm(`Radera mappen "${decName(folder.name)}" och allt innehåll i den?`)) return;
      await deleteFolderRecursive(joinPath(prefix, folder.name));
      toast('Mapp raderad');
      loadCurrent();
    });
    listEl.appendChild(row);
  });

  files.forEach(file => {
    const fullPath = joinPath(prefix, file.name);
    const row = document.createElement('div');
    row.className = 'file-row';
    row.innerHTML = `
      ${fileIconSvg}
      <span class="file-name">${escapeHtml(decName(file.name))}</span>
      <span class="file-meta">${fmtSize(file.metadata && file.metadata.size)} · ${fmtDate(file.created_at)}</span>
      <div class="row-actions">
        <button class="btn-outline icon-btn renameBtn" title="Byt namn">${renameIconSvg}</button>
        <button class="btn-outline icon-btn moveBtn" title="Flytta">${moveIconSvg}</button>
        <button class="btn-outline icon-btn downloadBtn" title="Ladda ner">${downloadIconSvg}</button>
        <button class="danger icon-btn deleteFileBtn" title="Radera fil">${trashIconSvg}</button>
      </div>
    `;
    const fileEntry = { type: 'file', name: file.name, path: fullPath, parent: prefix };
    row.classList.add('clickable');
    row.title = 'Öppna ' + decName(file.name);
    row.addEventListener('click', (e) => { if (!e.target.closest('button')) openFile(fullPath, decName(file.name)); });
    makeDraggable(row, fileEntry);
    row.querySelector('.renameBtn').addEventListener('click', () => renameEntry(fileEntry));
    row.querySelector('.moveBtn').addEventListener('click', () => openMoveDialog(fileEntry));
    row.querySelector('.downloadBtn').addEventListener('click', async () => {
      // Laddas ner med rätt filnamn (åäö återställda)
      const { data: signed, error: signErr } = await supabaseClient.storage.from(BUCKET)
        .createSignedUrl(fullPath, 3600, { download: decName(file.name) });
      if (signErr) { toast('Fel: ' + signErr.message); return; }
      const a = document.createElement('a');
      a.href = signed.signedUrl;
      document.body.appendChild(a); a.click(); a.remove();
    });
    row.querySelector('.deleteFileBtn').addEventListener('click', async () => {
      if (!confirm(`Radera filen "${decName(file.name)}"?`)) return;
      const { error: delErr } = await supabaseClient.storage.from(BUCKET).remove([fullPath]);
      if (delErr) { toast('Fel: ' + delErr.message); return; }
      toast('Fil raderad');
      loadCurrent();
    });
    listEl.appendChild(row);
  });
}

// Recursively collects every real file path under a prefix (walking into subfolders),
// so a folder can be deleted even though Supabase Storage has no real "delete folder" —
// removing every object under it is what makes the (virtual) folder disappear.
async function collectAllFilePaths(prefix) {
  const { data, error } = await supabaseClient.storage.from(BUCKET).list(prefix, { limit: 1000 });
  if (error || !data) return [];
  let paths = [];
  for (const item of data) {
    const fullPath = joinPath(prefix, item.name);
    if (item.id === null) {
      paths = paths.concat(await collectAllFilePaths(fullPath));
    } else {
      paths.push(fullPath);
    }
  }
  return paths;
}

async function deleteFolderRecursive(prefix) {
  const paths = await collectAllFilePaths(prefix);
  if (!paths.length) return;
  // Supabase remove() takes an array of paths; batch to be safe on very large folders.
  const BATCH = 100;
  for (let i = 0; i < paths.length; i += BATCH) {
    await supabaseClient.storage.from(BUCKET).remove(paths.slice(i, i + BATCH));
  }
}

// =========================================================
// Flytta / byt namn
// Supabase Storage har inga riktiga mappar: en "mapp" är bara ett gemensamt prefix.
// Att flytta/byta namn på en mapp = flytta varje objekt under prefixet (inkl. .keep).
// =========================================================
async function exists(parentPrefix, name) {
  const { data } = await supabaseClient.storage.from(BUCKET).list(parentPrefix, { limit: 1000, search: name });
  return (data || []).some(item => item.name === name);
}

function validName(name) {
  return name && !name.includes('/') && name !== PLACEHOLDER && name !== '.' && name !== '..';
}

async function moveObjects(pairs) {
  let failed = 0, lastError = '';
  for (const [from, to] of pairs) {
    const { error } = await supabaseClient.storage.from(BUCKET).move(from, to);
    if (error) { failed++; lastError = error.message; }
  }
  return { failed, lastError };
}

// Flyttar en fil eller mapp till destParent med namnet newName.
async function relocate(entry, destParent, newName) {
  const target = joinPath(destParent, newName);
  if (target === entry.path) return false;

  if (entry.type === 'folder' && (target + '/').startsWith(entry.path + '/')) {
    toast('En mapp kan inte flyttas in i sig själv'); return false;
  }
  if (await exists(destParent, newName)) {
    toast(`"${newName}" finns redan där`); return false;
  }

  let pairs;
  if (entry.type === 'file') {
    pairs = [[entry.path, target]];
  } else {
    const all = await collectAllFilePaths(entry.path);
    if (!all.length) { toast('Mappen är tom och kunde inte flyttas'); return false; }
    pairs = all.map(p => [p, target + p.slice(entry.path.length)]);
  }

  const { failed, lastError } = await moveObjects(pairs);
  if (failed) {
    toast(`${failed} av ${pairs.length} objekt kunde inte flyttas: ${lastError}`);
  }
  return failed < pairs.length;
}

async function renameEntry(entry) {
  const label = entry.type === 'folder' ? 'mappen' : 'filen';
  const shown = decName(entry.name);
  const input = prompt(`Nytt namn på ${label}:`, shown);
  if (input == null) return;
  const newName = input.trim();
  if (newName === shown) return;
  if (!validName(newName)) { toast('Ogiltigt namn'); return; }

  // Tappade användaren filändelsen? Behåll den gamla.
  let finalName = newName;
  const oldExt = entry.type === 'file' && shown.includes('.') ? shown.slice(shown.lastIndexOf('.')) : '';
  if (oldExt && !newName.includes('.')) finalName = newName + oldExt;

  if (await relocate(entry, entry.parent, encName(finalName))) {
    toast('Namn ändrat');
    loadCurrent();
  }
}

async function moveEntryTo(entry, destParent) {
  if (destParent === entry.parent) return;
  toast('Flyttar…');
  if (await relocate(entry, destParent, entry.name)) {
    toast(`Flyttad till ${destParent ? '/' + decName(destParent) : 'Filer'}`);
    loadCurrent();
  }
}

// ---- Flytta-dialog ----
async function listAllFolders(prefix = '', depth = 0, out = []) {
  const { data } = await supabaseClient.storage.from(BUCKET).list(prefix, { limit: 1000, sortBy: { column: 'name', order: 'asc' } });
  for (const item of (data || [])) {
    if (item.id !== null) continue;
    const p = joinPath(prefix, item.name);
    out.push({ path: p, name: item.name, depth });
    await listAllFolders(p, depth + 1, out);
  }
  return out;
}

let moveEntry = null;
const moveModal = document.getElementById('moveModal');

function closeMoveDialog() { moveModal.hidden = true; moveEntry = null; }
document.getElementById('moveCancelBtn').addEventListener('click', closeMoveDialog);
moveModal.addEventListener('click', (e) => { if (e.target === moveModal) closeMoveDialog(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !moveModal.hidden) closeMoveDialog(); });

async function openMoveDialog(entry) {
  moveEntry = entry;
  document.getElementById('moveModalSub').textContent = decName(entry.name);
  const listEl = document.getElementById('folderPickList');
  listEl.innerHTML = '<p class="text-muted" style="padding:0.6rem;">Laddar mappar...</p>';
  moveModal.hidden = false;

  const folders = [{ path: '', name: 'Filer (rot)', depth: 0 }, ...(await listAllFolders()).map(f => ({ ...f, depth: f.depth + 1 }))];
  if (moveEntry !== entry) return; // dialogen stängdes under laddning

  listEl.innerHTML = '';
  folders.forEach(f => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'folder-pick';
    btn.style.paddingLeft = (0.6 + f.depth * 1.1) + 'rem';
    btn.innerHTML = `${folderIconSvg}<span>${escapeHtml(decName(f.name))}</span>`;
    const isCurrent = f.path === entry.parent;
    const isSelfOrChild = entry.type === 'folder' && (f.path + '/').startsWith(entry.path + '/');
    if (isCurrent || isSelfOrChild) {
      btn.disabled = true;
      if (isCurrent) btn.title = 'Ligger redan här';
    }
    btn.addEventListener('click', async () => {
      closeMoveDialog();
      await moveEntryTo(entry, f.path);
    });
    listEl.appendChild(btn);
  });
}

// ---- Dra och släpp ----
let dragEntry = null;

function makeDraggable(row, entry) {
  row.draggable = true;
  row.addEventListener('dragstart', (e) => {
    dragEntry = entry;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', entry.path);
  });
  row.addEventListener('dragend', () => {
    dragEntry = null;
    row.classList.remove('dragging');
    document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
  });
}

function canDrop(destPath) {
  if (!dragEntry) return false;
  if (destPath === dragEntry.parent) return false;
  if (dragEntry.type === 'folder' && (destPath + '/').startsWith(dragEntry.path + '/')) return false;
  return true;
}

function makeDropTarget(el, destPath) {
  el.addEventListener('dragover', (e) => {
    if (!canDrop(destPath)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    el.classList.add('drop-target');
  });
  el.addEventListener('dragleave', (e) => {
    if (!el.contains(e.relatedTarget)) el.classList.remove('drop-target');
  });
  el.addEventListener('drop', async (e) => {
    e.preventDefault();
    el.classList.remove('drop-target');
    const entry = dragEntry;
    if (!entry || !canDrop(destPath)) return;
    await moveEntryTo(entry, destPath);
  });
}

document.getElementById('newFolderBtn').addEventListener('click', async () => {
  const name = prompt('Namn på ny mapp:');
  if (!name) return;
  const clean = name.trim();
  if (!clean || clean.includes('/')) { toast('Ogiltigt mappnamn'); return; }

  const prefix = pathStr();
  const placeholderPath = joinPath(prefix, encName(clean)) + '/' + PLACEHOLDER;
  const { error } = await supabaseClient.storage.from(BUCKET).upload(placeholderPath, new Blob(['']), {
    contentType: 'text/plain',
    upsert: false
  });
  if (error) { toast('Fel: ' + error.message); return; }
  toast('Mapp skapad');
  loadCurrent();
});

function friendlyUploadError(error) {
  const msg = (error && error.message) || String(error);
  if (/payload too large|exceeded the maximum|too large|413/i.test(msg)) return 'filen är för stor (max storlek för lagringen överskreds)';
  if (/row-level security|unauthorized|403|not allowed/i.test(msg)) return 'saknar behörighet (kontrollera lagringsreglerna i Supabase)';
  if (/mime|content type/i.test(msg)) return 'filtypen är inte tillåten i lagringen';
  if (/invalid key/i.test(msg)) return 'ogiltigt filnamn';
  return msg;
}

document.getElementById('uploadBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  const prefix = pathStr();
  const btn = document.getElementById('uploadBtn');
  const btnText = btn.textContent;
  btn.disabled = true;

  let ok = 0, skipped = 0;
  const failed = [];
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    btn.textContent = files.length > 1 ? `Laddar upp ${i + 1}/${files.length}…` : 'Laddar upp…';
    const fullPath = joinPath(prefix, encName(file.name));
    let { error } = await supabaseClient.storage.from(BUCKET).upload(fullPath, file, { upsert: false, contentType: file.type || undefined });
    if (error && /exists|duplicate/i.test(error.message || '')) {
      if (!confirm(`"${file.name}" finns redan här. Skriva över?`)) { skipped++; continue; }
      ({ error } = await supabaseClient.storage.from(BUCKET).upload(fullPath, file, { upsert: true, contentType: file.type || undefined }));
    }
    if (error) failed.push(`${file.name}: ${friendlyUploadError(error)}`);
    else ok++;
  }

  btn.disabled = false;
  btn.textContent = btnText;
  e.target.value = '';
  loadCurrent();

  if (failed.length) {
    toast(`${ok} av ${files.length} uppladdade – ${failed.length} misslyckades`, 5000);
    alert('Följande filer kunde inte laddas upp:\n\n' + failed.join('\n'));
  } else if (ok) {
    toast(ok === 1 ? `"${files[0].name}" uppladdad` : `${ok} filer uppladdade`);
  } else if (skipped) {
    toast('Inget laddades upp');
  }
});

// =========================================================
// Information
// =========================================================
let currentContent = '';

async function loadInfo() {
  const { data, error } = await supabaseClient.from('choir_info').select('content').eq('id', 1).single();
  const el = document.getElementById('infoContent');
  if (error) { el.innerHTML = `<p class="error">${error.message}</p>`; return; }
  currentContent = data.content || '';
  el.textContent = currentContent || 'Ingen information tillagd än.';
  document.getElementById('infoTextarea').value = currentContent;
}

document.getElementById('infoEditForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('infoSaveError');
  errorEl.textContent = '';

  const newContent = document.getElementById('infoTextarea').value;
  const { error } = await supabaseClient
    .from('choir_info')
    .update({ content: newContent })
    .eq('id', 1);

  if (error) { errorEl.textContent = error.message; return; }
  await loadInfo();
});

(async () => {
  const member = await requireAuth('admin');
  if (!member) return;
  document.getElementById('infoEditCard').style.display = 'block';
  loadCurrent();          // filer och dokument
  await loadInfo();
  if (location.hash === '#filer') document.getElementById('filer').scrollIntoView();
})();
</script>
