<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/install-app.js" defer></script>
<script>
(async () => {
  const member = await requireAuth();
  if (member) {
    document.getElementById('welcome').textContent = `Välkommen ${member.name}`;
    document.getElementById('roleBadge').textContent = member.role;
    loadCheckin(member);
    if (member.role === 'admin') {
      const a = document.createElement('a');
      a.href = '/admin/';
      a.className = 'back-btn';
      a.innerHTML = '&larr; Till adminsidan';
      document.querySelector('.container').prepend(a);
    }
  }
})();

document.getElementById('logoutBtn').addEventListener('click', signOut);

// ---------- Närvarocheck ----------
const TYPE_LABELS = { rep: 'Repetition', konsert: 'Konsert', ovrigt: 'Övrigt' };
function escHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function todayStockholm() { return new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Stockholm' }); } // YYYY-MM-DD
function hhmm(t) { return t ? t.slice(0, 5) : ''; }

async function loadCheckin(member) {
  if (member.status && member.status !== 'approved') return;
  const today = todayStockholm();
  const { data: events, error } = await supabaseClient
    .from('events').select('id, title, event_type, event_time, end_time, location')
    .eq('event_date', today).order('event_time', { nullsFirst: true });
  if (error || !events || !events.length) return;

  const { data: mine } = await supabaseClient
    .from('attendance').select('event_id, checked_in_at')
    .eq('member_id', member.id).in('event_id', events.map(e => e.id));
  const checked = new Map((mine || []).map(a => [String(a.event_id), a.checked_in_at]));

  const list = document.getElementById('checkinList');
  list.innerHTML = '';
  events.forEach(ev => {
    const row = document.createElement('div');
    row.className = 'checkin-row';
    const time = ev.event_time ? hhmm(ev.event_time) + (ev.end_time ? '–' + hhmm(ev.end_time) : '') : '';
    const meta = [TYPE_LABELS[ev.event_type] || '', time, ev.location || ''].filter(Boolean).join(' · ');
    row.innerHTML = `<div class="checkin-info"><strong>${escHtml(ev.title)}</strong><span>${escHtml(meta)}</span></div><div class="checkin-action"></div>`;
    const action = row.querySelector('.checkin-action');

    const showChecked = (iso) => {
      const at = new Date(iso).toLocaleTimeString('sv-SE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Stockholm' });
      action.innerHTML = `<span class="checked-in">✓ Incheckad ${at}</span>`;
    };

    if (checked.has(String(ev.id))) {
      showChecked(checked.get(String(ev.id)));
    } else {
      const btn = document.createElement('button');
      btn.className = 'checkin-btn';
      btn.textContent = 'Checka in';
      btn.addEventListener('click', async () => {
        btn.disabled = true; btn.textContent = 'Checkar in…';
        const { data, error } = await supabaseClient.from('attendance')
          .insert({ event_id: ev.id, member_id: member.id }).select('checked_in_at').single();
        if (error) {
          // 23505 = redan incheckad (t.ex. från en annan enhet)
          if (error.code === '23505') { showChecked(new Date().toISOString()); return; }
          btn.disabled = false; btn.textContent = 'Checka in';
          alert('Kunde inte checka in: ' + error.message);
          return;
        }
        showChecked(data.checked_in_at);
      });
      action.appendChild(btn);
    }
    list.appendChild(row);
  });
  document.getElementById('checkinCard').hidden = false;
}
</script>

</body>
</html>
