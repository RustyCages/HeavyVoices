<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalender — Heavy Voices Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  /* Flikar och kort – samma upplägg som medlemmarnas kalender */
  .tabs { display: flex; gap: 0.75rem; margin: 2rem 0 1.25rem; flex-wrap: wrap; }
  .tab-btn { background: rgba(255,255,255,0.06); color: #d1d5db; border: 1px solid rgba(255,255,255,0.12); padding: 0.6rem 1.2rem; }
  .tab-btn.active { background: var(--accent); color: #111317; }
  .tab-btn .count { opacity: 0.7; font-weight: 500; margin-left: 0.3rem; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .event-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 0.9rem;
    padding: 1.1rem 1.3rem; margin-bottom: 0.9rem; box-shadow: var(--card-shadow); }
  .event-item.past { opacity: 0.55; }
  .event-date { font-family: 'Roboto Condensed', sans-serif; font-size: 1.15rem; min-width: 95px; }
  .event-actions { display: flex; flex-direction: column; gap: 0.35rem; min-width: 7.5rem; }
  .event-actions button { justify-content: center; }
  details.past-group { margin-top: 1.5rem; }
  details.past-group > summary { cursor: pointer; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 0.9rem; }
  @media (max-width: 600px) {
    .event-item { padding: 0.9rem 1rem; }
    .event-actions { flex-direction: row; flex-wrap: wrap; flex-basis: 100%; }
  }
  .event-type-rep { color: #60a5fa; }
  .event-type-konsert { color: var(--accent); }
  .event-type-ovrigt { color: var(--text-muted); }
  .event-meta { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .form-row > label { display: block; min-width: 0; }
  [hidden] { display: none !important; }
  .choice-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .choice-box { background: var(--bg); border: 1px solid var(--border); border-radius: 0.9rem; padding: 1.3rem 1.3rem 1rem; width: 100%; max-width: 380px; box-shadow: var(--card-shadow); }
  .choice-box h3 { margin: 0 0 0.3rem; }
  .choice-box p { margin: 0 0 1rem; color: var(--text-muted); font-size: 0.9rem; }
  .choice-box .choice-btns { display: flex; flex-direction: column; gap: 0.5rem; }
  .choice-box .choice-btns button { justify-content: center; padding: 0.7rem 1rem; font-size: 0.95rem; } /* knapp- och gridstilar får inte ta över hidden */
  /* Egen tidsväljare: skriv tiden eller stega ±15 min (ersätter webbläsarens snurrhjul) */
  .tp { display: flex; align-items: stretch; gap: 0.3rem; margin-bottom: 0.85rem; }
  .tp .tp-text { flex: 1; min-width: 0; margin: 0; text-align: center; font-size: 1.05rem; font-variant-numeric: tabular-nums; letter-spacing: 0.03em; }
  .tp .tp-step { flex: 0 0 auto; width: 2.75rem; padding: 0; justify-content: center; font-size: 1.25rem;
    background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); }
  .tp .tp-step:hover { border-color: var(--accent); color: var(--accent); }
  @media (max-width: 520px) { .time-row { grid-template-columns: 1fr; gap: 0; } }
  .tp .tp-text.invalid { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.2); }
  .field-label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.25rem; }
  .event-item { flex-wrap: wrap; }
  /* Närvaro ser ut som Redigera; fylld när listan är utfälld */
  .att-btn { padding: 0.3rem 0.7rem; font-size: 0.85rem; background: transparent; border: 1px solid var(--accent); color: var(--accent); justify-content: center; }
  .att-btn.open { background: var(--accent); color: #111317; }
  .att-panel { flex-basis: 100%; background: rgba(255,255,255,0.03); border-radius: 0.6rem; padding: 0.75rem 0.9rem; }
  .att-summary { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.6rem; }
  .att-summary strong { color: var(--text); }
  .att-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0.15rem 1rem; }
  .att-member { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; padding: 0.25rem 0; cursor: pointer; }
  .att-member input { width: 1.05rem; height: 1.05rem; margin: 0; accent-color: #4ade80; }
  .att-member small { color: var(--text-muted); font-size: 0.75rem; }
  .att-member .by-admin { font-size: 0.7rem; color: var(--text-muted); }
  .att-group { grid-column: 1 / -1; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-top: 0.4rem; }
  .event-notes { white-space: pre-wrap; }
  .edit-btn { padding: 0.3rem 0.7rem; font-size: 0.85rem; background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  .event-item.editing { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  #eventFormCard.editing { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .scope-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.75rem; font-size: 0.9rem; }
  .scope-row label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
  .scope-row input { width: auto; margin: 0; accent-color: var(--accent); }
  .form-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .series-badge { font-size: 0.75rem; color: var(--text-muted); margin-left: 0.4rem; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.9rem; width: 100%; margin-bottom: 0.75rem; }
</style>
</head>
<body>

<header class="site-header"><span class="site-logo">Heavy Voices</span></header>
<div class="container">

  <a href="/admin/" class="back-btn">&larr; Tillbaka till admin</a>
  <h1>Kalender</h1>

  <div class="card" id="eventFormCard">
    <h3 id="formHeading">Lägg till händelse</h3>
    <form id="addEventForm">
      <div id="scopeWrap" hidden>
        <p class="field-label" style="margin:0 0 0.35rem;">Händelsen ingår i en serie. Ändra:</p>
        <div class="scope-row">
          <label><input type="radio" name="evScope" value="one" checked> Bara detta tillfälle</label>
          <label><input type="radio" name="evScope" value="all"> Alla tillfällen i serien</label>
        </div>
      </div>
      <input type="text" id="evTitle" placeholder="Titel" required>
      <select id="evType">
        <option value="rep">Repetition</option>
        <option value="konsert">Konsert</option>
        <option value="ovrigt">Övrigt</option>
      </select>
      <label><span class="field-label">Datum</span>
        <input type="date" id="evDate" required></label>
      <div class="form-row time-row">
        <div><span class="field-label">Från</span><div class="tp" data-target="evTime"></div><input type="hidden" id="evTime"></div>
        <div><span class="field-label">Till</span><div class="tp" data-target="evEndTime"></div><input type="hidden" id="evEndTime"></div>
      </div>
      <div class="form-row" id="repeatRow">
        <label><span class="field-label">Upprepa</span>
          <select id="evRepeat">
            <option value="">Upprepas inte</option>
            <option value="day">Varje dag</option>
            <option value="week">Varje vecka</option>
            <option value="month">Varje månad</option>
          </select></label>
        <label id="evRepeatUntilWrap" hidden><span class="field-label">Till och med</span>
          <input type="date" id="evRepeatUntil"></label>
      </div>
      <input type="text" id="evLocation" placeholder="Plats">
      <textarea id="evNotes" placeholder="Anteckningar / info till medlemmarna (t.ex. klädsel, insjungning, samlingstid)" style="width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:0.6rem 0.9rem; font-family:inherit; min-height:90px; margin-bottom:0.75rem;"></textarea>
      <div class="form-actions">
        <button type="submit" id="submitBtn">Lägg till</button>
        <button type="button" class="btn-outline" id="cancelEditBtn" hidden>Avbryt</button>
      </div>
      <p class="error" id="addEventError"></p>
    </form>
  </div>

  <div class="tabs" role="tablist">
    <button type="button" class="tab-btn active" data-tab="rep">Reptider<span class="count"></span></button>
    <button type="button" class="tab-btn" data-tab="konsert">Konserter<span class="count"></span></button>
    <button type="button" class="tab-btn" data-tab="ovrigt">Övrigt<span class="count"></span></button>
  </div>
  <div class="tab-panel active" data-panel="rep"><p class="text-muted">Laddar...</p></div>
  <div class="tab-panel" data-panel="konsert"><p class="text-muted">Laddar...</p></div>
  <div class="tab-panel" data-panel="ovrigt"><p class="text-muted">Laddar...</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
const typeLabels = { rep: 'Repetition', konsert: 'Konsert', ovrigt: 'Övrigt' };

const MAX_OCCURRENCES = 200;

function timeRange(ev) {
  if (!ev.event_time) return '';
  return ' ' + ev.event_time.slice(0,5) + (ev.end_time ? '–' + ev.end_time.slice(0,5) : '');
}

// Datumräkning i UTC så att sommartid inte flyttar dagar
function parseYmd(str) { const [y,m,d] = str.split('-').map(Number); return { y, m: m - 1, d }; }
function toYmd(y, m, d) { const dt = new Date(Date.UTC(y, m, d)); return dt.toISOString().slice(0, 10); }

function buildDates(startStr, repeat, untilStr) {
  if (!repeat) return [startStr];
  const { y, m, d } = parseYmd(startStr);
  const dates = [];
  for (let i = 0; dates.length < MAX_OCCURRENCES; i++) {
    let next;
    if (repeat === 'day')  next = toYmd(y, m, d + i);
    if (repeat === 'week') next = toYmd(y, m, d + i * 7);
    if (repeat === 'month') {
      // 31 jan → 28/29 feb → 31 mar: håll fast vid ursprungsdagen, kläm till månadens sista dag
      const lastDay = new Date(Date.UTC(y, m + i + 1, 0)).getUTCDate();
      next = toYmd(y, m + i, Math.min(d, lastDay));
    }
    if (next > untilStr) break;
    dates.push(next);
  }
  return dates;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short', year: 'numeric' });
}

// ---------- Närvaro ----------
let adminId = null;
let approvedMembers = [];          // [{ id, name, stamma }]
let attendanceByEvent = new Map(); // eventId -> Map(memberId -> { checked_by })
const openPanels = new Set();      // event-id:n vars närvarolista är utfälld
const todayStr = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Stockholm' });
const STAMMA_ORDER = ['sopran', 'alt', 'tenor', 'bas'];
const svCollator = new Intl.Collator('sv', { sensitivity: 'base', numeric: true });

function stammaRank(st) {
  const s = String(st || '').toLowerCase();
  const i = STAMMA_ORDER.findIndex(k => s.startsWith(k));
  return i === -1 ? 99 : i;
}

async function loadAttendanceData() {
  const [{ data: mem }, { data: att }] = await Promise.all([
    supabaseClient.from('members').select('id, name, stamma').eq('status', 'approved'),
    supabaseClient.from('attendance').select('event_id, member_id, checked_by'),
  ]);
  approvedMembers = (mem || []).sort((a, b) =>
    (stammaRank(a.stamma) - stammaRank(b.stamma)) || svCollator.compare(a.stamma || '', b.stamma || '') || svCollator.compare(a.name || '', b.name || ''));
  attendanceByEvent = new Map();
  (att || []).forEach(a => {
    const k = String(a.event_id);
    if (!attendanceByEvent.has(k)) attendanceByEvent.set(k, new Map());
    attendanceByEvent.get(k).set(a.member_id, { checked_by: a.checked_by });
  });
}

function attCount(evId) { const m = attendanceByEvent.get(String(evId)); return m ? m.size : 0; }

function renderAttPanel(evId, panel) {
  const present = attendanceByEvent.get(String(evId)) || new Map();
  const perStamma = {};
  approvedMembers.forEach(m => {
    const key = m.stamma || 'Ingen stämma';
    perStamma[key] = perStamma[key] || { n: 0, of: 0 };
    perStamma[key].of++;
    if (present.has(m.id)) perStamma[key].n++;
  });
  const parts = Object.entries(perStamma).map(([k, v]) => `${escapeAtt(k)} ${v.n}/${v.of}`).join(' · ');
  let lastGroup = null;
  const rows = approvedMembers.map(m => {
    const group = m.stamma || 'Ingen stämma';
    const head = group !== lastGroup ? `<div class="att-group">${escapeAtt(group)}</div>` : '';
    lastGroup = group;
    const p = present.get(m.id);
    return `${head}<label class="att-member"><input type="checkbox" data-member="${m.id}" ${p ? 'checked' : ''}>${escapeAtt(m.name)}${p && p.checked_by ? '<span class="by-admin">(admin)</span>' : ''}</label>`;
  }).join('');
  panel.innerHTML = `
    <div class="att-summary"><strong>${present.size} av ${approvedMembers.length}</strong> närvarande${parts ? ' — ' + parts : ''}</div>
    <div class="att-grid">${rows || '<span class="text-muted">Inga godkända medlemmar.</span>'}</div>`;

  panel.querySelectorAll('input[data-member]').forEach(cb => cb.addEventListener('change', async () => {
    const memberId = cb.dataset.member;
    cb.disabled = true;
    const { error } = cb.checked
      ? await supabaseClient.from('attendance').insert({ event_id: evId, member_id: memberId, checked_by: adminId })
      : await supabaseClient.from('attendance').delete().eq('event_id', evId).eq('member_id', memberId);
    cb.disabled = false;
    if (error && error.code !== '23505') { alert('Kunde inte spara närvaro: ' + error.message); cb.checked = !cb.checked; return; }
    const k = String(evId);
    if (!attendanceByEvent.has(k)) attendanceByEvent.set(k, new Map());
    if (cb.checked) attendanceByEvent.get(k).set(memberId, { checked_by: adminId });
    else attendanceByEvent.get(k).delete(memberId);
    renderAttPanel(evId, panel);
    const btn = document.querySelector(`.att-btn[data-id="${CSS.escape(String(evId))}"]`);
    if (btn) btn.textContent = `Närvaro (${attCount(evId)}) ${btn.classList.contains('open') ? '▴' : '▾'}`;
  }));
}

function escapeAtt(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

const EMPTY_LABELS = { rep: 'Inga kommande repetitioner.', konsert: 'Inga kommande konserter.', ovrigt: 'Inget kommande inlagt.' };
const openPastGroups = new Set();
let activeTab = 'rep';

function eventHtml(ev) {
  return `
    <div class="event-item ${ev.event_date < todayStr ? 'past' : ''} ${editing && String(editing.id) === String(ev.id) ? 'editing' : ''}">
      <div class="event-date">${formatDate(ev.event_date)}${timeRange(ev)}</div>
      <div style="flex: 1; min-width: 0;">
        <strong class="event-type-${ev.event_type}">${typeLabels[ev.event_type] || 'Övrigt'}</strong> — ${escapeAtt(ev.title)}${ev.series_id ? '<span class="series-badge">↻ serie</span>' : ''}
        ${ev.location ? `<div class="event-meta">${escapeAtt(ev.location)}</div>` : ''}
        ${ev.notes ? `<div class="event-meta event-notes">${escapeAtt(ev.notes)}</div>` : ''}
      </div>
      <div class="event-actions">
        ${ev.event_date <= todayStr ? `<button type="button" class="att-btn" data-id="${ev.id}" aria-expanded="false">Närvaro (${attCount(ev.id)}) ▾</button>` : ''}
        <button type="button" class="edit-btn" data-id="${ev.id}">Redigera</button>
        <button type="button" class="btn-danger deleteEventBtn" data-id="${ev.id}" style="padding: 0.3rem 0.7rem; font-size: 0.85rem;">Ta bort</button>
        ${ev.series_id ? `<button type="button" class="btn-danger deleteEventBtn" data-series="${ev.series_id}" style="padding: 0.3rem 0.7rem; font-size: 0.85rem;">Ta bort serie</button>` : ''}
      </div>
      <div class="att-panel" data-panel-att="${ev.id}" hidden></div>
    </div>`;
}

function showTab(type) {
  activeTab = type;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === type));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === type));
}
document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

async function loadEvents() {
  const [{ data: events, error }] = await Promise.all([
    supabaseClient.from('events').select('*').order('event_date').order('event_time'),
    loadAttendanceData(),
  ]);

  if (error) {
    document.querySelectorAll('.tab-panel').forEach(p => p.innerHTML = `<p class="error">${escapeAtt(error.message)}</p>`);
    return;
  }

  const byType = { rep: [], konsert: [], ovrigt: [] };
  (events || []).forEach(ev => (byType[ev.event_type] || byType.ovrigt).push(ev));

  Object.entries(byType).forEach(([type, list]) => {
    const upcoming = list.filter(ev => ev.event_date >= todayStr);
    const past = list.filter(ev => ev.event_date < todayStr).reverse();   // senaste först
    const panel = document.querySelector(`.tab-panel[data-panel="${type}"]`);
    let html = upcoming.length
      ? upcoming.map(eventHtml).join('')
      : `<p class="text-muted">${EMPTY_LABELS[type]}</p>`;
    if (past.length) {
      const open = openPastGroups.has(type) ? 'open' : '';
      html += `<details class="past-group" data-type="${type}" ${open}><summary>Tidigare (${past.length})</summary>${past.map(eventHtml).join('')}</details>`;
    }
    panel.innerHTML = html;
    document.querySelector(`.tab-btn[data-tab="${type}"] .count`).textContent = upcoming.length ? `(${upcoming.length})` : '';
  });
  document.querySelectorAll('details.past-group').forEach(d => d.addEventListener('toggle', () => {
    d.open ? openPastGroups.add(d.dataset.type) : openPastGroups.delete(d.dataset.type);
  }));

  document.querySelectorAll('.att-btn').forEach(btn => {
    const id = btn.dataset.id;
    const ev = events.find(x => String(x.id) === id);
    const panel = document.querySelector(`.att-panel[data-panel-att="${CSS.escape(id)}"]`);
    const setState = isOpen => {
      panel.hidden = !isOpen;
      btn.classList.toggle('open', isOpen);
      btn.setAttribute('aria-expanded', isOpen);
      btn.textContent = `Närvaro (${attCount(ev.id)}) ${isOpen ? '▴' : '▾'}`;
      if (isOpen) { renderAttPanel(ev.id, panel); openPanels.add(id); } else openPanels.delete(id);
    };
    if (openPanels.has(id)) setState(true);
    btn.addEventListener('click', () => setState(panel.hidden));
  });

  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const ev = events.find(x => String(x.id) === btn.dataset.id);
      if (!ev) return;
      if (!ev.series_id) { startEdit(ev); return; }
      const scope = await askSeriesScope(ev, events.filter(x => x.series_id === ev.series_id).length);
      if (scope) startEdit(ev, scope);
    });
  });

  document.querySelectorAll('.deleteEventBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const { id, series } = e.currentTarget.dataset;
      const msg = series ? 'Ta bort ALLA tillfällen i serien?' : 'Ta bort denna händelse?';
      if (!confirm(msg)) return;
      const query = supabaseClient.from('events').delete();
      const { error } = await (series ? query.eq('series_id', series) : query.eq('id', id));
      if (error) { alert(error.message); return; }
      if (editing && ((id && String(editing.id) === id) || (series && editing.series_id === series))) stopEdit();
      loadEvents();
    });
  });
}

// ---------- Redigera ----------
let editing = null;   // händelsen som redigeras, annars null
const $f = id => document.getElementById(id);
const scopeValue = () => (document.querySelector('input[name="evScope"]:checked') || {}).value || 'one';

// Frågar om ändringen gäller ett tillfälle eller hela serien. Svarar 'one', 'all' eller null (avbryt).
function askSeriesScope(ev, count) {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'choice-backdrop';
    wrap.innerHTML = `
      <div class="choice-box" role="dialog" aria-modal="true" aria-labelledby="choiceTitle">
        <h3 id="choiceTitle">Redigera återkommande händelse</h3>
        <p>"${escapeAtt(ev.title)}" ingår i en serie med ${count} tillfällen. Vad vill du ändra?</p>
        <div class="choice-btns">
          <button type="button" data-v="one">Bara ${formatDate(ev.event_date)}</button>
          <button type="button" data-v="all">Alla tillfällen i serien</button>
          <button type="button" class="btn-outline" data-v="">Avbryt</button>
        </div>
      </div>`;
    const done = v => { wrap.remove(); document.removeEventListener('keydown', onKey); resolve(v || null); };
    const onKey = e => { if (e.key === 'Escape') done(null); };
    wrap.addEventListener('click', e => {
      if (e.target === wrap) return done(null);
      const b = e.target.closest('button[data-v]');
      if (b) done(b.dataset.v);
    });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(wrap);
    wrap.querySelector('button[data-v="one"]').focus();
  });
}

function startEdit(ev, scope) {
  if (!ev) return;
  editing = ev;
  $f('addEventForm').reset();
  $f('evTitle').value = ev.title || '';
  $f('evType').value = ev.event_type || 'rep';
  $f('evDate').value = ev.event_date || '';
  $f('evTime').value = ev.event_time ? ev.event_time.slice(0, 5) : '';
  $f('evEndTime').value = ev.end_time ? ev.end_time.slice(0, 5) : '';
  refreshTimePickers();
  $f('evLocation').value = ev.location || '';
  $f('evNotes').value = ev.notes || '';
  $f('repeatRow').hidden = true;
  $f('evRepeat').value = '';
  $f('evRepeatUntil').required = false;
  $f('scopeWrap').hidden = !ev.series_id;
  document.querySelector(`input[name="evScope"][value="${scope === 'all' && ev.series_id ? 'all' : 'one'}"]`).checked = true;
  updateScopeUi();
  $f('formHeading').textContent = scope === 'all' && ev.series_id ? 'Redigera hela serien' : 'Redigera händelse';
  $f('submitBtn').textContent = 'Spara ändringar';
  $f('cancelEditBtn').hidden = false;
  $f('eventFormCard').classList.add('editing');
  $f('addEventError').textContent = '';
  document.querySelectorAll('.event-item.editing').forEach(x => x.classList.remove('editing'));
  const row = document.querySelector(`.edit-btn[data-id="${CSS.escape(String(ev.id))}"]`);
  if (row) row.closest('.event-item').classList.add('editing');
  $f('eventFormCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  setTimeout(() => $f('evNotes').focus({ preventScroll: true }), 400);
}

function stopEdit() {
  editing = null;
  $f('addEventForm').reset();
  $f('repeatRow').hidden = false;
  $f('evRepeatUntilWrap').hidden = true;
  $f('scopeWrap').hidden = true;
  $f('evDate').disabled = false;
  $f('formHeading').textContent = 'Lägg till händelse';
  $f('submitBtn').textContent = 'Lägg till';
  $f('cancelEditBtn').hidden = true;
  $f('eventFormCard').classList.remove('editing');
  $f('addEventError').textContent = '';
  document.querySelectorAll('.event-item.editing').forEach(x => x.classList.remove('editing'));
}

// Vid "Alla tillfällen" ändras inte datumet (varje tillfälle behåller sitt eget datum)
function updateScopeUi() {
  const all = editing && editing.series_id && scopeValue() === 'all';
  if (editing) $f('formHeading').textContent = all ? 'Redigera hela serien' : 'Redigera händelse';
  $f('evDate').disabled = !!all;
  $f('evDate').title = all ? 'Datumet ändras inte när hela serien redigeras' : '';
}
document.querySelectorAll('input[name="evScope"]').forEach(r => r.addEventListener('change', updateScopeUi));
$f('cancelEditBtn').addEventListener('click', stopEdit);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && editing) stopEdit(); });

async function saveEdit(errorEl) {
  const startTime = $f('evTime').value || null;
  const endTime   = $f('evEndTime').value || null;
  if (endTime && !startTime) { errorEl.textContent = 'Ange en starttid om du anger en sluttid.'; return; }
  if (endTime && endTime <= startTime) { errorEl.textContent = 'Sluttiden måste vara efter starttiden.'; return; }

  const changes = {
    title: $f('evTitle').value,
    event_type: $f('evType').value,
    event_time: startTime,
    end_time: endTime,
    location: $f('evLocation').value || null,
    notes: $f('evNotes').value || null,
  };
  const all = editing.series_id && scopeValue() === 'all';
  let query = supabaseClient.from('events');
  if (all) {
    query = query.update(changes).eq('series_id', editing.series_id);
  } else {
    if (!$f('evDate').value) { errorEl.textContent = 'Välj ett datum.'; return; }
    query = query.update({ ...changes, event_date: $f('evDate').value }).eq('id', editing.id);
  }
  $f('submitBtn').disabled = true;
  const { error } = await query;
  $f('submitBtn').disabled = false;
  if (error) { errorEl.textContent = error.message; return; }
  stopEdit();
  showTab(changes.event_type);
  loadEvents();
}

document.getElementById('addEventForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('addEventError');
  errorEl.textContent = '';
  if (editing) { await saveEdit(errorEl); return; }

  const startDate = document.getElementById('evDate').value;
  const startTime = document.getElementById('evTime').value || null;
  const endTime   = document.getElementById('evEndTime').value || null;
  const repeat    = document.getElementById('evRepeat').value;
  const until     = document.getElementById('evRepeatUntil').value;

  if (endTime && !startTime) { errorEl.textContent = 'Ange en starttid om du anger en sluttid.'; return; }
  if (endTime && endTime <= startTime) { errorEl.textContent = 'Sluttiden måste vara efter starttiden.'; return; }
  if (repeat && !until) { errorEl.textContent = 'Välj hur länge händelsen ska upprepas.'; return; }
  if (repeat && until < startDate) { errorEl.textContent = '"Till och med" måste vara efter startdatumet.'; return; }

  const dates = buildDates(startDate, repeat, until);
  if (repeat && dates.length >= MAX_OCCURRENCES &&
      !confirm(`Serien begränsas till ${MAX_OCCURRENCES} tillfällen (t.o.m. ${dates[dates.length - 1]}). Fortsätta?`)) return;

  const seriesId = dates.length > 1 ? crypto.randomUUID() : null;
  const base = {
    title: document.getElementById('evTitle').value,
    event_type: document.getElementById('evType').value,
    event_time: startTime,
    end_time: endTime,
    location: document.getElementById('evLocation').value || null,
    notes: document.getElementById('evNotes').value || null,
    series_id: seriesId,
  };

  const { error } = await supabaseClient.from('events')
    .insert(dates.map(d => ({ ...base, event_date: d })));

  if (error) { errorEl.textContent = error.message; return; }

  document.getElementById('addEventForm').reset();
  document.getElementById('evRepeatUntilWrap').hidden = true;
  showTab(base.event_type);
  loadEvents();
});

document.getElementById('evRepeat').addEventListener('change', (e) => {
  const wrap = document.getElementById('evRepeatUntilWrap');
  wrap.hidden = !e.target.value;
  document.getElementById('evRepeatUntil').required = !!e.target.value;
});

// ---------- Tidsväljare ----------
// Skriv "19", "1900", "19.00" eller "19:00" → 19:00. −/+ , piltangenter och mushjul = 15 min per steg.
// Radera texten för att ta bort tiden.
const TP_STEP = 15;
const tpToMin = v => { const [h, m] = v.split(':').map(Number); return h * 60 + m; };
const tpFmt = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
function tpParse(str) {
  const d = String(str).replace(/\D/g, '');
  if (!d) return '';
  let h, m;
  if (d.length <= 2) { h = +d; m = 0; }
  else if (d.length === 3) { h = +d[0]; m = +d.slice(1); }
  else { h = +d.slice(0, 2); m = +d.slice(2, 4); }
  if (h > 23 || m > 59) return null;
  return tpFmt(h * 60 + m);
}

function initTimePicker(wrap) {
  const hidden = $f(wrap.dataset.target);
  const isEnd = wrap.dataset.target === 'evEndTime';
  wrap.innerHTML = `
    <button type="button" class="tp-step" data-d="-1" aria-label="15 minuter tidigare">−</button>
    <input type="text" class="tp-text" inputmode="numeric" placeholder="--:--" maxlength="5" autocomplete="off" aria-label="${isEnd ? 'Sluttid' : 'Starttid'}">
    <button type="button" class="tp-step" data-d="1" aria-label="15 minuter senare">+</button>`;
  const text = wrap.querySelector('.tp-text');

  const show = () => { text.value = hidden.value || ''; text.classList.remove('invalid'); };
  const set = v => { hidden.value = v || ''; show(); };
  wrap._refresh = show;

  // Startvärde när fältet är tomt: sluttid = starttid + 2 h, annars 19:00
  const defaultValue = () => {
    const start = $f('evTime').value;
    if (isEnd && start) return tpFmt(tpToMin(start) + 120);
    return isEnd ? '21:00' : '19:00';
  };
  const step = dir => {
    if (!hidden.value) { set(defaultValue()); return; }
    const cur = tpToMin(hidden.value);
    const next = dir > 0 ? Math.floor(cur / TP_STEP) * TP_STEP + TP_STEP : Math.ceil(cur / TP_STEP) * TP_STEP - TP_STEP;
    set(tpFmt(next));
  };

  wrap.querySelectorAll('.tp-step').forEach(b => b.addEventListener('click', () => step(+b.dataset.d)));

  const commit = () => {
    const v = tpParse(text.value);
    if (v === null) { text.classList.add('invalid'); return false; }
    set(v); return true;
  };
  text.addEventListener('blur', commit);
  text.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); commit(); step(1); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); commit(); step(-1); }
  });
  text.addEventListener('input', () => text.classList.remove('invalid'));

  // Mushjul: exakt ett steg per "hack", aldrig flera timmar på en gång
  let acc = 0, lastStep = 0, lastEvent = 0;
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const now = Date.now();
    // Ny gest eller bytt riktning → börja om, så att gammal fart inte följer med
    if (now - lastEvent > 250 || Math.sign(e.deltaY) !== Math.sign(acc)) acc = 0;
    lastEvent = now;
    acc += e.deltaY;
    if (Math.abs(acc) >= 40 && now - lastStep > 120) {
      step(acc < 0 ? 1 : -1);
      acc = 0; lastStep = now;
    }
  }, { passive: false });

  show();
}

function refreshTimePickers() { document.querySelectorAll('.tp').forEach(w => w._refresh && w._refresh()); }
document.querySelectorAll('.tp').forEach(initTimePicker);
// form.reset() tömmer de dolda fälten – uppdatera visningen efteråt
// (dolda fält nollställs inte av reset, så de töms här – innan ev. nya värden sätts i startEdit)
$f('addEventForm').addEventListener('reset', () => {
  $f('evTime').value = ''; $f('evEndTime').value = '';
  setTimeout(refreshTimePickers, 0);
});
// Skriven tid som inte bekräftats med Enter/blur ska ändå räknas när man sparar
$f('addEventForm').addEventListener('submit', () => {
  document.querySelectorAll('.tp .tp-text').forEach(t => { const v = tpParse(t.value); if (v !== null) $f(t.closest('.tp').dataset.target).value = v; });
}, true);

(async () => {
  const member = await requireAuth('admin');
  if (member) { adminId = member.id; loadEvents(); }
})();
</script>
