<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medlem — Heavy Voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
  @media (max-width: 480px) { .nav-grid { grid-template-columns: 1fr; } }
  .nav-card { display: block; text-align: center; padding: 1.5rem 1rem; }
  .nav-card h3 { margin: 0; }
</style>
</head>
<body>

<div class="container">
  <h1>Mitt konto</h1>
  <p id="welcome" class="text-muted">Laddar...</p>

  <div class="nav-grid">
    <a href="/medlem/spelare.html?tab=repertoire" class="card nav-card"><h3>Repertoar</h3></a>
    <a href="/medlem/spelare.html" class="card nav-card"><h3>Spelaren</h3></a>
    <a href="/medlem/kalender.html" class="card nav-card"><h3>Kalender</h3></a>
    <a href="/medlem/infor.html" class="card nav-card"><h3>Information</h3></a>
  </div>

  <a href="/konto.html"><button type="button" style="margin-top: 1.5rem; margin-right: 0.5rem; background: transparent; border: 1px solid var(--border);">Mitt konto</button></a>
  <button id="logoutBtn" style="margin-top: 1.5rem;">Logga ut</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
(async () => {
  const member = await requireAuth();
  if (member) {
    document.getElementById('welcome').textContent = `Välkommen ${member.name}`;
  }
})();

document.getElementById('logoutBtn').addEventListener('click', signOut);
</script>

</body>
</html>
