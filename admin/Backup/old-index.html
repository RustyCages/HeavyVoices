<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Heavy Voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container">
  <h1>Admin</h1>
  <p id="welcome" class="text-muted">Laddar...</p>

  <div class="card">
    <h3>Låtar &amp; texter</h3>
    <p class="text-muted">Lägg till låtar, noter och stämfiler</p>
    <a href="/admin/latar.html"><button type="button">Hantera låtar</button></a>
  </div>

  <div class="card" style="margin-top: 1rem;">
    <h3>Medlemmar</h3>
    <p class="text-muted">Bjud in nya medlemmar och hantera roller</p>
    <a href="/admin/medlemmar.html"><button type="button">Hantera medlemmar</button></a>
  </div>

    <div class="card" style="margin-top: 1rem;">
    <h3>Kalender</h3>
    <p class="text-muted">Lägg till repetitioner och konserter</p>
    <a href="/admin/kalender.html"><button type="button">Hantera kalender</button></a>
  </div>

  <div class="card" style="margin-top: 1rem;">
    <h3>Information</h3>
    <p class="text-muted">Redigera texten medlemmar ser under Information</p>
    <a href="/admin/info.html"><button type="button">Redigera information</button></a>
  </div>
  
  <a href="/konto.html"><button type="button" style="margin-top: 1.5rem; margin-right: 0.5rem; background: transparent; border: 1px solid var(--border);">Mitt konto</button></a>
  
  <button id="logoutBtn" style="margin-top: 1.5rem;">Logga ut</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
(async () => {
  const member = await requireAuth('admin');
  if (member) {
    document.getElementById('welcome').textContent = `Inloggad som ${member.name}`;
  }
})();

document.getElementById('logoutBtn').addEventListener('click', signOut);
</script>

</body>
</html>
