<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Väntar på godkännande — Heavy Voices</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#121418">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/ui-mode.js"></script>
</head>
<body>

<header class="site-header site-header--small"><a href="/" class="site-logo-link" aria-label="Heavy Voices – till startsidan"><picture><source srcset="/icons/logo-text.webp" type="image/webp"><img src="/icons/logo-text.png" alt="Heavy Voices" class="site-logo-text" width="480" height="220"></picture></a></header>
<div class="container">
  <h1 id="waitTitle">Väntar på godkännande</h1>
  <div class="card" style="max-width: 400px; margin-top: 1.5rem;">
    <p id="waitText">Ditt konto är registrerat men väntar fortfarande på att en admin godkänner det. Hör av dig till kören om det dröjer.</p>
    <div id="pausedBox" style="display:none;">
      <p style="margin-top:0; color:var(--text-muted);">Som pausad medlem kan du se kalender och information.</p>
      <p style="display:flex; gap:0.5rem; flex-wrap:wrap; margin:0.8rem 0;">
        <a class="btn-outline" href="/medlem/kalender.html" style="padding:0.5rem 1rem; border-radius:0.5rem; text-decoration:none;">Kalender</a>
        <a class="btn-outline" href="/medlem/info.html" style="padding:0.5rem 1rem; border-radius:0.5rem; text-decoration:none;">Information</a>
      </p>
      <textarea id="reactNote" rows="3" maxlength="500" placeholder="Valfritt: skriv något till körledningen, t.ex. när du kan komma tillbaka"></textarea>
      <button id="reactBtn" type="button" style="margin-top:0.5rem;">Jag vill bli aktiv igen</button>
      <p id="reactMsg" style="min-height:1.2em; margin:0.5rem 0 0; font-weight:600; color:var(--accent);"></p>
      <p style="margin:0.5rem 0 0; font-size:0.85rem; color:var(--text-muted);">Du kan också mejla <a href="mailto:info@heavyvoices.se">info@heavyvoices.se</a>.</p>
    </div>
    <button id="logoutBtn" style="margin-top: 1rem;">Logga ut</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
document.getElementById('logoutBtn').addEventListener('click', signOut);

(async () => {
  const member = await getCurrentMember();
  if (member && member.status === 'approved') {
    window.location.href = member.role === 'admin' ? '/admin/' : '/medlem/';
    return;
  }
  if (member && member.status === 'ended') {
    await supabaseClient.auth.signOut();
    window.location.href = '/logga-in.html';
    return;
  }
  if (member && member.status === 'queue') {
    document.title = 'Du står i kö — Heavy Voices';
    document.getElementById('waitTitle').textContent = 'Du står i kö';
    document.getElementById('waitText').textContent =
      'Du står i kö till kören. När det är din tur gör en admin ditt konto aktivt, och då kommer du åt medlemssidorna.';
  }
  if (member && member.status === 'paused') {
    document.title = 'Medlemskap pausat — Heavy Voices';
    document.getElementById('waitTitle').textContent = 'Medlemskapet är pausat';
    document.getElementById('waitText').textContent =
      'Ditt medlemskap är pausat just nu. Dina inspelningar och inställningar finns kvar. Vill du vara med igen? Skicka en förfrågan här så öppnar en admin kontot.';
    document.getElementById('pausedBox').style.display = '';
    const btn = document.getElementById('reactBtn'), msg = document.getElementById('reactMsg');
    const done = () => { btn.disabled = true; btn.textContent = 'Förfrågan skickad'; };
    if (member.reactivation_requested_at) { done(); msg.textContent = 'Du har redan skickat en förfrågan. Vi hör av oss.'; }
    btn.addEventListener('click', async () => {
      btn.disabled = true; msg.textContent = 'Skickar...';
      const { error } = await supabaseClient.rpc('request_reactivation', { p_note: document.getElementById('reactNote').value.trim() || null });
      if (error) { btn.disabled = false; msg.textContent = 'Kunde inte skicka: ' + error.message; return; }
      done(); msg.textContent = 'Tack! Din förfrågan är skickad till körledningen.';
    });
  }
})();
</script>

</body>
</html>
