<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalender — Heavy Voices Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .event-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 0.8rem 0; border-bottom: 1px solid var(--border); gap: 1rem; }
  .event-item:last-child { border-bottom: none; }
  .event-date { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; min-width: 90px; }
  .event-type-rep { color: #60a5fa; }
  .event-type-konsert { color: var(--accent); }
  .event-type-ovrigt { color: var(--text-muted); }
  .event-meta { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.9rem; width: 100%; margin-bottom: 0.75rem; }
</style>
</head>
<body>

<header class="site-header"><span class="site-logo">Heavy Voices</span></header>
<div class="container">

  <a href="/admin/" class="back-btn">&larr; Tillbaka till admin</a>
  <h1>Kalender</h1>

  <div class="card">
    <h3>Lägg till händelse</h3>
    <form id="addEventForm">
      <input type="text" id="evTitle" placeholder="Titel" required>
      <select id="evType">
        <option value="rep">Repetition</option>
        <option value="konsert">Konsert</option>
        <option value="ovrigt">Övrigt</option>
      </select>
      <input type="date" id="evDate" required>
      <input type="time" id="evTime">
      <input type="text" id="evLocation" placeholder="Plats">
      <textarea id="evNotes" placeholder="Anteckningar" style="width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:0.6rem 0.9rem; font-family:inherit; min-height:70px; margin-bottom:0.75rem;"></textarea>
      <button type="submit">Lägg till</button>
      <p class="error" id="addEventError"></p>
    </form>
  </div>

  <div class="card" style="margin-top: 1.5rem;">
    <h3>Kommande &amp; tidigare</h3>
    <div id="eventsList"><p class="text-muted">Laddar...</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
const typeLabels = { rep: 'Repetition', konsert: 'Konsert', ovrigt: 'Övrigt' };

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('sv-SE', { day: 'numeric', month: 'short', year: 'numeric' });
}

async function loadEvents() {
  const { data: events, error } = await supabaseClient
    .from('events').select('*').order('event_date').order('event_time');

  const el = document.getElementById('eventsList');
  if (error) { el.innerHTML = `<p class="error">${error.message}</p>`; return; }
  if (!events.length) { el.innerHTML = `<p class="text-muted">Inga händelser tillagda än.</p>`; return; }

  el.innerHTML = events.map(ev => `
    <div class="event-item">
      <div class="event-date">${formatDate(ev.event_date)}${ev.event_time ? ' ' + ev.event_time.slice(0,5) : ''}</div>
      <div style="flex: 1;">
        <strong class="event-type-${ev.event_type}">${typeLabels[ev.event_type]}</strong> — ${ev.title}
        ${ev.location ? `<div class="event-meta">${ev.location}</div>` : ''}
        ${ev.notes ? `<div class="event-meta">${ev.notes}</div>` : ''}
      </div>
      <button type="button" class="btn-danger deleteEventBtn" data-id="${ev.id}" style="padding: 0.3rem 0.7rem; font-size: 0.85rem;">Ta bort</button>
    </div>
  `).join('');

  document.querySelectorAll('.deleteEventBtn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      await supabaseClient.from('events').delete().eq('id', e.target.dataset.id);
      loadEvents();
    });
  });
}

document.getElementById('addEventForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('addEventError');
  errorEl.textContent = '';

  const { error } = await supabaseClient.from('events').insert({
    title: document.getElementById('evTitle').value,
    event_type: document.getElementById('evType').value,
    event_date: document.getElementById('evDate').value,
    event_time: document.getElementById('evTime').value || null,
    location: document.getElementById('evLocation').value || null,
    notes: document.getElementById('evNotes').value || null,
  });

  if (error) { errorEl.textContent = error.message; return; }

  document.getElementById('addEventForm').reset();
  loadEvents();
});

(async () => {
  const member = await requireAuth('admin');
  if (member) loadEvents();
})();
</script>

</body>
</html>
