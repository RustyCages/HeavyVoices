<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logga in — Heavy Voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  /* Mobil: allt ska få plats utan att sidan scrollar */
  @media (max-width: 600px) {
    .site-header--logo { padding-top: 0.8rem; }
    .login-page { padding-top: 0.6rem; padding-bottom: 0.6rem; }
    .login-page > p:first-child { margin: 0 0 0.4rem; }
    .login-page h1 { margin: 0 0 0.2rem; font-size: 1.7rem; }
    .login-page .card { margin-top: 0.8rem !important; padding: 1.1rem; }
  }
</style>
</head>
<body>

<header class="site-header site-header--logo"><a href="/" class="site-logo-link" aria-label="Heavy Voices – till startsidan"><picture><source srcset="/icons/logo.webp" type="image/webp"><img src="/icons/logo.png" alt="Heavy Voices" class="site-logo-img" width="640" height="493"></picture></a></header>
<div class="container login-page">
  <p><a href="/" class="text-muted">&larr; Tillbaka</a></p>
  <h1>Logga in</h1>

  <div class="card" style="max-width: 360px; margin-top: 1.5rem;">
    <form id="loginForm">
      <input type="email" id="email" placeholder="E-post" required autocomplete="username" name="email">
      <input type="password" id="password" placeholder="Lösenord" required autocomplete="current-password" name="password">
      <button type="submit">Logga in</button>
      <a href="/aterstall-losenord.html" class="text-muted" style="display: inline-block; margin-left: 0.75rem; font-size: 0.85rem;">Glömt lösenord?</a>
      <p class="error" id="loginError"></p>
    </form>
    <p class="text-muted" style="margin-top: 1rem; font-size: 0.85rem;">Ny i kören? <a href="/registrera.html">Registrera dig här</a>.</p>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; align-items: center;">
    <a href="/guide.html?guide=registrera" class="btn btn-outline" style="text-decoration: none;">Så funkar det</a>
    <div data-install-app="Installera Heavy Voices som app"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/password-toggle.js" defer></script>
<script src="/js/auth.js"></script>
<script src="/js/install-app.js" defer></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';

  try {
    await signIn(email, password);
    // Be webbläsaren spara inloggningen (Chrome/Edge/Android). Safari/iOS fångar formuläret själv.
    try {
      if (window.PasswordCredential) await navigator.credentials.store(new PasswordCredential(e.target));
    } catch (_) { /* inte kritiskt */ }
    const member = await getCurrentMember();
    if (!member || member.status !== 'approved') {
      window.location.href = '/vantar.html';
      return;
    }
    window.location.href = member.role === 'admin' ? '/admin/' : '/medlem/';
  } catch (err) {
    errorEl.textContent = 'Fel e-post eller lösenord.';
  }
});
</script>

</body>
</html>
