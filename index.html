<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heavy Voices</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: Arial, sans-serif;
    }

    /* Videobakgrund som täcker hela skärmen */
    .bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 1;
      transform: translate(-50%, -50%);
      object-fit: cover;
    }

    /* Responsiv växling mellan dator och mobil (valfritt) */
    #video-desktop { display: block; }
    #video-mobile  { display: none; }

    @media (max-width: 768px) {
      #video-desktop { display: none; }
      #video-mobile  { display: block; }
    }

    /* Logga in-knapp uppe till höger */
    .header {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 3;
    }

    .login-btn {
      background-color: rgba(0, 0, 0, 0.6);
      border: 2px solid #ffffff;
      color: #ffffff;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      text-decoration: none;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      background-color: #ffffff;
      color: #000000;
    }

    /* Centrerar logotypen mitt på skärmen */
    .logo-container {
      position: fixed;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .logo {
      max-width: 1000px;
      width: 85%;
      height: auto;
      display: block;
      filter: drop-shadow(0px 4px 15px rgba(0, 0, 0, 0.8)); /* Ger skugga mot videon */
    }
  </style>
</head>
<body>

  <!-- Videobakgrund (Dator) -->
  <video autoplay loop muted playsinline id="video-desktop" class="bg-video">
    <source src="heavyvoices-desktop.mp4" type="video/mp4">
  </video>

  <!-- Videobakgrund (Mobil) -->
  <video autoplay loop muted playsinline id="video-mobile" class="bg-video">
    <source src="heavyvoices-mobile.mp4" type="video/mp4">
  </video>

  <!-- Logga in-knapp -->
  <header class="header">
    <a href="https://heavyvoices.se/logga-in.html" class="login-btn">Logga in</a>
  </header>

  <!-- Centrerad bild mitt på sidan -->
  <div class="logo-container">
    <img src="heavyvoices-logo.png" alt="Heavy Voices" class="logo">
  </div>

</body>
</html>
