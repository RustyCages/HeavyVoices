<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heavy Voices</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: Arial, sans-serif;
    }

    /* Videobakgrund som täcker 100% av skärmen */
    #bg-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: 1;
      transform: translate(-50%, -50%);
      object-fit: cover; /* Ser till att videon täcker hela ytan utan svarta kanter */
    }

    /* Top-bar för Logga in-knappen ovanpå videon */
    .header {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 2;
    }

    .login-btn {
      background-color: rgba(0, 0, 0, 0.6);
      border: 2px solid #ffffff;
      color: #ffffff;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .login-btn:hover {
      background-color: #ffffff;
      color: #000000;
    }
  </style>
</head>
<body>

  <!-- MP4-videobakgrund -->
  <video autoplay loop muted playsinline id="bg-video">
    <source src="heavyvoices.mp4" type="video/mp4">
    Din webbläsare stöder inte videotaggen.
  </video>

  <!-- Logga in-knapp -->
  <header class="header">
    <a href="https://heavyvoices.se/logga-in.html" class="login-btn">Logga in</a>
  </header>

</body>
</html>
