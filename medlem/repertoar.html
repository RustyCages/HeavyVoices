<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertoar – Heavy Voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  body { padding-bottom: 7.5rem; }
  .tabs { display:flex; gap:0.75rem; margin-bottom:1.75rem; }
  .tab-btn { background:rgba(255,255,255,0.06); color:#d1d5db; border:1px solid rgba(255,255,255,0.12); padding:0.6rem 1.2rem; }
  .tab-btn.active { background:var(--accent); color:#111317; }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  details.list-card, details.song-card { margin-bottom:1.25rem; padding:1.5rem; }
  details.list-card summary, details.song-card summary { list-style:none; cursor:pointer; }
  details.list-card summary::-webkit-details-marker, details.song-card summary::-webkit-details-marker { display:none; }
  details.list-card[open] summary, details.song-card[open] summary { margin-bottom:0.5rem; }
  .row-between { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }

  .track-row { display:flex; align-items:center; gap:0.85rem; padding:0.6rem 0.5rem; border-bottom:1px solid var(--border); border-radius:0.5rem; transition:background 0.15s ease; }
  .track-row:last-child { border-bottom:none; }
  .track-row:hover { background:rgba(255,255,255,0.03); }
  .track-row.playing { background:rgba(229,169,104,0.07); }
  .track-title { flex:1; font-size:1.02rem; }
  .track-title.loading { color:var(--text-muted); }
  .track-loading-note { font-size:0.75rem; color:var(--accent); }

  .track-play-btn {
    flex-shrink:0; width:2.2rem; height:2.2rem; min-width:2.2rem;
    border-radius:50%; padding:0; font-size:0.9rem; line-height:1;
    background:transparent; border:1px solid var(--border); color:var(--text);
    transition:background 0.15s ease;
  }
  .track-play-btn.playing-icon { background:var(--accent); color:#111317; border-color:var(--accent); }
  .track-play-btn.loading-icon { cursor:wait; }

  /* Round icon-only buttons (trash cans etc.) — same footprint as track-play-btn so
     rows stay compact and every tap target is still a comfortable ~2.2rem circle. */
  .icon-btn {
    flex-shrink:0; width:2.2rem; height:2.2rem; min-width:2.2rem;
    border-radius:50%; padding:0; font-size:1rem; line-height:1;
  }

  .mixer { margin:0.5rem 0 1.25rem; padding:1.1rem; background:rgba(255,255,255,0.03); border-radius:0.6rem; }
  .mixer-row { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.85rem; }
  .mixer-row:last-child { margin-bottom:0; }
  .mixer-row .label { min-width:70px; flex-shrink:0; font-weight:600; font-size:0.85rem; }
  .mixer-row .fname { color:var(--text-muted); font-size:0.75rem; min-width:0; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mixer-row .muteBtn { padding:0.3rem; width:2rem; height:2rem; justify-content:center; flex-shrink:0; }
  .mixer-row .muteBtn svg { width:16px; height:16px; display:block; }
  .mixer-row .muteBtn.muted { background:#ef4444; color:#fff; }
  .mixerToggleBtn.open { background:var(--accent); color:#111317; }

    /* Volume slider — the bare browser-default range input is only a few px tall and
     nearly impossible to grab on a touchscreen. Give it a visible track plus a large
     (24px) thumb, and a tall invisible hit area around it so a slightly-off tap still
     lands on the thumb. */
  .mixer-row input[type=range] {
    flex:1; width:100%; box-sizing:border-box; margin-bottom:0; min-width:0;
    -webkit-appearance:none; appearance:none;
    height:2.4rem; background:transparent; cursor:pointer;
  }
  .mixer-row input[type=range]::-webkit-slider-runnable-track {
    height:6px; border-radius:3px; background:rgba(255,255,255,0.18);
  }
  .mixer-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:24px; height:24px; border-radius:50%;
    background:var(--accent); border:2px solid #111317;
    margin-top:-9px; cursor:pointer;
  }
  .mixer-row input[type=range]::-moz-range-track {
    height:6px; border-radius:3px; background:rgba(255,255,255,0.18);
  }
  .mixer-row input[type=range]::-moz-range-thumb {
    width:24px; height:24px; border-radius:50%;
    background:var(--accent); border:2px solid #111317; cursor:pointer;
  }

  @media (max-width: 600px) {
    .track-row { flex-wrap:wrap; row-gap:0.4rem; }
    .track-title { flex:1 1 100%; order:1; }
    .track-play-btn { order:0; }
    .mixerToggleBtn { order:2; white-space:nowrap; font-size:0.7rem; padding:0.35rem 0.6rem; }
    .removeTrackBtn { order:3; }

    .mixer { padding:0.85rem; }
    .mixer-row { flex-wrap:nowrap; gap:0.4rem; }
    .mixer-row .label { flex:0 0 46px; width:46px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:0.7rem; order:1; }
    .mixer-row input[type=range] { order:2; flex:1 1 auto; width:auto; min-width:0; }
    .mixer-row .muteBtn { order:3; flex:0 0 auto; padding:0.25rem; width:1.85rem; height:1.85rem; }
  }

  .stem-check-row { margin-bottom:0.6rem; display:flex; align-items:center; gap:0.6rem; }
  .stem-check-row label { display:flex; align-items:center; gap:0.6rem; cursor:pointer; margin:0; width:auto; }
  .stem-check-row input[type=checkbox] { width:auto; flex-shrink:0; margin:0; }
  .doc-links { display:flex; flex-wrap:wrap; gap:0.6rem; margin:0.75rem 0; }
  .doc-links a { font-size:0.8rem; padding:0.4rem 0.8rem; border:1px solid var(--border); border-radius:0.4rem; }
  .doc-chip { display:inline-flex; align-items:stretch; border:1px solid var(--border); border-radius:0.4rem; overflow:hidden; }
  .doc-chip a, .doc-chip button { font-size:0.8rem; padding:0.4rem 0.75rem; display:flex; align-items:center; background:none; border:none; border-radius:0; color:var(--accent); cursor:pointer; font-weight:500; }
  .doc-links .doc-chip a { border:none; border-radius:0; }
  .doc-chip button { border-left:1px solid var(--border); padding:0.4rem 0.55rem; color:var(--text-muted); }
  .doc-chip button:hover, .doc-chip a:hover { background:rgba(255,255,255,0.05); color:var(--accent); }
  .doc-chip svg { width:14px; height:14px; }

  .quick-create { display:flex; gap:0.6rem; margin-bottom:1.75rem; flex-wrap:wrap; }
  .quick-create input { width:auto; flex:1; margin-bottom:0; min-width:180px; }

  h4 { margin:1rem 0 0.6rem; }

  .danger { background:#ef4444; color:#fff; }
  .danger:hover { background:#dc2626; }

  /* Floating player bar */
  #playerBar {
    position:fixed; bottom:0; left:0; right:0;
    background: var(--bg-elevated);
    border-top:1px solid var(--border);
    padding:0.75rem 1.25rem;
    display:flex; flex-direction:column; gap:0.4rem;
    z-index:100;
    backdrop-filter: blur(10px);
  }
  #playerBar.hidden { display:none; }
  #playerTitle { font-weight:700; text-align:center; font-family:'Roboto Condensed', sans-serif; overflow:hidden; white-space:nowrap; }
  #playerTitle .marquee-inner { display:inline-block; }
  #playerTitle.marquee { text-align:left; }
  #playerTitle.marquee .marquee-inner { animation: marquee-pingpong var(--marquee-time, 6s) ease-in-out infinite alternate; }
  @keyframes marquee-pingpong {
    0%, 15% { transform: translateX(0); }
    85%, 100% { transform: translateX(calc(-1 * var(--marquee-dist, 0px))); }
  }
  @media (prefers-reduced-motion: reduce) {
    #playerTitle.marquee .marquee-inner { animation: none; }
    #playerTitle { text-overflow: ellipsis; }
  }
  #playerTitle .loading-tag { color:var(--accent); font-weight:500; font-size:0.8rem; margin-left:0.5rem; }
  #playerControls { display:flex; align-items:center; justify-content:center; gap:1rem; }
  #playerControls button { font-size:1.1rem; width:2.6rem; height:2.6rem; padding:0; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  #playerControls button:disabled { opacity:0.4; cursor:wait; }
  #playerScrubberRow { display:flex; align-items:center; gap:0.6rem; }
  #playerScrubberRow input[type=range] { flex:1; margin-bottom:0; }
  #playerScrubberRow span { font-size:0.75rem; color:var(--text-muted); min-width:38px; text-align:center; }
  #repeatBtn.active, #karaokeBtn.active { color:var(--accent); box-shadow:0 0 8px rgba(229,169,104,0.4); }
  #karaokeBtn, #lyricsDocBtn { font-size:0.95rem; }
  #lyricsDocBtn.hidden { display:none; }
  #karaokeBtn { position:relative; }
  #karaokeBtn .voice-badge { position:absolute; bottom:-0.35rem; right:-0.45rem; font-size:0.6rem; font-weight:700; background:var(--accent); color:#111317; border-radius:0.6rem; padding:0.05rem 0.3rem; line-height:1.2; pointer-events:none; }
  #karaokeBtn .voice-badge:empty { display:none; }

  /* Popup-meny i spelaren (textversion / dokument) */
  #playerMenu { position:fixed; bottom:6rem; left:50%; transform:translateX(-50%); width:min(92vw, 340px); max-height:60vh; overflow-y:auto; background:var(--bg); border:1px solid var(--border); border-radius:0.7rem; box-shadow:var(--card-shadow); padding:0.4rem; z-index:120; }
  #playerMenu[hidden] { display:none; }
  #playerMenu .pm-title { font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); padding:0.45rem 0.6rem 0.25rem; }
  #playerMenu .pm-item { display:flex; align-items:center; gap:0.5rem; width:100%; padding:0.55rem 0.6rem; border-radius:0.4rem; background:none; border:none; color:var(--text); font-weight:400; font-size:0.9rem; text-align:left; cursor:pointer; }
  #playerMenu .pm-item:hover { background:rgba(255,255,255,0.05); color:var(--text); }
  #playerMenu .pm-item .pm-check { width:1rem; color:var(--accent); flex-shrink:0; }
  #playerMenu .pm-row { display:flex; align-items:center; gap:0.25rem; }
  #playerMenu .pm-row .pm-item { flex:1; min-width:0; }
  #playerMenu .pm-row .pm-item span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #playerMenu .pm-dl { flex-shrink:0; width:2.2rem; height:2.2rem; padding:0; justify-content:center; border-radius:0.4rem; background:none; border:1px solid var(--border); color:var(--text-muted); }
  #playerMenu .pm-dl:hover { color:var(--accent); border-color:var(--accent); }
  #playerMenu .pm-dl svg { width:15px; height:15px; }
  #playerMenu hr { border:none; border-top:1px solid var(--border); margin:0.3rem 0; }
  @media (max-width: 420px) { #playerControls { gap:0.45rem; } }

  /* Karaoke (synkad text) ovanför spelarkontrollerna */
  /* Rullande textremsa: alla rader ligger i .k-reel som flyttas med transform så att aktuell rad hamnar i mitten */
  #karaoke {
    position:relative; height:6.4rem; overflow:hidden; text-align:center;
    border-bottom:1px solid var(--border); margin-bottom:0.2rem;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 28%, #000 72%, transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0, #000 28%, #000 72%, transparent 100%);
  }
  #karaoke.hidden { display:none; }
  .k-reel { position:absolute; left:0; right:0; top:0; transition:transform 0.55s cubic-bezier(0.22, 1, 0.36, 1); will-change:transform; }
  .k-line {
    padding:0.18rem 0.75rem; line-height:1.3;
    font-family:'Roboto Condensed', sans-serif; font-weight:700; font-size:1.3rem;
    color:var(--text); opacity:0.35; transform:scale(0.78); transform-origin:center;
    transition:transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease, color 0.45s ease, text-shadow 0.45s ease;
  }
  .k-line.k-pause { font-size:1rem; opacity:0.25; }
  .k-line.k-intro { min-height:1.3em; }
  .k-line.k-active { color:var(--accent); opacity:1; transform:scale(1); text-shadow:0 0 18px rgba(229,169,104,0.35); }
  .k-line.k-past { opacity:0.2; }
  #karaoke.no-anim .k-reel, #karaoke.no-anim .k-line { transition:none; }

  /* Förstora texten: knapp uppe till höger i spelarlisten */
  #expandBtn {
    position:absolute; top:0.4rem; right:0.6rem; z-index:2;
    width:2.1rem; height:2.1rem; padding:0; border-radius:0.5rem; font-size:1rem;
    background:rgba(255,255,255,0.06); color:var(--text); border:1px solid var(--border);
  }
  #expandBtn:hover { border-color:var(--accent); color:var(--accent); box-shadow:none; transform:none; }
  #expandBtn.hidden { display:none; }

  /* Helskärmsläge: spelarlisten täcker hela skärmen, texten tar all plats ovanför kontrollerna */
  #playerBar.expanded {
    top:0; padding-top:calc(1rem + env(safe-area-inset-top, 0px)); padding-bottom:calc(1rem + env(safe-area-inset-bottom, 0px));
    background:var(--bg); background-image:var(--bg-gradient); backdrop-filter:none;
  }
  #playerBar.expanded #expandBtn { top:calc(0.75rem + env(safe-area-inset-top, 0px)); right:0.9rem; width:2.6rem; height:2.6rem; font-size:1.2rem; }
  #playerBar.expanded #karaoke {
    flex:1; height:auto; border-bottom:none; margin-bottom:0.5rem;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 18%, #000 82%, transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0, #000 18%, #000 82%, transparent 100%);
  }
  #playerBar.expanded .k-line { font-size:clamp(1.7rem, 5vw, 3.2rem); padding:0.45rem 1.5rem; max-width:1100px; margin:0 auto; }
  #playerBar.expanded .k-line.k-pause { font-size:clamp(1.3rem, 3.5vw, 2.2rem); }
  #playerBar.expanded #playerTitle { font-size:1.1rem; }
  body.player-expanded { overflow:hidden; }
  @media (prefers-reduced-motion: reduce) { .k-reel, .k-line { transition:none; } }

  #toast { position:fixed; bottom:8rem; right:1.5rem; background:var(--accent); color:#111317; padding:0.7rem 1.2rem; border-radius:0.6rem; font-weight:600; box-shadow:var(--card-shadow); z-index:999; display:none; }
</style>
</head>
<body>

<header class="site-header"><span class="site-logo">Heavy Voices</span></header>
<div class="container">
      
  <a href="/medlem/" class="back-btn">&larr; Tillbaka</a>
  <h1>Repertoar</h1>

  <div class="tabs">
    <button class="tab-btn active" id="tabRepertoarBtn">Repertoar</button>
    <button class="tab-btn" id="tabSpellistorBtn">Spellistor</button>
  </div>

  <div class="tab-panel active" id="tabRepertoar">
    <div class="quick-create">
      <input type="text" id="newPlaylistName" placeholder="Namn på ny spellista">
      <button class="btn-gold" id="createPlaylistBtn">Skapa ny spellista</button>
    </div>
    <div id="repertoarList">Laddar...</div>
  </div>

  <div class="tab-panel" id="tabSpellistor">
    <div id="playlistList">Laddar...</div>
  </div>
</div>

<div id="playerBar" class="hidden">
  <button type="button" id="expandBtn" class="hidden" title="Förstora texten">&#x26F6;</button>
  <div id="karaoke" class="hidden"><div class="k-reel"></div></div>
  <div id="playerTitle">–</div>
  <div id="playerScrubberRow">
    <span id="curTime">0:00</span>
    <input type="range" id="scrubber" min="0" max="100" value="0" step="0.1">
    <span id="durTime">0:00</span>
  </div>
  <div id="playerMenu" hidden role="menu"></div>
  <div id="playerControls">
    <button class="btn-outline" id="repeatBtn" title="Upprepa"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg></button>
    <button class="btn-outline" id="prevBtn" title="Föregående">⏮</button>
    <button class="btn-gold" id="playPauseBtn" title="Spela/Pausa">▶</button>
    <button class="btn-outline" id="nextBtn" title="Nästa">⏭</button>
    <button class="btn-outline" id="karaokeBtn" title="Visa/dölj synkad text">🎤<span class="voice-badge"></span></button>
    <button class="btn-outline hidden" id="lyricsDocBtn" title="Öppna sångtexten (dokument)">📄</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
const NOTER_BUCKET = 'heavy-voices-noter';
const STEMS_BUCKET = 'heavy-voices-stems';

const FIXED_STEMS = [
  { key: 'backtrack', pathCol: 'stem_backtrack_path', volColumn: 'vol_backtrack', label: 'Backtrack' },
  { key: 'sopran',    pathCol: 'stem_sopran_path',    volColumn: 'vol_sopran',    label: 'Sopran' },
  { key: 'alt',       pathCol: 'stem_alt_path',       volColumn: 'vol_alt',       label: 'Alt' },
  { key: 'tenor',     pathCol: 'stem_tenor_path',     volColumn: 'vol_tenor',     label: 'Tenor' },
  { key: 'bas',       pathCol: 'stem_bas_path',       volColumn: 'vol_bas',       label: 'Bas' }
];

const STAMTEXT_FIELDS = [
  { key: 'sopran', col: 'lyrics_sopran_path', label: 'Sopran text' },
  { key: 'alt',    col: 'lyrics_alt_path',    label: 'Alt text' },
  { key: 'tenor',  col: 'lyrics_tenor_path',  label: 'Tenor text' },
  { key: 'bas',    col: 'lyrics_bas_path',    label: 'Bas text' }
];

const DOC_FIELDS = [
  { col: 'sheet_music_path', label: 'Noter (PDF)' },
  { col: 'lyrics_pdf_path',  label: 'Sångtext (PDF)' }
];

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2500);
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function stemFilename(path) {
  if (!path) return '';
  const base = path.split('/').pop();
  const parts = base.split('__');
  if (parts.length < 2) return decodeURIComponent(base);
  return decodeURIComponent(parts.slice(1).join('__'));
}

function fmtTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + String(s).padStart(2, '0');
}

// Merge fixed + extra stems present on a song into one generic list
function getStemDefs(song) {
  const defs = [];
  const offsets = song.stem_offsets || {};
  const offsetSec = (k) => (Number(offsets[k]) || 0) / 1000;
  FIXED_STEMS.forEach(f => {
    if (song[f.pathCol]) {
      defs.push({ key: f.key, type: 'fixed', label: f.label, path: song[f.pathCol], volColumn: f.volColumn, offsetSec: offsetSec(f.pathCol) });
    }
  });
  (song.extra_stems || []).forEach(ex => {
    defs.push({ key: ex.id, type: 'extra', label: ex.label, path: ex.path, volColumn: null, offsetSec: offsetSec(ex.id) });
  });
  return defs;
}

// Låtens totala längd med hänsyn till stämsynk-förskjutningar (sätts i admin → Stämsynk)
function timelineDuration(item) {
  return Math.max(0, ...item.stemDefs.map(def => {
    const b = currentBuffers[def.key];
    return b ? b.duration + (def.offsetSec || 0) : 0;
  }));
}

let currentMember = null;

// =========================================================
// Tabs
// =========================================================
document.getElementById('tabSpellistorBtn').addEventListener('click', () => switchTab('spellistor'));
document.getElementById('tabRepertoarBtn').addEventListener('click', () => switchTab('repertoar'));

function switchTab(name) {
  document.getElementById('tabSpellistorBtn').classList.toggle('active', name === 'spellistor');
  document.getElementById('tabRepertoarBtn').classList.toggle('active', name === 'repertoar');
  document.getElementById('tabSpellistor').classList.toggle('active', name === 'spellistor');
  document.getElementById('tabRepertoar').classList.toggle('active', name === 'repertoar');
}

// =========================================================
// Init
// =========================================================
async function init() {
  const member = await requireAuth();
  if (!member) return;
  currentMember = member;
  // Stämma används som standardval för karaoke per stämma
  try {
    const { data: me } = await supabaseClient.from('members').select('stamma').eq('id', member.id).single();
    if (me) currentMember.stamma = me.stamma;
  } catch (e) {}

  await loadPlaylists();
  await loadRepertoar();
}
init();

// =========================================================
// Spellistor
// =========================================================
let playlistsCache = [];

async function loadPlaylists() {
  const { data, error } = await supabaseClient
    .from('playlists')
    .select('*')
    .eq('member_id', currentMember.id)
    .order('name', { ascending: true });
  if (error) {
    document.getElementById('playlistList').textContent = 'Kunde inte ladda spellistor: ' + error.message;
    return;
  }
  playlistsCache = data || [];
  renderPlaylistList();
}

function renderPlaylistList() {
  const container = document.getElementById('playlistList');
  if (!playlistsCache.length) {
    container.innerHTML = '<p class="text-muted">Inga spellistor ännu.</p>';
    return;
  }
  container.innerHTML = '';
  playlistsCache.forEach(pl => {
    const details = document.createElement('details');
    details.className = 'list-card card modern-card';
    details.dataset.playlistId = pl.id;

    const summary = document.createElement('summary');
    summary.innerHTML = `<div class="row-between"><h3 style="margin:0;">${escapeHtml(pl.name)}</h3><span class="text-muted">Visa ▾</span></div>`;
    details.appendChild(summary);

    const body = document.createElement('div');
    body.style.marginTop = '1rem';
    body.innerHTML = `
      <div class="row-between" style="margin-bottom:0.75rem;">
        <button class="btn-gold playListBtn">▶ Spela listan</button>
                 <button class="danger deleteListBtn icon-btn" title="Radera spellista"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg></button>
      </div>
      <div class="tracksContainer text-muted">Laddar låtar...</div>
    `;
    details.appendChild(body);
    container.appendChild(details);

    const playListBtn = body.querySelector('.playListBtn');
    playlistPlayBtns[pl.id] = playListBtn;

    let loaded = false;
    details.addEventListener('toggle', () => {
      if (details.open && !loaded) {
        loaded = true;
        loadPlaylistTracks(pl, body.querySelector('.tracksContainer'));
      }
    });

    playListBtn.addEventListener('click', async () => {
      if (isLoadingTrack) { toast('Väntar på att föregående låt ska laddas klart...'); return; }

      // Always (re)starts the playlist from track 1. Pausing/resuming a track in
      // progress is handled by each track's own play button + the floating player.
      if (!details.open) details.open = true;
      const tc = body.querySelector('.tracksContainer');
      if (!loaded) { loaded = true; await loadPlaylistTracks(pl, tc); }
      const items = playlistTracksCache[pl.id];
      if (items && items.length) startPlaylist(pl, items, 0);
    });

    body.querySelector('.deleteListBtn').addEventListener('click', async () => {
      if (!confirm(`Radera spellistan "${pl.name}"?`)) return;
      await supabaseClient.from('playlist_songs').delete().eq('playlist_id', pl.id);
      const { error } = await supabaseClient.from('playlists').delete().eq('id', pl.id);
      if (error) { toast('Fel: ' + error.message); return; }
      playlistsCache = playlistsCache.filter(x => x.id !== pl.id);
      delete playlistPlayBtns[pl.id];
      renderPlaylistList();
      refreshPlaylistSelects();
      toast('Spellista raderad');
    });
  });
}

// Keep every "lägg till i spellista"-dropdown in Repertoar in sync with playlistsCache
// (a playlist created or deleted elsewhere no longer leaves stale options behind)
function refreshPlaylistSelects() {
  const optionsHtml = playlistsCache.map(pl => `<option value="${pl.id}">${escapeHtml(pl.name)}</option>`).join('')
    || '<option value="">Ingen spellista ännu</option>';
  document.querySelectorAll('.targetPlaylistSelect').forEach(sel => {
    const prevValue = sel.value;
    sel.innerHTML = optionsHtml;
    if (playlistsCache.some(pl => pl.id === prevValue)) sel.value = prevValue;
  });
}

document.getElementById('createPlaylistBtn').addEventListener('click', async () => {

// playlistTracksCache[playlistId] = [{ rowId, song, stemDefs, volumes, extraVolumesRaw, muted:Set }]
const playlistTracksCache = {};
// playlistPlayBtns[playlistId] = the "Spela listan" button element for that playlist card
const playlistPlayBtns = {};

async function loadPlaylistTracks(pl, containerEl) {
  const { data: rows, error } = await supabaseClient
    .from('playlist_songs')
    .select('*')
    .eq('playlist_id', pl.id)
    .order('id', { ascending: true });

  if (error) { containerEl.textContent = 'Fel: ' + error.message; return; }
  if (!rows.length) { containerEl.innerHTML = '<p class="text-muted">Inga låtar i denna spellista ännu. Lägg till från Repertoar.</p>'; return; }

  const songIds = rows.map(r => r.song_id);
  const { data: songs, error: songsErr } = await supabaseClient.from('songs').select('*').in('id', songIds);
  if (songsErr) { containerEl.textContent = 'Fel: ' + songsErr.message; return; }
  const songsById = {};
  songs.forEach(s => { songsById[s.id] = s; });

  const items = rows.map(row => {
    const song = songsById[row.song_id];
    const extraVolumesRaw = row.extra_volumes || {};
    // Only include a stem if it was actually picked when the song was added to this
    // playlist (its volume column/entry is set) — NOT every stem the song happens to
    // have. Previously this used getStemDefs(song) unfiltered, so unchecking a stem
    // in Repertoar had no effect: every available stem was included anyway.
    const stemDefs = getStemDefs(song).filter(def => {
      if (def.type === 'fixed') return row[def.volColumn] !== null && row[def.volColumn] !== undefined;
      return extraVolumesRaw[def.key] !== undefined && extraVolumesRaw[def.key] !== null;
    });
    const volumes = {};
    stemDefs.forEach(def => {
      if (def.type === 'fixed') {
        const v = row[def.volColumn];
        volumes[def.key] = (v === null || v === undefined) ? 100 : v;
      } else {
        const v = extraVolumesRaw[def.key];
        volumes[def.key] = (v === undefined || v === null) ? 100 : v;
      }
    });
    return {
      rowId: row.id,
      playlistId: pl.id,
      song,
      stemDefs,
      volumes,
      extraVolumesRaw,
      muted: new Set()
    };
  });

  playlistTracksCache[pl.id] = items;
  renderTracksForPlaylist(pl, items, containerEl);
}

function renderTracksForPlaylist(pl, items, containerEl) {
  containerEl.innerHTML = '';
  items.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'track-row';
    row.dataset.rowId = item.rowId;
    row.innerHTML = `
      <button class="track-play-btn" data-playlist-id="${pl.id}" data-row-id="${item.rowId}" title="Spela">▶</button>
      <span class="track-title">${escapeHtml(item.song.title)}</span>
      <button class="btn-outline mixerToggleBtn" style="font-size:0.75rem;">Mixer ▾</button>
                 <button class="btn-outline removeTrackBtn icon-btn" title="Ta bort från spellistan"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg></button>
    `;

    const handleTrackActivate = () => {
      if (isLoadingTrack) { toast('Väntar på att föregående låt ska laddas klart...'); return; }
      const activeItem = (currentPlaylist && activePlaylistId === pl.id) ? currentPlaylist.items[currentIndex] : null;
      const isThisTrackActive = activeItem && activeItem.rowId === item.rowId;
      if (isThisTrackActive) {
        if (isPlaying) pauseAll(); else resumeAll();
      } else {
        startPlaylist(pl, items, idx);
      }
    };

    row.querySelector('.track-play-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      handleTrackActivate();
    });

    const mixer = document.createElement('div');
    mixer.className = 'mixer';
    mixer.style.display = 'none';
    item.stemDefs.forEach(def => {
      const mrow = document.createElement('div');
      mrow.className = 'mixer-row';
      mrow.innerHTML = `
        <span class="label">${escapeHtml(def.label)}</span>
        <input type="range" min="0" max="100" value="${item.volumes[def.key]}" class="volSlider" data-key="${def.key}">
        <button class="btn-outline muteBtn" data-key="${def.key}" title="Tysta ${escapeHtml(def.label)}" aria-label="Tysta ${escapeHtml(def.label)}" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m23 9-6 6M17 9l6 6"/></svg></button>
      `;
      mrow.querySelector('.volSlider').addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        item.volumes[def.key] = val;
        applyGainForKey(item, def.key, val);
        scheduleVolumeSave(item);
      });
      mrow.querySelector('.muteBtn').addEventListener('click', (e) => {
        const k = def.key;
        const btn = e.currentTarget;
        if (item.muted.has(k)) item.muted.delete(k); else item.muted.add(k);
        const isMuted = item.muted.has(k);
        btn.classList.toggle('muted', isMuted);
        btn.setAttribute('aria-pressed', isMuted);
        applyGainForKey(item, k, item.volumes[k]);
      });
      mixer.appendChild(mrow);
    });

    const mixerToggleBtn = row.querySelector('.mixerToggleBtn');
    mixerToggleBtn.addEventListener('click', () => {
      const willOpen = mixer.style.display === 'none';
      mixer.style.display = willOpen ? 'block' : 'none';
      mixerToggleBtn.textContent = willOpen ? 'Mixer ▴ (stäng)' : 'Mixer ▾';
      mixerToggleBtn.classList.toggle('open', willOpen);
    });

    row.querySelector('.removeTrackBtn').addEventListener('click', async () => {
      if (!confirm(`Ta bort "${item.song.title}" från spellistan?`)) return;
      const { error } = await supabaseClient.from('playlist_songs').delete().eq('id', item.rowId);
      if (error) { toast('Fel: ' + error.message); return; }
      const newItems = items.filter(x => x.rowId !== item.rowId);
      playlistTracksCache[pl.id] = newItems;
      renderTracksForPlaylist(pl, newItems, containerEl);
      toast('Borttagen');
    });

    containerEl.appendChild(row);
    containerEl.appendChild(mixer);
  });
  updateTrackPlayIcons();
}

let volumeSaveTimers = {};
function scheduleVolumeSave(item) {
  clearTimeout(volumeSaveTimers[item.rowId]);
  volumeSaveTimers[item.rowId] = setTimeout(() => saveVolumes(item), 600);
}

async function saveVolumes(item) {
  const update = {};
  const extraVolumes = {};
  item.stemDefs.forEach(def => {
    if (def.type === 'fixed') {
      update[def.volColumn] = item.volumes[def.key];
    } else {
      extraVolumes[def.key] = item.volumes[def.key];
    }
  });
  update.extra_volumes = extraVolumes;
  await supabaseClient.from('playlist_songs').update(update).eq('id', item.rowId);
}

// Alla textdokument för en låt: noter, gemensam sångtext, stämtexter och extra texter
function songDocs(s) {
  const docs = [];
  DOC_FIELDS.forEach(f => { if (s[f.col]) docs.push({ label: f.label, path: s[f.col], kind: f.col === 'sheet_music_path' ? 'noter' : 'text' }); });
  STAMTEXT_FIELDS.forEach(f => { if (s[f.col]) docs.push({ label: f.label, path: s[f.col], kind: 'stamtext', voice: f.key }); });
  (s.extra_lyrics || []).forEach(ex => { if (ex.path) docs.push({ label: ex.label, path: ex.path, kind: 'stamtext' }); });
  return docs;
}

const DL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

// Öppnar i ny flik (docx via Office-visaren). Fönstret öppnas direkt i klicket så att popup-blockerare inte stoppar det.
async function openDoc(path) {
  const win = window.open('', '_blank');
  const { data, error } = await supabaseClient.storage.from(NOTER_BUCKET).createSignedUrl(path, 3600);
  if (error || !data) { if (win) win.close(); toast('Kunde inte öppna dokumentet'); return; }
  const url = path.toLowerCase().endsWith('.docx')
    ? `https://view.officeapps.live.com/op/view.aspx?src=${encodeURIComponent(data.signedUrl)}`
    : data.signedUrl;
  if (win) win.location.href = url; else window.location.href = url;
}

// Laddar ner med ursprungligt filnamn (Supabase sätter Content-Disposition: attachment)
async function downloadDoc(path) {
  const { data, error } = await supabaseClient.storage.from(NOTER_BUCKET).createSignedUrl(path, 3600, { download: stemFilename(path) || true });
  if (error || !data) { toast('Kunde inte ladda ner: ' + (error ? error.message : '')); return; }
  const a = document.createElement('a');
  a.href = data.signedUrl;
  a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

async function loadDocsForSong(s, container) {
  container.innerHTML = '';
  songDocs(s).forEach(doc => {
    const chip = document.createElement('span');
    chip.className = 'doc-chip';
    chip.innerHTML = `<a href="#">${escapeHtml(doc.label)}</a><button type="button" title="Ladda ner ${escapeHtml(doc.label)}" aria-label="Ladda ner ${escapeHtml(doc.label)}">${DL_SVG}</button>`;
    chip.querySelector('a').addEventListener('click', (e) => { e.preventDefault(); openDoc(doc.path); });
    chip.querySelector('button').addEventListener('click', () => downloadDoc(doc.path));
    container.appendChild(chip);
  });
}

async function addToPlaylist(song, stemDefs, checkedKeys, playlistId) {
  const insertRow = { playlist_id: playlistId, song_id: song.id };
  const extraVolumes = {};
  // Walk EVERY stem the song has (not just the checked ones) so unchecked fixed
  // columns are explicitly written as null. The vol_* columns have a DB default of
  // 100 from the original fixed-5-stem design, so simply omitting a column from the
  // insert let that default sneak the stem back in — which was the bug: unchecking
  // a stem in Repertoar appeared to do nothing.
  stemDefs.forEach(def => {
    const isChecked = checkedKeys.includes(def.key);
    if (def.type === 'fixed') {
      insertRow[def.volColumn] = isChecked ? 100 : null;
    } else if (isChecked) {
      extraVolumes[def.key] = 100;
    }
  });
  insertRow.extra_volumes = extraVolumes;

  const { error } = await supabaseClient.from('playlist_songs').insert(insertRow);
  if (error) { toast('Fel: ' + error.message); return; }
  toast('Tillagd i spellistan');
  // invalidate cache for that playlist so it reloads next time it's opened
  delete playlistTracksCache[playlistId];
  const details = document.querySelector(`details.list-card[data-playlist-id="${playlistId}"]`);
  if (details && details.open) {
    const tc = details.querySelector('.tracksContainer');
    const pl = playlistsCache.find(p => p.id === playlistId);
    if (pl && tc) loadPlaylistTracks(pl, tc);
  }
}

// =========================================================
// Web Audio playback engine (sample-accurate multi-stem sync)
// =========================================================
let audioCtx = null;
let currentPlaylist = null;   // { pl, items }
let activePlaylistId = null;  // id of the playlist currentPlaylist belongs to (kept even across pause)
let currentIndex = -1;
let currentBuffers = {};      // key -> AudioBuffer
let currentSources = {};      // key -> AudioBufferSourceNode
let gainNodesCurrent = {};    // key -> GainNode
let isPlaying = false;
let isLoadingTrack = false;   // true while stems are being fetched/decoded — guards against overlapping playback
let playStartCtxTime = 0;     // audioCtx.currentTime when playback of current offset started
let playStartOffset = 0;      // offset into the track (seconds) at playStartCtxTime
let trackDuration = 0;
let repeatOne = false;
let progressTimer = null;

function setControlsDisabled(disabled) {
  document.getElementById('prevBtn').disabled = disabled;
  document.getElementById('nextBtn').disabled = disabled;
  document.getElementById('playPauseBtn').disabled = disabled;
}

function updateAllPlayButtons() {
  // "Spela listan" always means (re)start from track 1 — it never flips into a
  // pause/resume toggle just because some track happens to be playing. Per-track
  // control lives on each track's own play/pause icon and the floating player.
  Object.values(playlistPlayBtns).forEach(btn => {
    if (!btn) return;
    btn.disabled = isLoadingTrack;
  });
  updateTrackPlayIcons();
}

function updateTrackPlayIcons() {
  document.querySelectorAll('.track-play-btn').forEach(btn => {
    const plId = btn.dataset.playlistId;
    const rowId = btn.dataset.rowId;
    const row = btn.closest('.track-row');
    const activeItem = (currentPlaylist && activePlaylistId === plId) ? currentPlaylist.items[currentIndex] : null;
    const isThisTrack = activeItem && String(activeItem.rowId) === String(rowId);

    btn.classList.remove('playing-icon', 'loading-icon');
    if (row) row.classList.remove('playing');

    if (isThisTrack && isLoadingTrack) {
      btn.textContent = '⏳';
      btn.classList.add('loading-icon');
      if (row) row.classList.add('playing');
    } else if (isThisTrack && isPlaying) {
      btn.textContent = '⏸';
      btn.classList.add('playing-icon');
      if (row) row.classList.add('playing');
    } else if (isThisTrack) {
      btn.textContent = '▶';
      if (row) row.classList.add('playing');
    } else {
      btn.textContent = '▶';
    }
  });
}

async function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') {
    // Mobile browsers aggressively suspend the AudioContext (e.g. after switching
    // tabs/panels). If we don't wait for resume() before scheduling, source.start()
    // can be scheduled against a context that isn't actually running yet, producing
    // silent playback even though every JS variable looks "playing". Always await it.
    try { await audioCtx.resume(); } catch (e) { /* ignored — we'll surface failures via decode/play errors */ }
  }
}

// Stops/disconnects the currently-playing source + gain nodes WITHOUT throwing away
// the already-decoded audio buffers. Use this for anything that reschedules the SAME
// track (scrubbing, pause) — re-decoding on every scrub would also work but is slow
// and was actually the cause of a real bug (see below).
function stopCurrentSources() {
  Object.values(currentSources).forEach(src => {
    try { src.onended = null; src.stop(); } catch (e) {}
    try { src.disconnect(); } catch (e) {}
  });
  Object.values(gainNodesCurrent).forEach(g => {
    try { g.disconnect(); } catch (e) {}
  });
  currentSources = {};
  gainNodesCurrent = {};
}

// Full teardown before loading a DIFFERENT track — also drops the decoded buffers,
// since they belong to the track we're leaving.
function disconnectCurrentGainNodes() {
  stopCurrentSources();
  currentBuffers = {};
}

function applyGainForKey(item, key, val) {
  const g = gainNodesCurrent[key];
  if (!g) return;
  const muted = item.muted.has(key);
  g.gain.value = muted ? 0 : (val / 100);
}

async function fetchAndDecode(bucket, path) {
  const { data, error } = await supabaseClient.storage.from(bucket).createSignedUrl(path, 3600);
  if (error) throw error;
  const resp = await fetch(data.signedUrl);
  if (!resp.ok) throw new Error(`Kunde inte hämta ljudfil (HTTP ${resp.status})`);
  const arrBuf = await resp.arrayBuffer();
  await ensureAudioCtx();
  return await audioCtx.decodeAudioData(arrBuf);
}

let playRequestId = 0; // bumped on every playTrackAt call; lets a stale in-flight load bail out instead of clobbering a newer one

function startPlaylist(pl, items, index) {
  if (isLoadingTrack) { toast('Väntar på att föregående låt ska laddas klart...'); return; }
  currentPlaylist = { pl, items };
  activePlaylistId = pl.id;
  playTrackAt(index, 0);
}
function playSongPreview(song, stemDefs, previewId) {
  previewId = previewId || ('preview-' + song.id);
  if (isLoadingTrack) { toast('Väntar på att föregående låt ska laddas klart...'); return; }
  const activeItem = (currentPlaylist && activePlaylistId === 'preview') ? currentPlaylist.items[currentIndex] : null;
  if (activeItem && activeItem.rowId === previewId) {
    if (isPlaying) pauseAll(); else resumeAll();
    return;
  }
  const volumes = {};
  stemDefs.forEach(def => { volumes[def.key] = 100; });
  const item = {
    rowId: previewId,
    playlistId: 'preview',
    song,
    stemDefs,
    volumes,
    extraVolumesRaw: {},
    muted: new Set(),
    isPreview: true
  };
  currentPlaylist = { pl: { id: 'preview', name: song.title }, items: [item] };
  activePlaylistId = 'preview';
  playTrackAt(0, 0);
}
  
async function playTrackAt(index, offsetSeconds) {
  if (isLoadingTrack) { toast('Väntar på att föregående låt ska laddas klart...'); return; }
  if (!currentPlaylist) return;
  const items = currentPlaylist.items;
  if (index < 0 || index >= items.length) return;

  const myRequestId = ++playRequestId;
  isLoadingTrack = true;
  setControlsDisabled(true);
  updateAllPlayButtons();

  disconnectCurrentGainNodes();
  clearInterval(progressTimer);
  isPlaying = false;

  currentIndex = index;
  const item = items[index];

  document.getElementById('playerBar').classList.remove('hidden');
  setPlayerTitle(`${escapeHtml(item.song.title)} <span class="loading-tag">laddar...</span>`);
  document.getElementById('scrubber').value = 0;
  document.getElementById('curTime').textContent = '0:00';
  document.getElementById('durTime').textContent = '0:00';
  setPlayPauseIcon(false);
  markTrackRowLoading(item.rowId, true);
  setPlayerSong(item.song);

  try {
    await ensureAudioCtx();

    // Decode all stems in parallel
    const bufferEntries = await Promise.all(item.stemDefs.map(async def => {
      const buf = await fetchAndDecode(STEMS_BUCKET, def.path);
      return [def.key, buf];
    }));

    // A newer playTrackAt call has started while we were loading — discard this
    // stale result instead of overwriting/(re)connecting nodes for a track that's
    // no longer the one the user wants. This is what could otherwise cause a
    // "click, then click the next one" sequence to end in silence.
    if (myRequestId !== playRequestId) return;

    currentBuffers = {};
    bufferEntries.forEach(([k, b]) => { currentBuffers[k] = b; });

    trackDuration = timelineDuration(item);
    document.getElementById('scrubber').max = trackDuration || 1;
    document.getElementById('durTime').textContent = fmtTime(trackDuration);
    setPlayerTitle(escapeHtml(item.song.title));
    markTrackRowLoading(item.rowId, false);

    isLoadingTrack = false;
    setControlsDisabled(false);

    // Belt-and-braces: some browsers re-suspend the context between the click and
    // here if the tab was backgrounded mid-decode. Make sure it's really running
    // right before we schedule the sources.
    await ensureAudioCtx();
    if (myRequestId !== playRequestId) return;

    schedulePlaybackFrom(item, offsetSeconds || 0);
    updateMediaSession(item);
  } catch (e) {
    console.error('playTrackAt failed:', e);
    toast('Kunde inte spela låten: ' + (e.message || e));
    setPlayerTitle(escapeHtml(item.song.title));
    markTrackRowLoading(item.rowId, false);
    if (myRequestId === playRequestId) {
      isLoadingTrack = false;
      setControlsDisabled(false);
      updateAllPlayButtons();
    }
  }
}

// Titeln i spelaren: rullar fram och tillbaka om den inte får plats.
function setPlayerTitle(html) {
  const el = document.getElementById('playerTitle');
  el.innerHTML = `<span class="marquee-inner">${html}</span>`;
  requestAnimationFrame(() => updatePlayerTitleMarquee());
}
function updatePlayerTitleMarquee() {
  const el = document.getElementById('playerTitle');
  const inner = el.querySelector('.marquee-inner');
  if (!inner) return;
  const dist = inner.scrollWidth - el.clientWidth;
  if (dist > 4) {
    el.style.setProperty('--marquee-dist', dist + 'px');
    el.style.setProperty('--marquee-time', Math.max(4, dist / 30) + 's'); // ~30 px/s
    el.classList.add('marquee');
  } else {
    el.classList.remove('marquee');
  }
}
// Mät om när spelaren byter storlek (fönster, utfälld/minimerad spelare)
if ('ResizeObserver' in window) new ResizeObserver(() => updatePlayerTitleMarquee()).observe(document.getElementById('playerTitle'));
else window.addEventListener('resize', updatePlayerTitleMarquee);

function markTrackRowLoading(rowId, loading) {
  document.querySelectorAll(`.track-row[data-row-id="${rowId}"] .track-title`).forEach(el => {
    el.classList.toggle('loading', loading);
  });
}

function schedulePlaybackFrom(item, offset) {
  const startAt = audioCtx.currentTime + 0.15;
  playStartCtxTime = startAt;
  playStartOffset = offset;

  let endKey = null, endTime = -Infinity;
  item.stemDefs.forEach(def => {
    const buffer = currentBuffers[def.key];
    if (!buffer) return;
    // Förskjutning: +o = stämman ligger o s senare i tidslinjen än filen.
    const o = def.offsetSec || 0;
    const posInFile = offset - o;
    if (posInFile >= buffer.duration) return;              // den här stämman är redan slut
    if (buffer.duration + o > endTime) { endTime = buffer.duration + o; endKey = def.key; }
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const gain = audioCtx.createGain();
    const muted = item.muted.has(def.key);
    gain.gain.value = muted ? 0 : ((item.volumes[def.key] ?? 100) / 100);
    source.connect(gain);
    gain.connect(audioCtx.destination);
    if (posInFile >= 0) source.start(startAt, posInFile);
    else source.start(startAt - posInFile, 0);           // stämman börjar lite senare
    currentSources[def.key] = source;
    gainNodesCurrent[def.key] = gain;
  });

  // Lyssna på den stämma som slutar sist (inte bara den första) så att inget klipps av.
  if (endKey && currentSources[endKey]) {
    currentSources[endKey].onended = () => {
      if (isPlaying) handleTrackEnded();
    };
  }

  isPlaying = true;
  setPlayPauseIcon(true);
  startProgressTimer();
  updateAllPlayButtons();
}

function handleTrackEnded() {
  if (repeatOne) {
    playTrackAt(currentIndex, 0);
    return;
  }
  if (currentPlaylist && currentIndex < currentPlaylist.items.length - 1) {
    playTrackAt(currentIndex + 1, 0);
  } else {
    isPlaying = false;
    setPlayPauseIcon(false);
    clearInterval(progressTimer);
    updateAllPlayButtons();
  }
}

function pauseAll() {
  if (!isPlaying) return;
  const elapsed = playStartOffset + (audioCtx.currentTime - playStartCtxTime);
  stopCurrentSources();
  isPlaying = false;
  setPlayPauseIcon(false);
  clearInterval(progressTimer);
  pausedOffset = Math.max(0, elapsed);
  updateAllPlayButtons();
}

let pausedOffset = 0;

async function resumeAll() {
  if (isPlaying || isLoadingTrack || !currentPlaylist) return;
  const item = currentPlaylist.items[currentIndex];
  if (!item) return;
  await ensureAudioCtx();
  if (isPlaying || !currentPlaylist) return; // state may have changed while awaiting resume
  schedulePlaybackFrom(item, pausedOffset);
}

document.getElementById('playPauseBtn').addEventListener('click', () => {
  if (!currentPlaylist || isLoadingTrack) return;
  if (isPlaying) pauseAll();
  else resumeAll();
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if (!currentPlaylist || isLoadingTrack) return;
  const newIdx = Math.max(0, currentIndex - 1);
  playTrackAt(newIdx, 0);
});

document.getElementById('nextBtn').addEventListener('click', () => {
  if (!currentPlaylist || isLoadingTrack) return;
  const newIdx = Math.min(currentPlaylist.items.length - 1, currentIndex + 1);
  playTrackAt(newIdx, 0);
});

document.getElementById('repeatBtn').addEventListener('click', (e) => {
  repeatOne = !repeatOne;
  e.currentTarget.classList.toggle('active', repeatOne);
});

const scrubberEl = document.getElementById('scrubber');
let scrubbing = false;
scrubberEl.addEventListener('mousedown', () => { scrubbing = true; });
scrubberEl.addEventListener('touchstart', () => { scrubbing = true; });
scrubberEl.addEventListener('change', () => {
  scrubbing = false;
  if (isLoadingTrack) return;
  const val = parseFloat(scrubberEl.value);
  if (!currentPlaylist) return;
  const item = currentPlaylist.items[currentIndex];
  if (!item || !Object.keys(currentBuffers).length) return; // nothing decoded yet to scrub within
  // Reuses the already-decoded buffers for this track — must NOT clear currentBuffers here,
  // only stop the old source nodes, otherwise schedulePlaybackFrom finds no buffers and
  // silently plays nothing (this was the cause of the "scrubbing goes silent" bug).
  stopCurrentSources();
  clearInterval(progressTimer);
  isPlaying = false;
  pausedOffset = val;
  schedulePlaybackFrom(item, val);
});

function startProgressTimer() {
  clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    if (!isPlaying || scrubbing) return;
    const elapsed = playStartOffset + (audioCtx.currentTime - playStartCtxTime);
    document.getElementById('curTime').textContent = fmtTime(elapsed);
    scrubberEl.value = Math.min(elapsed, trackDuration);
    if (navigator.mediaSession && navigator.mediaSession.setPositionState) {
      try {
        navigator.mediaSession.setPositionState({
          duration: trackDuration || 0,
          playbackRate: 1,
          position: Math.min(elapsed, trackDuration || 0)
        });
      } catch (e) {}
    }
  }, 250);
}

function setPlayPauseIcon(playing) {
  document.getElementById('playPauseBtn').textContent = playing ? '⏸' : '▶';
}

function updateMediaSession(item) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: item.song.title,
    artist: 'Heavy Voices',
    album: currentPlaylist.pl.name
  });
  navigator.mediaSession.setActionHandler('play', () => { if (!isLoadingTrack) resumeAll(); });
  navigator.mediaSession.setActionHandler('pause', () => { if (!isLoadingTrack) pauseAll(); });
  navigator.mediaSession.setActionHandler('previoustrack', () => {
    if (isLoadingTrack) return;
    const newIdx = Math.max(0, currentIndex - 1);
    playTrackAt(newIdx, 0);
  });
  navigator.mediaSession.setActionHandler('nexttrack', () => {
    if (isLoadingTrack) return;
    const newIdx = Math.min(currentPlaylist.items.length - 1, currentIndex + 1);
    playTrackAt(newIdx, 0);
  });
}

// =========================================================
// Synkad text (karaoke) + sångtextdokument i spelaren
// =========================================================
let karaokeOn = true;
try { karaokeOn = localStorage.getItem('hv-karaoke') !== 'off'; } catch (e) {}
let karaokeLines = [];   // [{ time, text }] sorterat på tid
// Vilken stämmas karaoke som visas: '' = gemensam. Sparas per enhet; standard = medlemmens egen stämma.
const KARAOKE_VOICES = [
  { key: 'sopran', label: 'Sopran', short: 'S' },
  { key: 'alt',    label: 'Alt',    short: 'A' },
  { key: 'tenor',  label: 'Tenor',  short: 'T' },
  { key: 'bas',    label: 'Bas',    short: 'B' },
];
let karaokeVoice = null;
try { karaokeVoice = localStorage.getItem('hv-karaoke-voice'); } catch (e) {}

function voiceFromStamma(stamma) {
  const s = String(stamma || '').toLowerCase();
  const v = KARAOKE_VOICES.find(v => s.startsWith(v.key));
  return v ? v.key : '';
}
function availableVoices(song) {
  const voices = (song && song.lyrics_lrc_voices) || {};
  return KARAOKE_VOICES.filter(v => voices[v.key]);
}
// Vilken version som faktiskt visas: vald stämma om den finns, annars gemensam, annars första stämversionen
function effectiveVoice(song) {
  const avail = availableVoices(song);
  const want = karaokeVoice != null ? karaokeVoice : voiceFromStamma(currentMember && currentMember.stamma);
  if (want && avail.some(v => v.key === want)) return want;
  if (song && song.lyrics_lrc) return '';
  return avail.length ? avail[0].key : '';
}
function lrcForSong(song) {
  if (!song) return null;
  const v = effectiveVoice(song);
  return v ? song.lyrics_lrc_voices[v] : song.lyrics_lrc;
}
let karaokeIdx = -2;
let playerSong = null;

function parseLrc(lrc) {
  const out = [];
  (lrc || '').split(/\r?\n/).forEach(line => {
    const tags = [];
    let rest = line, m;
    while ((m = rest.match(/^\s*\[(\d+):(\d+(?:[.:]\d+)?)\]/))) {
      tags.push(parseInt(m[1], 10) * 60 + parseFloat(m[2].replace(':', '.')));
      rest = rest.slice(m[0].length);
    }
    if (!tags.length) return; // metadata som [ti:...]
    const text = rest.replace(/<\d+:\d+(?:\.\d+)?>/g, '').trim();
    tags.forEach(t => out.push({ time: t, text }));
  });
  return out.sort((a, b) => a.time - b.time);
}

function currentElapsed() {
  if (!audioCtx) return 0;
  if (isPlaying) return Math.max(0, playStartOffset + (audioCtx.currentTime - playStartCtxTime));
  return pausedOffset || 0;
}

function setPlayerSong(song) {
  playerSong = song;
  karaokeLines = parseLrc(lrcForSong(song));
  karaokeIdx = -2;
  pausedOffset = 0;
  closePlayerMenu();
  const hasSync = karaokeLines.some(l => l.text);
  const btn = document.getElementById('karaokeBtn');
  btn.disabled = !hasSync;
  btn.title = hasSync ? 'Visa/dölj synkad text' : 'Ingen synkad text för den här låten';
  buildKaraokeReel();
  document.getElementById('karaoke').classList.toggle('hidden', !(hasSync && karaokeOn));
  updateExpandAvailability();
  document.getElementById('lyricsDocBtn').classList.toggle('hidden', !(song && songDocs(song).length));
  renderKaraoke(true);
  updateVoiceBadge();
}

function buildKaraokeReel() {
  const reel = document.querySelector('#karaoke .k-reel');
  // Första elementet är en tom "intro"-rad så att första textraden väntar under mitten innan den börjar
  reel.innerHTML = '<div class="k-line k-intro"></div>' + karaokeLines.map(l =>
    l.text ? `<div class="k-line">${escapeHtml(l.text)}</div>` : '<div class="k-line k-pause">♪</div>'
  ).join('');
}

function renderKaraoke(force) {
  if (!karaokeOn || !karaokeLines.length) return;
  const box = document.getElementById('karaoke');
  if (box.classList.contains('hidden')) return;
  const t = currentElapsed();
  let idx = -1;
  for (let i = 0; i < karaokeLines.length; i++) {
    if (karaokeLines[i].time <= t) idx = i; else break;
  }
  if (idx === karaokeIdx && !force) return;

  // Stora hopp (ny låt, scrubbing, visa igen) = flytta direkt utan animation
  const jump = force || karaokeIdx < -1 || Math.abs(idx - karaokeIdx) > 2;
  karaokeIdx = idx;

  const reel = box.querySelector('.k-reel');
  const els = reel.children;
  const activeEl = els[idx + 1];
  if (!activeEl) return;
  for (let i = 0; i < els.length; i++) {
    els[i].classList.toggle('k-active', i === idx + 1 && idx >= 0);
    els[i].classList.toggle('k-past', i < idx + 1);
  }
  const y = box.clientHeight / 2 - (activeEl.offsetTop + activeEl.offsetHeight / 2);
  if (jump) box.classList.add('no-anim');
  reel.style.transform = `translateY(${y}px)`;
  if (jump) { void reel.offsetHeight; box.classList.remove('no-anim'); }
}

(function karaokeLoop() {
  renderKaraoke(false);
  requestAnimationFrame(karaokeLoop);
})();

document.getElementById('karaokeBtn').classList.toggle('active', karaokeOn);
document.getElementById('karaokeBtn').addEventListener('click', (e) => {
  // Finns stämversioner: visa meny (av / gemensam / stämmor) i stället för en ren av/på-knapp
  if (availableVoices(playerSong).length) { e.stopPropagation(); togglePlayerMenu('voice'); return; }
  karaokeOn = !karaokeOn;
  try { localStorage.setItem('hv-karaoke', karaokeOn ? 'on' : 'off'); } catch (err) {}
  e.currentTarget.classList.toggle('active', karaokeOn);
  const hasSync = karaokeLines.some(l => l.text);
  document.getElementById('karaoke').classList.toggle('hidden', !(hasSync && karaokeOn));
  updateExpandAvailability();
  karaokeIdx = -2;
  renderKaraoke(true);
});

document.getElementById('lyricsDocBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  togglePlayerMenu('docs');
});

// ---------- Popup-meny: textversion & dokument ----------
let playerMenuKind = null;

function closePlayerMenu() {
  const m = document.getElementById('playerMenu');
  m.hidden = true;
  playerMenuKind = null;
}

function togglePlayerMenu(kind) {
  if (playerMenuKind === kind) { closePlayerMenu(); return; }
  const m = document.getElementById('playerMenu');
  playerMenuKind = kind;
  m.innerHTML = kind === 'voice' ? voiceMenuHtml() : docsMenuHtml();
  // Placera precis ovanför knappraden (fungerar både i liten och utfälld spelare)
  const ctrlTop = document.getElementById('playerControls').getBoundingClientRect().top;
  m.style.bottom = Math.max(8, window.innerHeight - ctrlTop + 8) + 'px';
  m.hidden = false;
  m.querySelectorAll('[data-voice]').forEach(b => b.addEventListener('click', () => chooseKaraokeVoice(b.dataset.voice)));
  m.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { openDoc(b.dataset.open); closePlayerMenu(); }));
  m.querySelectorAll('[data-dl]').forEach(b => b.addEventListener('click', () => { downloadDoc(b.dataset.dl); closePlayerMenu(); }));
}

function voiceMenuHtml() {
  const cur = karaokeOn ? effectiveVoice(playerSong) : null;
  const item = (val, label, on) => `<button class="pm-item" data-voice="${val}" role="menuitemradio" aria-checked="${on}"><span class="pm-check">${on ? '✓' : ''}</span><span>${label}</span></button>`;
  let html = '<div class="pm-title">Synkad text</div>' + item('off', 'Dölj text', !karaokeOn);
  if (playerSong && playerSong.lyrics_lrc) html += item('', 'Gemensam (alla)', cur === '');
  availableVoices(playerSong).forEach(v => { html += item(v.key, v.label, cur === v.key); });
  return html;
}

function docsMenuHtml() {
  const docs = playerSong ? songDocs(playerSong) : [];
  if (!docs.length) return '<div class="pm-title">Inga dokument</div>';
  return '<div class="pm-title">Texter &amp; noter</div>' + docs.map(d => `
    <div class="pm-row">
      <button class="pm-item" data-open="${escapeHtml(d.path)}"><span>📄 ${escapeHtml(d.label)}</span></button>
      <button class="pm-dl" data-dl="${escapeHtml(d.path)}" title="Ladda ner" aria-label="Ladda ner ${escapeHtml(d.label)}">${DL_SVG}</button>
    </div>`).join('');
}

function chooseKaraokeVoice(val) {
  if (val === 'off') {
    karaokeOn = false;
  } else {
    karaokeOn = true;
    karaokeVoice = val;
    try { localStorage.setItem('hv-karaoke-voice', val); } catch (e) {}
  }
  try { localStorage.setItem('hv-karaoke', karaokeOn ? 'on' : 'off'); } catch (e) {}
  closePlayerMenu();
  karaokeLines = parseLrc(lrcForSong(playerSong));
  buildKaraokeReel();
  const hasSync = karaokeLines.some(l => l.text);
  document.getElementById('karaokeBtn').classList.toggle('active', karaokeOn);
  document.getElementById('karaoke').classList.toggle('hidden', !(hasSync && karaokeOn));
  updateExpandAvailability();
  updateVoiceBadge();
  karaokeIdx = -2;
  renderKaraoke(true);
}

function updateVoiceBadge() {
  const badge = document.querySelector('#karaokeBtn .voice-badge');
  if (!badge) return;
  const v = karaokeOn && availableVoices(playerSong).length ? effectiveVoice(playerSong) : '';
  const def = KARAOKE_VOICES.find(x => x.key === v);
  badge.textContent = def ? def.short : '';
  document.getElementById('karaokeBtn').title = availableVoices(playerSong).length
    ? 'Välj synkad text (gemensam eller per stämma)'
    : (document.getElementById('karaokeBtn').disabled ? 'Ingen synkad text för den här låten' : 'Visa/dölj synkad text');
}

document.addEventListener('click', (e) => {
  if (playerMenuKind && !e.target.closest('#playerMenu')) closePlayerMenu();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && playerMenuKind) closePlayerMenu(); });

// ---------- Förstorad text / helskärm ----------
let wakeLock = null;

function karaokeVisible() {
  return !document.getElementById('karaoke').classList.contains('hidden');
}
function updateExpandAvailability() {
  const canExpand = karaokeVisible();
  document.getElementById('expandBtn').classList.toggle('hidden', !canExpand);
  if (!canExpand && isExpanded()) setExpanded(false);
}
function isExpanded() {
  return document.getElementById('playerBar').classList.contains('expanded');
}
async function setExpanded(on) {
  const bar = document.getElementById('playerBar');
  const btn = document.getElementById('expandBtn');
  bar.classList.toggle('expanded', on);
  document.body.classList.toggle('player-expanded', on);
  btn.innerHTML = on ? '&#x2715;' : '&#x26F6;';
  btn.title = on ? 'Stäng helskärm' : 'Förstora texten';

  // Riktig helskärm där webbläsaren stödjer det (döljer adressfält m.m.). iPhone saknar stöd — då täcker vi bara fönstret.
  const root = document.documentElement;
  try {
    if (on && !document.fullscreenElement && root.requestFullscreen) await root.requestFullscreen({ navigationUI: 'hide' });
    if (!on && document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
  } catch (e) { /* inte tillåtet — överlägget räcker */ }

  // Håll skärmen tänd medan man sjunger med
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) {}

  karaokeIdx = -2;
  renderKaraoke(true);
}

document.getElementById('expandBtn').addEventListener('click', () => setExpanded(!isExpanded()));
// Esc / systemets "lämna helskärm" stänger även det förstorade läget
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && isExpanded()) setExpanded(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isExpanded() && !document.fullscreenElement) setExpanded(false); });
// Wake lock släpps när fliken göms — begär igen när man kommer tillbaka
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && isExpanded() && !wakeLock && 'wakeLock' in navigator) {
    try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) {}
  }
});

if (window.ResizeObserver) {
  new ResizeObserver(() => renderKaraoke(true)).observe(document.getElementById('karaoke'));
}

// Håll sidans nederkant fri från den (nu högre) spelarlisten
if (window.ResizeObserver) {
  new ResizeObserver(() => {
    const bar = document.getElementById('playerBar');
    if (!bar.classList.contains('hidden') && !bar.classList.contains('expanded')) document.body.style.paddingBottom = (bar.offsetHeight + 16) + 'px';
  }).observe(document.getElementById('playerBar'));
}
</script>
