<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forum — Heavy Voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/ui-mode.js"></script>
<style>

  .forum-composer { display:grid; grid-template-columns:minmax(0,1fr); gap:0.6rem; margin-bottom:1.4rem; }
  .forum-composer input[type=text], .forum-composer textarea { width:100%; min-width:0; box-sizing:border-box; }
  .forum-composer textarea { min-height:5rem; resize:vertical; }
  .forum-composer .row { display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap; }
  .forum-composer input[type=file] { color:var(--text-muted); font-size:0.9rem; max-width:100%; }
  .forum-status { min-height:1.2em; margin:0 0 0.8rem; font-size:0.92rem; color:var(--text-muted); }
  .forum-status.is-error { color:#f87171; }

  .forum-post { padding:1rem 1.2rem; margin-bottom:1rem; }
  .forum-meta { font-size:0.82rem; color:var(--text-muted); margin-bottom:0.4rem; display:flex; justify-content:space-between; gap:0.6rem; flex-wrap:wrap; }
  .forum-body { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.5; }
  .forum-files { display:flex; flex-wrap:wrap; gap:0.4rem; margin-top:0.6rem; }
  .forum-files button { font-size:0.85rem; padding:0.3rem 0.6rem; }
  .forum-replies { margin:0.9rem 0 0 0.9rem; padding-left:0.9rem; border-left:2px solid var(--border); }
  .forum-reply { margin-bottom:0.8rem; }
  .forum-reply:last-child { margin-bottom:0; }
  .forum-reply-box { margin-top:0.8rem; }
  .forum-title { margin:0 0 0.5rem; font-size:1.25rem; overflow-wrap:anywhere; }
  .forum-post > summary { cursor:pointer; list-style:none; }
  .forum-post > summary::-webkit-details-marker { display:none; }
  .forum-post > summary .forum-title::after { content:' ▾'; color:var(--text-muted); font-size:0.9em; }
  .forum-post[open] > summary .forum-title::after { content:' ▴'; }
  .forum-aud { display:flex; gap:1rem; flex-wrap:wrap; font-size:0.92rem; }
  .forum-aud label { display:flex; align-items:center; gap:0.4rem; margin:0; cursor:pointer; }
  .forum-picker { display:flex; flex-direction:column; gap:0.5rem; }
  .forum-picker[hidden] { display:none; }
  .forum-members { max-height:240px; overflow-y:auto; border:1px solid var(--border); border-radius:0.5rem; padding:0.3rem 0.6rem; }
  .forum-members label { display:flex; align-items:center; gap:0.5rem; padding:0.35rem 0; margin:0; cursor:pointer; }
  .forum-members label[hidden] { display:none; }
  .forum-badge { display:inline-block; font-size:0.78rem; font-weight:500; padding:0.1rem 0.5rem; margin-left:0.5rem; border:1px solid var(--border); border-radius:999px; color:var(--text-muted); vertical-align:middle; }
  .forum-del { margin-top:0.6rem; font-size:0.82rem; padding:0.25rem 0.6rem; border-color:#f87171; color:#fca5a5; }

  /* Stramt utseende (test): "Nytt inlägg"-knapp i stället för formuläret överst */
  .forum-title { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .forum-title h1 { margin: 0.67em 0; }
  html[data-ui="stram"] #newPostBtn { display: inline-flex !important; }
  html[data-ui="stram"]:not(.forum-compose) form[data-form="new"] { display: none; }
</style>
</head>
<body>
<header class="site-header site-header--small"><a href="/medlem/" class="site-logo-link" aria-label="Heavy Voices – till startsidan"><picture><source srcset="/icons/logo-text.webp" type="image/webp"><img src="/icons/logo-text.png" alt="Heavy Voices" class="site-logo-text" width="480" height="220"></picture></a></header>
<div class="container">
  <a href="/medlem/" class="back-btn">&larr; Tillbaka</a>
  <div class="forum-title"><h1>Forum</h1><button type="button" class="btn-gold ui-stram-only" id="newPostBtn" aria-expanded="false">Nytt inlägg</button></div>
  <p class="text-muted" style="margin:0 0 1rem;">Diskutera och dela filer med kören. Den som startar en tråd väljer vem som ser den: alla, körledningen eller valda medlemmar.</p>

  <p class="forum-status" id="forumStatus" role="status"></p>

  <div id="forumBody"><p class="text-muted">Laddar...</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
const STAMMOR = ['Sopran', 'Alt', 'Tenor', 'Bas'];
const MAX_FILE_MB = 25;
const MAX_FILES = 10;

let me = null;
let posts = [];   // alla inlägg som den inloggade får se (RLS)
let medlemmar = [];   // godkända medlemmar {id, name}, för mottagarlistan och namn i märket
const stangda = new Set();   // trådar som användaren har fällt ihop (behålls vid omladdning)

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setStatus(text, isError) {
  const el = document.getElementById('forumStatus');
  el.textContent = text || '';
  el.classList.toggle('is-error', !!isError);
}

function formatWhen(iso) {
  return new Date(iso).toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short', timeZone: 'Europe/Stockholm' });
}

function fileSize(bytes) {
  if (!bytes) return '';
  return bytes > 1024 * 1024 ? (bytes / 1024 / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' kB';
}

// ---------- hämta och visa ----------
async function loadPosts() {
  const body = document.getElementById('forumBody');
  const { data, error } = await supabaseClient.from('forum_posts')
    .select('id, stamma, author_id, parent_id, title, body, created_at, visibility, recipients, author:members!forum_posts_author_id_fkey(name), forum_attachments(id, path, name, size)')
    .order('created_at', { ascending: true });
  if (error) {
    body.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
    return;
  }
  posts = data || [];
  renderPosts();
}

function attachmentsHtml(p) {
  const files = p.forum_attachments || [];
  if (!files.length) return '';
  return `<div class="forum-files">${files.map(f =>
    `<button type="button" class="btn-outline" data-att-path="${escapeHtml(f.path)}" data-att-name="${escapeHtml(f.name)}">📎 ${escapeHtml(f.name)}${f.size ? ` <span class="text-muted">(${fileSize(f.size)})</span>` : ''}</button>`
  ).join('')}</div>`;
}

async function loadMembers() {
  const { data } = await supabaseClient.from('members').select('id, name').eq('status', 'approved').order('name');
  medlemmar = data || [];
}

const memberName = id => (medlemmar.find(m => m.id === id) || {}).name || 'okänd';

// Märke vid rubriken för trådar som inte är öppna för alla
function synlighetHtml(p) {
  if (p.visibility === 'korledning') return `<span class="forum-badge" title="Syns för stämledare, admin och trådskaparen">🔒 Körledningen</span>`;
  if (p.visibility === 'valda') {
    const namn = [p.author_id, ...(p.recipients || [])].filter((v, i, a) => a.indexOf(v) === i).map(memberName);
    const kort = namn.length > 3 ? `${namn.slice(0, 3).join(', ')} +${namn.length - 3}` : namn.join(', ');
    return `<span class="forum-badge" title="Syns bara för: ${escapeHtml(namn.join(', '))}">🔒 ${escapeHtml(kort)}</span>`;
  }
  return '';
}

function postHtml(p) {
  const kanBorta = p.author_id === me.id || isSongEditor(me);
  return `
    <div class="forum-meta">
      <span>${escapeHtml(p.author?.name || 'Borttagen medlem')}${p.stamma ? ' · ' + escapeHtml(p.stamma) : ''}</span>
      <span>${formatWhen(p.created_at)}</span>
    </div>
    <div class="forum-body">${escapeHtml(p.body)}</div>
    ${attachmentsHtml(p)}
    ${kanBorta ? `<button type="button" class="btn-outline forum-del" data-del="${p.id}">Ta bort</button>` : ''}`;
}

function renderPosts() {
  const body = document.getElementById('forumBody');
  const toppar = posts.filter(p => !p.parent_id).reverse();   // nyast först
  const svar = {};
  posts.filter(p => p.parent_id).forEach(p => { (svar[p.parent_id] = svar[p.parent_id] || []).push(p); });

  const composer = `
    <form class="forum-composer card" data-form="new" style="padding:1rem 1.2rem;">
      <label style="font-weight:700;">Nytt ämne</label>
      <input type="text" name="title" maxlength="150" required placeholder="Rubrik – vad handlar det om?">
      <textarea name="body" maxlength="5000" required placeholder="Skriv något..."></textarea>
      <div class="forum-aud" role="radiogroup" aria-label="Vem ser tråden?">
        <strong>Vem ser tråden?</strong>
        <label><input type="radio" name="visibility" value="alla" checked> Alla medlemmar</label>
        <label><input type="radio" name="visibility" value="korledning"> Körledningen</label>
        <label><input type="radio" name="visibility" value="valda"> Valda medlemmar</label>
      </div>
      <div class="forum-picker" hidden>
        <input type="search" class="forum-search" placeholder="Sök medlem…">
        <div class="forum-members">${medlemmar.filter(m => m.id !== me.id).map(m =>
          `<label><input type="checkbox" class="forum-recipient" value="${m.id}"> ${escapeHtml(m.name)}</label>`).join('') || '<p class="text-muted">Inga andra medlemmar hittades.</p>'}</div>
      </div>
      <div class="row">
        <input type="file" name="files" multiple>
        <button type="submit" class="btn">Publicera</button>
      </div>
    </form>`;

  const inlagg = toppar.length
    ? toppar.map(p => `
        <details class="card forum-post" data-thread="${p.id}" ${stangda.has(p.id) ? '' : 'open'}>
          <summary><h2 class="forum-title">${escapeHtml(p.title || '')}${synlighetHtml(p)}</h2></summary>
          ${postHtml(p)}
          <div class="forum-replies">
            ${(svar[p.id] || []).map(r => `<div class="forum-reply">${postHtml(r)}</div>`).join('')}
          </div>
          <form class="forum-composer forum-reply-box" data-form="reply" data-parent="${p.id}">
            <textarea name="body" maxlength="5000" required placeholder="Skriv ett svar..."></textarea>
            <div class="row">
              <input type="file" name="files" multiple>
              <button type="submit" class="btn-outline">Skicka svar</button>
            </div>
          </form>
        </details>`).join('')
    : '<p class="text-muted">Inga inlägg ännu. Var först att skriva något!</p>';

  body.innerHTML = composer + inlagg;
}

// ---------- skriva ----------
async function laddaUppBilagor(postId, files) {
  const rader = [];
  for (const file of files) {
    const namn = file.name.replace(/[\\/:*?"<>|]+/g, '_').slice(0, 120);
    const sokvag = `${postId}/${crypto.randomUUID().slice(0, 8)}-${namn}`;
    const { error } = await supabaseClient.storage.from('heavy-voices-forum')
      .upload(sokvag, file, { contentType: file.type || 'application/octet-stream' });
    if (error) throw new Error(`Kunde inte ladda upp ${file.name}: ${error.message}`);
    rader.push({ post_id: postId, path: sokvag, name: file.name, size: file.size, content_type: file.type || null });
  }
  if (rader.length) {
    const { error } = await supabaseClient.from('forum_attachments').insert(rader);
    if (error) throw new Error('Filerna laddades upp men kopplingen till inlägget misslyckades: ' + error.message);
  }
}

async function skickaInlagg(form) {
  const text = form.body.value.trim();
  const files = [...form.files.files];
  const parentId = form.dataset.parent || null;
  const title = parentId ? null : (form.querySelector('[name=title]')?.value || '').trim();
  if (!parentId && !title) return setStatus('Skriv en rubrik först.', true);
  if (!text) return setStatus('Skriv något först.', true);
  if (files.length > MAX_FILES) return setStatus(`Max ${MAX_FILES} filer per inlägg.`, true);
  const visibility = parentId ? 'alla' : (form.querySelector('[name=visibility]:checked')?.value || 'alla');
  const recipients = visibility === 'valda' ? [...form.querySelectorAll('.forum-recipient:checked')].map(c => c.value) : [];
  if (visibility === 'valda' && !recipients.length) return setStatus('Välj minst en medlem som ska se tråden.', true);
  const stora = files.find(f => f.size > MAX_FILE_MB * 1024 * 1024);
  if (stora) return setStatus(`${stora.name} är större än ${MAX_FILE_MB} MB.`, true);

  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true;
  setStatus('Publicerar...');
  try {
    const postId = crypto.randomUUID();
    const { error } = await supabaseClient.from('forum_posts').insert({
      id: postId, stamma: STAMMOR.includes(me.stamma) ? me.stamma : null, author_id: me.id, parent_id: parentId, title, body: text,
      visibility, recipients,
    });
    if (error) throw new Error(error.message);
    await laddaUppBilagor(postId, files);
    setStatus('Inlägget är publicerat.');
    await loadPosts();
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    btn.disabled = false;
  }
}

async function oppnaBilaga(path, name) {
  setStatus('Hämtar fil...');
  const { data, error } = await supabaseClient.storage.from('heavy-voices-forum')
    .createSignedUrl(path, 60, { download: name });
  if (error || !data?.signedUrl) return setStatus('Kunde inte hämta filen: ' + (error?.message || 'okänt fel'), true);
  setStatus('');
  window.open(data.signedUrl, '_blank', 'noopener');
}

async function taBortInlagg(id) {
  const nSvar = posts.filter(p => String(p.parent_id) === String(id)).length;
  if (!confirm(nSvar ? `Ta bort inlägget? Det har ${nSvar} svar, som också tas bort tillsammans med alla bilagor. Det går inte att ångra.` : 'Ta bort inlägget? Bilagorna tas också bort. Det går inte att ångra.')) return;
  const { error } = await supabaseClient.from('forum_posts').delete().eq('id', id);
  if (error) return setStatus('Kunde inte ta bort: ' + error.message, true);
  setStatus('Inlägget är borttaget.');
  await loadPosts();
}

// ---------- händelser ----------
document.getElementById('forumBody').addEventListener('toggle', (e) => {
  const d = e.target;
  if (!d.matches || !d.matches('details[data-thread]')) return;
  if (d.open) stangda.delete(d.dataset.thread); else stangda.add(d.dataset.thread);
}, true);

document.getElementById('forumBody').addEventListener('change', (e) => {
  if (!e.target.matches('input[name=visibility]')) return;
  const form = e.target.closest('form');
  form.querySelector('.forum-picker').hidden = e.target.value !== 'valda';
});

document.getElementById('forumBody').addEventListener('input', (e) => {
  if (!e.target.matches('.forum-search')) return;
  const q = e.target.value.trim().toLowerCase();
  e.target.closest('.forum-picker').querySelectorAll('.forum-members label').forEach(l => {
    l.hidden = !!q && !l.textContent.toLowerCase().includes(q);
  });
});

document.getElementById('forumBody').addEventListener('submit', (e) => {
  if (!e.target.matches('form[data-form]')) return;
  e.preventDefault();
  skickaInlagg(e.target);
});

document.getElementById('forumBody').addEventListener('click', (e) => {
  const att = e.target.closest('button[data-att-path]');
  if (att) return oppnaBilaga(att.dataset.attPath, att.dataset.attName);
  const del = e.target.closest('button[data-del]');
  if (del) return taBortInlagg(del.dataset.del);
});

(async () => {
  me = await requireAuth();
  if (!me) return;
  await loadMembers();
  await loadPosts();
})();
</script>


<script>
(function () {
  const b = document.getElementById('newPostBtn'); if (!b) return;
  b.addEventListener('click', () => {
    const on = document.documentElement.classList.toggle('forum-compose');
    b.setAttribute('aria-expanded', String(on));
    b.textContent = on ? 'Stäng' : 'Nytt inlägg';
    if (on) { const f = document.querySelector('form[data-form="new"] input[name="title"]'); if (f) f.focus(); }
  });
})();
</script>
</body>
</html>
