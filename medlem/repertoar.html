<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repertoar — Heavy Voices</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .song-card { border-bottom: 1px solid var(--border); }
  .song-card:last-child { border-bottom: none; }
  .song-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 0; cursor: pointer; list-style: none;
  }
  .song-header::-webkit-details-marker { display: none; }
  .song-header .title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.03em; }
  .song-header .arrow { transition: transform 0.15s; color: var(--text-muted); font-size: 1.1rem; }
  details[open] .song-header .arrow { transform: rotate(180deg); }
  .song-body { padding: 0 0 1.2rem 0; }
  h4.section-heading { margin: 1rem 0 0.4rem 0; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .doc-links { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .doc-links a button { font-size: 0.85rem; padding: 0.4rem 0.8rem; background: transparent; border: 1px solid var(--border); }
  .lyrics-preview { white-space: pre-wrap; font-size: 0.9rem; line-height: 1.6; color: var(--text-muted); max-height: 150px; overflow-y: auto; margin-top: 0.5rem; }
  .stem-checks { display: flex; flex-direction: column; gap: 0.4rem; }
  .stem-checks label { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; }
  .add-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.75rem; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 0.4rem 0.6rem; }
  .success { color: #4ade80; font-size: 0.85rem; }
</style>
</head>
<body>

<div class="container">
  <div class="top-nav">
    <a href="/medlem/spelare.html" class="top-nav-link">Spellistor</a>
    <a href="/medlem/repertoar.html" class="top-nav-link active">Repertoar</a>
    <a href="/medlem/skapa-spellista.html" class="top-nav-link">Skapa spellista</a>
  </div>

  <a href="/medlem/spelare.html" class="back-btn">&larr; Tillbaka till Spelaren</a>
  <h1>Repertoar</h1>

  <div class="card">
    <div id="repertoireSection"><p class="text-muted">Laddar...</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/auth.js"></script>
<script>
const stemFields = [
  { key: 'stem_backtrack_path', label: 'Backtrack', vol: 'vol_backtrack' },
  { key: 'stem_sopran_path', label: 'Sopran', vol: 'vol_sopran' },
  { key: 'stem_alt_path', label: 'Alt', vol: 'vol_alt' },
  { key: 'stem_tenor_path', label: 'Tenor', vol: 'vol_tenor' },
  { key: 'stem_bas_path', label: 'Bas', vol: 'vol_bas' },
];

let songs = [];
let playlists = [];
let currentMemberId = null;
const docLoaded = {};

async function loadPlaylists() {
  const { data } = await supabaseClient
    .from('playlists')
    .select('id, name')
    .eq('member_id', currentMemberId)
    .order('created_at');
  playlists = data || [];
}

async function loadRepertoire() {
  const { data, error } = await supabaseClient
    .from('songs')
    .select('*')
    .order('title');

  const el = document.getElementById('repertoireSection');

  if (error) {
    el.innerHTML = `<p class="error">Kunde inte hämta repertoaren: ${error.message}</p>`;
    return;
  }

  songs = data || [];

  if (!songs.length) {
    el.innerHTML = `<p class="text-muted">Inga låtar tillagda än.</p>`;
    return;
  }

  el.innerHTML = songs.map(s => renderSongCard(s)).join('');

  document.querySelectorAll('details.song-details').forEach(det => {
    det.addEventListener('toggle', () => {
      if (det.open) loadDocsForSong(det.dataset.id);
    });
  });

  document.querySelectorAll('.selectAllStems').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const songId = e.target.dataset.id;
      document.querySelectorAll(`.stemCheck[data-song="${songId}"]`).forEach(sc => sc.checked = e.target.checked);
    });
  });

  document.querySelectorAll('.playlistSelect').forEach(sel => {
    sel.addEventListener('change', (e) => {
      const songId = e.target.dataset.id;
      const newNameField = document.querySelector(`.newPlaylistName[data-id="${songId}"]`);
      if (newNameField) newNameField.style.display = e.target.value === '__new__' ? 'block' : 'none';
    });
  });

  document.querySelectorAll('.addSelectedBtn').forEach(btn => {
    btn.addEventListener('click', (e) => addToPlaylist(e.target.dataset.id, false));
  });
  document.querySelectorAll('.addAllBtn').forEach(btn => {
    btn.addEventListener('click', (e) => addToPlaylist(e.target.dataset.id, true));
  });
}

function playlistOptionsHtml(songId) {
  const opts = playlists.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  return `
    <select class="playlistSelect" data-id="${songId}">
      ${opts}
      <option value="__new__">+ Ny spellista...</option>
    </select>
    <input type="text" class="newPlaylistName" data-id="${songId}" placeholder="Namn på ny spellista" style="display: none; width: 180px;">
  `;
}

function renderSongCard(s) {
  const availableStems = stemFields.filter(f => s[f.key]);
  return `
    <div class="song-card">
      <details class="song-details" data-id="${s.id}">
        <summary class="song-header">
          <span class="title">${s.title}</span>
          <span class="arrow">&#9660;</span>
        </summary>
        <div class="song-body">
          <h4 class="section-heading">Noter &amp; text</h4>
          <div class="doc-links" data-docs="${s.id}"><span class="text-muted" style="font-size: 0.85rem;">Laddar...</span></div>
          ${s.lyrics_plain ? `<div class="lyrics-preview">${s.lyrics_plain}</div>` : ''}

          <h4 class="section-heading">Stämfiler</h4>
          ${availableStems.length ? `
            <label style="font-size: 0.85rem; margin-bottom: 0.4rem; display:block;">
              <input type="checkbox" class="selectAllStems" data-id="${s.id}" checked style="width:auto; margin-right:0.4rem;">
              Välj alla
            </label>
            <div class="stem-checks">
              ${availableStems.map(f => `
                <label>
                  <input type="checkbox" class="stemCheck" data-song="${s.id}" data-field="${f.vol}" checked style="width:auto;">
                  ${f.label}
                </label>
              `).join('')}
            </div>
            <div class="add-row">
              ${playlistOptionsHtml(s.id)}
              <button type="button" class="addSelectedBtn btn-small" data-id="${s.id}">Lägg till valda i spellista</button>
              <button type="button" class="addAllBtn btn-small" data-id="${s.id}" style="background: transparent; border: 1px solid var(--border);">Lägg till alla stämmor</button>
            </div>
            <p class="success" id="addSuccess-${s.id}"></p>
            <p class="error" id="addError-${s.id}"></p>
          ` : `<p class="text-muted">Inga stämfiler uppladdade än.</p>`}
        </div>
      </details>
    </div>
  `;
}

async function loadDocsForSong(songId) {
  if (docLoaded[songId]) return;
  docLoaded[songId] = true;

  const song = songs.find(s => s.id === songId);
  const container = document.querySelector(`[data-docs="${songId}"]`);
  const links = [];

  if (song.sheet_music_path) {
    const { data } = await supabaseClient.storage.from('heavy-voices-noter').createSignedUrl(song.sheet_music_path, 3600);
    if (data) links.push(`<a href="${data.signedUrl}" target="_blank"><button type="button">Noter (PDF)</button></a>`);
  }
  if (song.lyrics_pdf_path) {
    const { data } = await supabaseClient.storage.from('heavy-voices-noter').createSignedUrl(song.lyrics_pdf_path, 3600);
    if (data) links.push(`<a href="${data.signedUrl}" target="_blank"><button type="button">Sångtext (PDF)</button></a>`);
  }
  const stamtext = [
    { key: 'lyrics_sopran_path', label: 'Text Sopran' },
    { key: 'lyrics_alt_path', label: 'Text Alt' },
    { key: 'lyrics_tenor_path', label: 'Text Tenor' },
    { key: 'lyrics_bas_path', label: 'Text Bas' },
  ];
  for (const st of stamtext) {
    if (song[st.key]) {
      const { data } = await supabaseClient.storage.from('heavy-voices-noter').createSignedUrl(song[st.key], 3600);
      if (data) links.push(`<a href="${data.signedUrl}" target="_blank"><button type="button">${st.label}</button></a>`);
    }
  }

  container.innerHTML = links.length ? links.join('') : `<span class="text-muted" style="font-size:0.85rem;">Inget uppladdat.</span>`;
}

async function addToPlaylist(songId, selectAll) {
  const successEl = document.getElementById(`addSuccess-${songId}`);
  const errorEl = document.getElementById(`addError-${songId}`);
  successEl.textContent = '';
  errorEl.textContent = '';

  const checks = document.querySelectorAll(`.stemCheck[data-song="${songId}"]`);
  const volumes = {};
  checks.forEach(cb => {
    volumes[cb.dataset.field] = (selectAll || cb.checked) ? 100 : 0;
  });

  const select = document.querySelector(`.playlistSelect[data-id="${songId}"]`);
  let playlistId = select.value;

  if (playlistId === '__new__') {
    const nameField = document.querySelector(`.newPlaylistName[data-id="${songId}"]`);
    const name = nameField.value.trim();
    if (!name) { errorEl.textContent = 'Ange ett namn för den nya spellistan.'; return; }
    const { data: newPl, error: plError } = await supabaseClient
      .from('playlists').insert({ member_id: currentMemberId, name }).select().single();
    if (plError) { errorEl.textContent = 'Kunde inte skapa spellista: ' + plError.message; return; }
    playlistId = newPl.id;
    playlists.push(newPl);
  } else if (!playlistId) {
    errorEl.textContent = 'Välj en spellista.';
    return;
  }

  const { data: existing } = await supabaseClient
    .from('playlist_songs').select('id').eq('playlist_id', playlistId).eq('song_id', songId).maybeSingle();

  if (existing) {
    const { error } = await supabaseClient.from('playlist_songs').update(volumes).eq('id', existing.id);
    if (error) { errorEl.textContent = error.message; return; }
  } else {
    const { error } = await supabaseClient.from('playlist_songs').insert({ playlist_id: playlistId, song_id: songId, ...volumes });
    if (error) { errorEl.textContent = error.message; return; }
  }

  successEl.textContent = 'Tillagd i spellistan.';
}

(async () => {
  const member = await requireAuth();
  if (member) {
    currentMemberId = member.id;
    await loadPlaylists();
    loadRepertoire();
  }
})();
</script>

</body>
</html>
